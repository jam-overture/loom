<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a33"/>
    </marker>
  </defs>

  <rect width="980" height="760" fill="#ffffff"/>

  <text x="32" y="42" font-size="21" font-weight="600" fill="#111">One sign-in attempt — the log is asked before the key is compared</text>
  <text x="32" y="64" font-size="13" fill="#666">0034: a lockout has to take away the oracle, not only the throughput. An attempt that cannot be counted is refused.</text>

  <!-- ============ lanes ============ -->
  <text x="96" y="106" font-size="12.5" font-weight="600" text-anchor="middle" fill="#333">request</text>
  <text x="300" y="106" font-size="12.5" font-weight="600" text-anchor="middle" fill="#333">subject.ts</text>
  <text x="520" y="106" font-size="12.5" font-weight="600" text-anchor="middle" fill="#333">attemptSignIn</text>
  <text x="748" y="106" font-size="12.5" font-weight="600" text-anchor="middle" fill="#333">AttemptLog</text>
  <text x="900" y="106" font-size="12.5" font-weight="600" text-anchor="middle" fill="#333">roster</text>

  <line x1="96" y1="118" x2="96" y2="500" stroke="#ddd"/>
  <line x1="300" y1="118" x2="300" y2="500" stroke="#ddd"/>
  <line x1="520" y1="118" x2="520" y2="500" stroke="#ddd"/>
  <line x1="748" y1="118" x2="748" y2="500" stroke="#ddd"/>
  <line x1="900" y1="118" x2="900" y2="500" stroke="#ddd"/>

  <!-- 1. address -->
  <line x1="96" y1="146" x2="296" y2="146" stroke="#444" marker-end="url(#arrow)"/>
  <text x="196" y="140" font-size="11.5" text-anchor="middle" fill="#333">x-forwarded-for</text>
  <text x="196" y="163" font-size="10.5" text-anchor="middle" fill="#888">read from the right, by hop count</text>

  <!-- 2. digest -->
  <line x1="300" y1="196" x2="516" y2="196" stroke="#444" marker-end="url(#arrow)"/>
  <text x="408" y="190" font-size="11.5" text-anchor="middle" fill="#333">subject = HMAC(address, secret)</text>
  <text x="408" y="213" font-size="10.5" text-anchor="middle" fill="#888">never the address itself</text>

  <!-- 3. recall -->
  <line x1="520" y1="252" x2="744" y2="252" stroke="#444" marker-end="url(#arrow)"/>
  <text x="632" y="246" font-size="11.5" text-anchor="middle" fill="#333">recall(subject, cutoff)</text>
  <line x1="744" y1="278" x2="524" y2="278" stroke="#8a8a8a" stroke-dasharray="4 3" marker-end="url(#arrowLight)"/>
  <text x="632" y="272" font-size="11" text-anchor="middle" fill="#666">failures, firstFailureAt, lastFailureAt</text>

  <!-- gate box -->
  <rect x="404" y="298" width="232" height="52" rx="5" fill="#fdf2e2" stroke="#c98a1e" stroke-width="2"/>
  <text x="520" y="320" font-size="12.5" font-weight="600" text-anchor="middle" fill="#8a5a06">assess(record, now, policy)</text>
  <text x="520" y="338" font-size="10.5" text-anchor="middle" fill="#8a5a06">locked? → return, having compared nothing</text>

  <!-- early exits -->
  <line x1="404" y1="324" x2="120" y2="324" stroke="#a33" marker-end="url(#arrowRed)"/>
  <text x="262" y="317" font-size="11" text-anchor="middle" fill="#a33">locked — "try again in 4 minutes"</text>

  <!-- unavailable exit -->
  <line x1="404" y1="292" x2="120" y2="292" stroke="#a33" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
  <text x="262" y="285" font-size="11" text-anchor="middle" fill="#a33">log unavailable — refused, uncounted</text>

  <!-- 4. compare -->
  <line x1="520" y1="382" x2="896" y2="382" stroke="#444" marker-end="url(#arrow)"/>
  <text x="708" y="376" font-size="11.5" text-anchor="middle" fill="#333">authenticate(reviewers, key)</text>
  <text x="708" y="399" font-size="10.5" text-anchor="middle" fill="#888">reached only by a caller who is not locked out</text>

  <!-- 5. record -->
  <line x1="520" y1="440" x2="744" y2="440" stroke="#444" marker-end="url(#arrow)"/>
  <text x="632" y="434" font-size="11.5" text-anchor="middle" fill="#333">wrong → penalise · right → forgive</text>
  <text x="632" y="457" font-size="10.5" text-anchor="middle" fill="#888">one statement, so parallel guesses all count</text>

  <line x1="520" y1="484" x2="120" y2="484" stroke="#2f5c2f" marker-end="url(#arrow)"/>
  <text x="320" y="477" font-size="11" text-anchor="middle" fill="#2f5c2f">accepted — session minted, count cleared</text>

  <!-- ============ the ladder ============ -->
  <line x1="32" y1="530" x2="948" y2="530" stroke="#e4e4e4"/>

  <text x="32" y="562" font-size="13" font-weight="600" fill="#333">What one caller's failures cost them</text>
  <text x="32" y="582" font-size="11.5" fill="#777">Shipped policy: five tolerated per hour, doubling to a fifteen-minute ceiling, forgotten after an hour of silence.</text>

  <rect x="32" y="600" width="86" height="44" rx="5" fill="#f4f4f4" stroke="#bbb"/>
  <text x="75" y="620" font-size="12" text-anchor="middle" fill="#333">1 – 4</text>
  <text x="75" y="636" font-size="10.5" text-anchor="middle" fill="#888">no wait</text>

  <rect x="130" y="600" width="86" height="44" rx="5" fill="#fdf2e2" stroke="#c98a1e"/>
  <text x="173" y="620" font-size="12" font-weight="600" text-anchor="middle" fill="#8a5a06">5th</text>
  <text x="173" y="636" font-size="10.5" text-anchor="middle" fill="#8a5a06">1 minute</text>

  <rect x="228" y="600" width="86" height="44" rx="5" fill="#fdf2e2" stroke="#c98a1e"/>
  <text x="271" y="620" font-size="12" font-weight="600" text-anchor="middle" fill="#8a5a06">6th</text>
  <text x="271" y="636" font-size="10.5" text-anchor="middle" fill="#8a5a06">2 minutes</text>

  <rect x="326" y="600" width="86" height="44" rx="5" fill="#fdf2e2" stroke="#c98a1e"/>
  <text x="369" y="620" font-size="12" font-weight="600" text-anchor="middle" fill="#8a5a06">7th</text>
  <text x="369" y="636" font-size="10.5" text-anchor="middle" fill="#8a5a06">4 minutes</text>

  <rect x="424" y="600" width="86" height="44" rx="5" fill="#fdf2e2" stroke="#c98a1e"/>
  <text x="467" y="620" font-size="12" font-weight="600" text-anchor="middle" fill="#8a5a06">8th</text>
  <text x="467" y="636" font-size="10.5" text-anchor="middle" fill="#8a5a06">8 minutes</text>

  <rect x="522" y="600" width="112" height="44" rx="5" fill="#f6ecec" stroke="#a33" stroke-width="2"/>
  <text x="578" y="620" font-size="12" font-weight="600" text-anchor="middle" fill="#a33">9th onward</text>
  <text x="578" y="636" font-size="10.5" text-anchor="middle" fill="#a33">15 minutes</text>

  <line x1="118" y1="622" x2="128" y2="622" stroke="#8a8a8a" marker-end="url(#arrowLight)"/>
  <line x1="216" y1="622" x2="226" y2="622" stroke="#8a8a8a" marker-end="url(#arrowLight)"/>
  <line x1="314" y1="622" x2="324" y2="622" stroke="#8a8a8a" marker-end="url(#arrowLight)"/>
  <line x1="412" y1="622" x2="422" y2="622" stroke="#8a8a8a" marker-end="url(#arrowLight)"/>
  <line x1="510" y1="622" x2="520" y2="622" stroke="#8a8a8a" marker-end="url(#arrowLight)"/>

  <rect x="666" y="592" width="282" height="60" rx="5" fill="#f7f9f7" stroke="#5b8f5b"/>
  <text x="682" y="613" font-size="11.5" fill="#2f5c2f">A patient attacker who waits out every lockout</text>
  <text x="682" y="631" font-size="11.5" fill="#2f5c2f">gets ~96 guesses a day. A correct key at any</text>
  <text x="682" y="645" font-size="11.5" fill="#2f5c2f">point clears the count entirely.</text>

  <text x="32" y="692" font-size="11.5" fill="#777">Not defended here: a caller who rotates addresses. A global cap would be a lockout of every reviewer that any anonymous</text>
  <text x="32" y="710" font-size="11.5" fill="#777">caller could trigger, so 0034 rejects it and says the defence belongs in front of the app rather than inside it.</text>
  <text x="32" y="736" font-size="11.5" fill="#777">Without DATABASE_URL the count lives in one process: a real throttle on pnpm dev, a soft one across serverless instances.</text>
</svg>
