<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <style>
    .t { fill: #18181b; }
    .m { fill: #52525b; }
    .box { fill: #fafafa; stroke: #d4d4d8; }
    .ok { fill: #f0fdf4; stroke: #86efac; }
    .bad { fill: #fef2f2; stroke: #fca5a5; }
    .okt { fill: #166534; }
    .badt { fill: #991b1b; }
    .arrow { stroke: #a1a1aa; fill: none; }
    text { font-size: 13px; }
    .h { font-size: 15px; font-weight: 700; }
    .k { font-size: 11px; letter-spacing: .06em; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #fafafa } .m { fill: #a1a1aa }
      .box { fill: #1c1c1f; stroke: #3f3f46 }
      .ok { fill: #0d2017; stroke: #15803d } .bad { fill: #220f0f; stroke: #b91c1c }
      .okt { fill: #4ade80 } .badt { fill: #f87171 }
      .arrow { stroke: #52525b }
    }
  </style>

  <text class="h t" x="24" y="30">What the palette's query string was holding up</text>
  <text class="m" x="24" y="52">`/what-you-run`, measured with `next build` on 1 November 2026.</text>

  <!-- Served per request -->
  <rect class="ok" x="24" y="76" width="400" height="168" rx="8"/>
  <text class="k okt" x="44" y="102">AS IT SHIPS — f</text>
  <text class="t" x="44" y="126">The route reads `searchParams`, so Next.js</text>
  <text class="t" x="44" y="146">serves it on demand.</text>
  <rect class="box" x="44" y="160" width="160" height="34" rx="5"/>
  <text class="m" x="56" y="182">store, revision N</text>
  <path class="arrow" d="M212 177 L252 177" marker-end="url(#a)"/>
  <rect class="box" x="258" y="160" width="146" height="34" rx="5"/>
  <text class="m" x="270" y="182">the reader</text>
  <text class="okt" x="44" y="222">An accepted change reaches the next reader.</text>

  <!-- Prerendered -->
  <rect class="bad" x="456" y="76" width="400" height="168" rx="8"/>
  <text class="k badt" x="476" y="102">BOTH READS REMOVED — o</text>
  <text class="t" x="476" y="126">The row is read once, at build time, and</text>
  <text class="t" x="476" y="146">that copy is served until the next deploy.</text>
  <rect class="box" x="476" y="160" width="160" height="34" rx="5"/>
  <text class="m" x="488" y="182">store, revision 1</text>
  <path class="arrow" d="M644 177 L684 177" marker-end="url(#a)"/>
  <rect class="box" x="690" y="160" width="146" height="34" rx="5"/>
  <text class="m" x="702" y="182">every reader</text>
  <text class="badt" x="476" y="222">The portal governs a page nobody is served.</text>

  <!-- the middle row -->
  <rect class="box" x="24" y="268" width="832" height="86" rx="8"/>
  <text class="h t" x="44" y="294">The step in between is why this is a trap</text>
  <text class="t" x="44" y="318">Remove the palette from the page component alone and the route stays `f`, because</text>
  <text class="t" x="44" y="338">`generateMetadata` still awaits one. Nothing changes, and nothing says you are one edit away.</text>

  <rect class="box" x="24" y="378" width="832" height="68" rx="8"/>
  <text class="t" x="44" y="404">Staleness is not a failing test. The row is served either way, so the bottom of that path is green.</text>
  <text class="m" x="44" y="428">0331 declares it instead: `force-dynamic` as a literal, and `governed.test.ts` sweeps the three route files.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/>
    </marker>
  </defs>
</svg>
