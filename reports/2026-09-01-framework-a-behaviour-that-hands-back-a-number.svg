<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="640" fill="#ffffff"/>

  <text x="40" y="46" font-size="21" font-weight="650" fill="#15120e">A behaviour that hands back a number</text>
  <text x="40" y="70" font-size="13.5" fill="#5c5751">The vocabulary had two shapes for what a control <tspan font-style="italic">reads</tspan>. It had none for what a control gives <tspan font-style="italic">back</tspan>.</text>

  <!-- ================= THE VOCABULARY ================= -->
  <text x="40" y="116" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">THE VOCABULARY — THREE MEMBERS, AND THE AXIS THEY DIFFER ON</text>

  <!-- copy -->
  <rect x="40" y="130" width="266" height="146" rx="10" fill="#faf8f5" stroke="#e4ded5"/>
  <text x="58" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#15120e">copy</text>
  <line x1="58" y1="168" x2="288" y2="168" stroke="#e4ded5"/>
  <text x="58" y="190" font-size="10.5" font-weight="700" fill="#8a8178" letter-spacing="0.06em">READS</text>
  <text x="58" y="208" font-size="11.5" fill="#5c5751">the node&#8217;s own text, off the tree</text>
  <text x="58" y="234" font-size="10.5" font-weight="700" fill="#8a8178" letter-spacing="0.06em">HANDS BACK</text>
  <text x="58" y="252" font-size="11.5" fill="#5c5751">nothing</text>
  <text x="58" y="268" font-size="11" fill="#8a8178">the page is never consulted</text>

  <!-- disclose -->
  <rect x="326" y="130" width="266" height="146" rx="10" fill="#faf8f5" stroke="#e4ded5"/>
  <text x="344" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#15120e">disclose</text>
  <line x1="344" y1="168" x2="574" y2="168" stroke="#e4ded5"/>
  <text x="344" y="190" font-size="10.5" font-weight="700" fill="#8a8178" letter-spacing="0.06em">READS</text>
  <text x="344" y="208" font-size="11.5" fill="#5c5751">nothing</text>
  <text x="344" y="234" font-size="10.5" font-weight="700" fill="#8a8178" letter-spacing="0.06em">HANDS BACK</text>
  <text x="344" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5c5751">data-loom-disclosed</text>
  <text x="344" y="268" font-size="11" fill="#8a8178">a boolean, read <tspan font-style="italic">sideways</tspan> by a sibling</text>

  <!-- adjust -->
  <rect x="612" y="130" width="266" height="146" rx="10" fill="#f5f8fa" stroke="#d5e0e6"/>
  <text x="630" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#15120e">adjust</text>
  <text x="820" y="156" font-size="10" font-weight="700" fill="#4a7d95" letter-spacing="0.06em">NEW</text>
  <line x1="630" y1="168" x2="860" y2="168" stroke="#d5e0e6"/>
  <text x="630" y="190" font-size="10.5" font-weight="700" fill="#7a94a3" letter-spacing="0.06em">READS</text>
  <text x="630" y="208" font-size="11.5" fill="#4d6472">nothing</text>
  <text x="630" y="234" font-size="10.5" font-weight="700" fill="#7a94a3" letter-spacing="0.06em">HANDS BACK</text>
  <text x="630" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#4d6472">--loom-adjust</text>
  <text x="630" y="268" font-size="11" fill="#7a94a3">a number, read <tspan font-style="italic">downwards</tspan> by var()</text>

  <!-- ================= THE GEOMETRY ================= -->
  <text x="40" y="330" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">WHY THE THIRD ONE COULD NOT COPY THE SECOND</text>
  <text x="40" y="352" font-size="12.5" fill="#5c5751">An attribute is read sideways, so a disclosure owns exactly one element. Inheritance only runs down.</text>

  <!-- wrong -->
  <rect x="40" y="372" width="400" height="212" rx="10" fill="#fdf6f4" stroke="#e8d5cf"/>
  <text x="58" y="398" font-size="12" font-weight="650" fill="#8c4a35">On its own element &#8212; readable by nothing</text>

  <rect x="58" y="416" width="364" height="34" rx="6" fill="#ffffff" stroke="#e8d5cf"/>
  <text x="74" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7a6f62">&#60;div&#62;  &#8592; the element the primitive owns</text>

  <rect x="82" y="458" width="340" height="34" rx="6" fill="#ffffff" stroke="#e8d5cf"/>
  <text x="98" y="479" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7a6f62">&#60;img&#62; clip-path: … var(--loom-adjust)</text>

  <rect x="82" y="500" width="340" height="34" rx="6" fill="#ffffff" stroke="#e8d5cf"/>
  <text x="98" y="521" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7a6f62">&#60;input&#62; style="--loom-adjust: 37"</text>

  <path d="M 90 500 L 90 486 L 78 486" fill="none" stroke="#c2705a" stroke-width="1.4"/>
  <text x="62" y="490" font-size="13" font-weight="700" fill="#c2705a">&#10007;</text>
  <text x="58" y="558" font-size="11.5" fill="#8c4a35">The value is a sibling&#8217;s. Nothing about the page looks wrong</text>
  <text x="58" y="574" font-size="11.5" fill="#8c4a35">until somebody drags it.</text>

  <!-- right -->
  <rect x="478" y="372" width="400" height="212" rx="10" fill="#f4f8f4" stroke="#d3e2d3"/>
  <text x="496" y="398" font-size="12" font-weight="650" fill="#3f6b45">On the element the primitive placed it in</text>

  <rect x="496" y="416" width="364" height="34" rx="6" fill="#ffffff" stroke="#d3e2d3"/>
  <text x="512" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5a7a5f">&#60;div style="--loom-adjust: 37"&#62;</text>

  <rect x="520" y="458" width="340" height="34" rx="6" fill="#ffffff" stroke="#d3e2d3"/>
  <text x="536" y="479" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5a7a5f">&#60;img&#62; clip-path: … var(--loom-adjust, 50)</text>

  <rect x="520" y="500" width="340" height="34" rx="6" fill="#ffffff" stroke="#d3e2d3"/>
  <text x="536" y="521" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5a7a5f">&#60;input&#62; the control, placed here</text>

  <path d="M 528 500 L 510 500 L 510 452" fill="none" stroke="#5f9168" stroke-width="1.4"/>
  <path d="M 510 458 L 510 476 L 528 476" fill="none" stroke="#5f9168" stroke-width="1.4"/>
  <text x="498" y="482" font-size="13" font-weight="700" fill="#5f9168">&#10003;</text>
  <text x="496" y="558" font-size="11.5" fill="#3f6b45">Chosen, not discovered: the primitive picked the parent by</text>
  <text x="496" y="574" font-size="11.5" fill="#3f6b45">deciding where to put the control.</text>

  <text x="40" y="614" font-size="11.5" fill="#8a8178">The fallback is the still version. No property until the control mounts, none after it leaves &#8212; so a page with scripting off renders the position the tree asked for.</text>
</svg>
