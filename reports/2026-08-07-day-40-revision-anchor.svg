<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="21" font-weight="600" fill="#111827">A revision is a position a caller may name</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">A cursor is the store's word: opaque, exclusive, meaningful only because a page handed it back. An anchor is the caller's: public, stable, inclusive.</text>

  <!-- ============================================================ -->
  <!-- Part 1: the contract — cursor vs anchor over the same log     -->
  <!-- ============================================================ -->
  <text x="40" y="112" font-size="12" font-weight="600" fill="#374151" letter-spacing="0.06em">THE SAME LOG, READ TWO WAYS — direction "older", limit 3</text>

  <!-- log strip A: cursor -->
  <text x="40" y="146" font-size="12" fill="#6b7280">resume from</text>
  <text x="40" y="162" font-size="12" font-weight="600" fill="#374151">cursor "5"</text>
  <text x="40" y="180" font-size="11" fill="#9ca3af">exclusive</text>

  <g font-size="12">
    <rect x="150" y="132" width="62" height="44" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="181" y="159" text-anchor="middle" fill="#9ca3af">1</text>
    <rect x="220" y="132" width="62" height="44" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="251" y="159" text-anchor="middle" fill="#1d4ed8" font-weight="600">2</text>
    <rect x="290" y="132" width="62" height="44" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="321" y="159" text-anchor="middle" fill="#1d4ed8" font-weight="600">3</text>
    <rect x="360" y="132" width="62" height="44" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="391" y="159" text-anchor="middle" fill="#1d4ed8" font-weight="600">4</text>
    <rect x="430" y="132" width="62" height="44" rx="5" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="3 3"/>
    <text x="461" y="159" text-anchor="middle" fill="#9ca3af">5</text>
    <rect x="500" y="132" width="62" height="44" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="531" y="159" text-anchor="middle" fill="#9ca3af">6</text>
    <rect x="570" y="132" width="62" height="44" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="601" y="159" text-anchor="middle" fill="#9ca3af">7</text>
  </g>
  <text x="660" y="152" font-size="12" fill="#1d4ed8">page = 2, 3, 4</text>
  <text x="660" y="169" font-size="11" fill="#9ca3af">5 is where you were, not what you get</text>

  <!-- log strip B: anchor -->
  <text x="40" y="222" font-size="12" fill="#6b7280">open at</text>
  <text x="40" y="238" font-size="12" font-weight="600" fill="#065f46">at: 5</text>
  <text x="40" y="256" font-size="11" fill="#059669">inclusive</text>

  <g font-size="12">
    <rect x="150" y="208" width="62" height="44" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="181" y="235" text-anchor="middle" fill="#9ca3af">1</text>
    <rect x="220" y="208" width="62" height="44" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="251" y="235" text-anchor="middle" fill="#9ca3af">2</text>
    <rect x="290" y="208" width="62" height="44" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="321" y="235" text-anchor="middle" fill="#047857" font-weight="600">3</text>
    <rect x="360" y="208" width="62" height="44" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="391" y="235" text-anchor="middle" fill="#047857" font-weight="600">4</text>
    <rect x="430" y="208" width="62" height="44" rx="5" fill="#d1fae5" stroke="#047857" stroke-width="3"/>
    <text x="461" y="235" text-anchor="middle" fill="#065f46" font-weight="700">5</text>
    <rect x="500" y="208" width="62" height="44" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="531" y="235" text-anchor="middle" fill="#9ca3af">6</text>
    <rect x="570" y="208" width="62" height="44" rx="5" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="601" y="235" text-anchor="middle" fill="#9ca3af">7</text>
  </g>
  <text x="660" y="228" font-size="12" fill="#047857">page = 3, 4, 5</text>
  <text x="660" y="245" font-size="11" fill="#9ca3af">a reader sent to 5 is here to read 5</text>

  <text x="150" y="284" font-size="11.5" fill="#6b7280">Implemented as one exclusive bound both backends already page from: anchorBound(5, "older") = 6. Density (0026) makes the ±1 exact.</text>
  <text x="150" y="302" font-size="11.5" fill="#6b7280">The far end is the part an anchor cannot borrow — anchorResumes checks the head, so opening at the newest entry names no newer page.</text>

  <line x1="40" y1="332" x2="920" y2="332" stroke="#e5e7eb"/>

  <!-- ============================================================ -->
  <!-- Part 2: what it buys — before / after                          -->
  <!-- ============================================================ -->
  <text x="40" y="368" font-size="12" font-weight="600" fill="#374151" letter-spacing="0.06em">WHAT IT BUYS — a node's credit reaching the change that placed it</text>

  <!-- BEFORE -->
  <text x="40" y="400" font-size="13" font-weight="600" fill="#991b1b">before</text>

  <rect x="40" y="412" width="220" height="76" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="56" y="434" font-size="11.5" font-weight="600" fill="#7f1d1d">/trees/t_1 — selection pane</text>
  <text x="56" y="453" font-size="11.5" fill="#991b1b">added at revision 4 —</text>
  <text x="56" y="469" font-size="11.5" fill="#991b1b">alice asked, the model wrote it</text>
  <text x="56" y="483" font-size="10.5" fill="#b91c1c">plain text. a dead end.</text>

  <line x1="268" y1="450" x2="316" y2="450" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="292" y="440" font-size="10" text-anchor="middle" fill="#9ca3af">by hand</text>

  <rect x="324" y="412" width="128" height="76" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="388" y="440" font-size="11.5" text-anchor="middle" fill="#6b7280">/history</text>
  <text x="388" y="458" font-size="11.5" text-anchor="middle" fill="#6b7280">newest page</text>
  <text x="388" y="476" font-size="10.5" text-anchor="middle" fill="#9ca3af">rev 300…201</text>

  <line x1="456" y1="450" x2="492" y2="450" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="474" y="440" font-size="10" text-anchor="middle" fill="#9ca3af">← earlier</text>

  <rect x="500" y="412" width="128" height="76" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="564" y="440" font-size="11.5" text-anchor="middle" fill="#6b7280">/history</text>
  <text x="564" y="458" font-size="11.5" text-anchor="middle" fill="#6b7280">&amp;older=201</text>
  <text x="564" y="476" font-size="10.5" text-anchor="middle" fill="#9ca3af">rev 200…101</text>

  <line x1="632" y1="450" x2="668" y2="450" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="440" font-size="10" text-anchor="middle" fill="#9ca3af">← earlier</text>

  <rect x="676" y="412" width="128" height="76" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="740" y="440" font-size="11.5" text-anchor="middle" fill="#6b7280">/history</text>
  <text x="740" y="458" font-size="11.5" text-anchor="middle" fill="#6b7280">&amp;older=101</text>
  <text x="740" y="476" font-size="10.5" text-anchor="middle" fill="#9ca3af">rev 100…1</text>

  <line x1="808" y1="450" x2="844" y2="450" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="852" y="426" width="68" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="886" y="447" font-size="11.5" text-anchor="middle" fill="#92400e" font-weight="600">rev 4</text>
  <text x="886" y="463" font-size="10" text-anchor="middle" fill="#b45309">found, eventually</text>

  <!-- AFTER -->
  <text x="40" y="540" font-size="13" font-weight="600" fill="#065f46">after</text>

  <rect x="40" y="552" width="220" height="76" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="56" y="574" font-size="11.5" font-weight="600" fill="#065f46">/trees/t_1 — selection pane</text>
  <text x="56" y="593" font-size="11.5" fill="#047857">added at <tspan text-decoration="underline" font-weight="600">revision 4</tspan> —</text>
  <text x="56" y="609" font-size="11.5" fill="#047857">alice asked, the model wrote it</text>
  <text x="56" y="623" font-size="10.5" fill="#059669">every revision named is a link</text>

  <line x1="268" y1="590" x2="356" y2="590" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="312" y="580" font-size="10.5" text-anchor="middle" fill="#059669">one click</text>

  <rect x="364" y="540" width="320" height="100" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="380" y="562" font-size="11.5" font-weight="600" fill="#065f46">/history?tree=t_1&amp;at=4#revision-4</text>
  <rect x="380" y="572" width="288" height="26" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="392" y="589" font-size="11" fill="#065f46">revision 4 · delete n_9 · add n_a · alice · undo</text>
  <rect x="380" y="602" width="288" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="392" y="617" font-size="11" fill="#9ca3af">revision 3 · configure n_4 · bob</text>
  <text x="380" y="636" font-size="10" fill="#6b7280">the anchored row is marked; the page runs older from it</text>

  <rect x="708" y="552" width="212" height="76" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="724" y="574" font-size="11.5" font-weight="600" fill="#374151">a stale link still answers</text>
  <text x="724" y="593" font-size="11" fill="#6b7280">at=99 on a log of 3 is not an</text>
  <text x="724" y="609" font-size="11" fill="#6b7280">error — the page says plainly</text>
  <text x="724" y="623" font-size="11" fill="#6b7280">that nothing on it is revision 99.</text>

  <text x="40" y="672" font-size="11" fill="#9ca3af">Decision 0043 · §5 → §1 · the two positions are mutually exclusive in the type, so a read can never quietly ignore half of what it was asked</text>
</svg>
