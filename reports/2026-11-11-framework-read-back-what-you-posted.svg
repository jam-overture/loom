    .row { font-size: 11.5px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note { font-size: 12px; fill: #475569; }
    .emph { font-size: 12.5px; font-weight: 650; fill: #0f172a; }
    .bad { font-size: 11px; font-weight: 650; fill: #b91c1c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .good { font-size: 11px; font-weight: 650; fill: #15803d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .term { font-size: 11.5px; fill: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .termdim { font-size: 11.5px; fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <rect width="1080" height="820" fill="#ffffff"/>

  <text x="72" y="46" class="title">Three bodies, three boundaries, and no length a run can compute in advance</text>
  <text x="72" y="70" class="sub">0388. Six entries in FINDINGS.md, four lanes, seven weeks. They agree that URL length moves the outcome and agree on nothing else.</text>

  <text x="72" y="118" class="panel-title">URL LENGTH, IN CHARACTERS &#8212; EACH DOT IS ONE URL READ BACK FROM THE API AFTER POSTING</text>

  <line x1="334" y1="140" x2="334" y2="400" stroke="#f1f5f9"/>
  <text x="334" y="134" class="tick" text-anchor="middle">114</text>
  <line x1="470" y1="140" x2="470" y2="400" stroke="#f1f5f9"/>
  <text x="470" y="134" class="tick" text-anchor="middle">130</text>
  <line x1="640" y1="140" x2="640" y2="400" stroke="#f1f5f9"/>
  <text x="640" y="134" class="tick" text-anchor="middle">150</text>
  <line x1="810" y1="140" x2="810" y2="400" stroke="#f1f5f9"/>
  <text x="810" y="134" class="tick" text-anchor="middle">170</text>
  <line x1="980" y1="140" x2="980" y2="400" stroke="#f1f5f9"/>
  <text x="980" y="134" class="tick" text-anchor="middle">190</text>

  <text x="72" y="168" class="path">#378 &#183; 23 Sep</text>
  <text x="72" y="186" class="fn">157 &#8594; 158</text>
  <text x="72" y="203" class="what">six URLs, one prefix</text>
  <line x1="300" y1="178" x2="1000" y2="178" stroke="#e2e8f0"/>
  <rect x="703.75" y="152" width="4" height="52" fill="#fecaca"/>
  <circle cx="640" cy="178" r="5.5" fill="#15803d"/>
  <circle cx="699.5" cy="178" r="5.5" fill="#15803d"/>
  <circle cx="699.5" cy="166" r="5.5" fill="#15803d"/>
  <circle cx="699.5" cy="190" r="5.5" fill="#15803d"/>
  <circle cx="708" cy="178" r="5.5" fill="#b91c1c"/>
  <circle cx="793" cy="178" r="5.5" fill="#b91c1c"/>

  <text x="72" y="248" class="path">#390 &#183; 25 Sep</text>
  <text x="72" y="266" class="fn">147 &#8594; 151</text>
  <text x="72" y="283" class="what">twelve, markdown links</text>
  <line x1="300" y1="258" x2="1000" y2="258" stroke="#e2e8f0"/>
  <rect x="631" y="232" width="4" height="52" fill="#fecaca"/>
  <circle cx="597.5" cy="258" r="5.5" fill="#15803d"/>
  <circle cx="606" cy="248" r="5.5" fill="#15803d"/>
  <circle cx="606" cy="268" r="5.5" fill="#15803d"/>
  <circle cx="614.5" cy="258" r="5.5" fill="#15803d"/>
  <circle cx="648.5" cy="258" r="5.5" fill="#b91c1c"/>
  <circle cx="691" cy="258" r="5.5" fill="#b91c1c"/>
  <circle cx="793" cy="258" r="5.5" fill="#b91c1c"/>
  <circle cx="801.5" cy="248" r="5.5" fill="#b91c1c"/>
  <circle cx="810" cy="268" r="5.5" fill="#b91c1c"/>
  <circle cx="827" cy="258" r="5.5" fill="#b91c1c"/>
  <circle cx="691" cy="290" r="5.5" fill="#15803d"/>
  <text x="703" y="294" class="good">156, the same length, as a bare URL &#8212; survived</text>

  <text x="72" y="348" class="path">#423 &#183; 27 Sep</text>
  <text x="72" y="366" class="fn">124 &#8594; 150</text>
  <text x="72" y="383" class="what">six, the longest body</text>
  <line x1="300" y1="358" x2="1000" y2="358" stroke="#e2e8f0"/>
  <rect x="529" y="332" width="4" height="52" fill="#fecaca"/>
  <circle cx="334" cy="358" r="5.5" fill="#15803d"/>
  <circle cx="419" cy="358" r="5.5" fill="#15803d"/>
  <circle cx="640" cy="358" r="5.5" fill="#b91c1c"/>
  <circle cx="640" cy="346" r="5.5" fill="#b91c1c"/>
  <circle cx="657" cy="358" r="5.5" fill="#b91c1c"/>
  <circle cx="742" cy="358" r="5.5" fill="#b91c1c"/>
  <circle cx="963" cy="358" r="5.5" fill="#b91c1c"/>

  <circle cx="306" cy="420" r="5.5" fill="#15803d"/>
  <text x="318" y="424" class="note">came back byte-identical</text>
  <circle cx="500" cy="420" r="5.5" fill="#b91c1c"/>
  <text x="512" y="424" class="note">came back with characters welded on</text>
  <rect x="760" y="414" width="4" height="12" fill="#fecaca"/>
  <text x="774" y="424" class="note">that body&#8217;s boundary</text>

  <line x1="72" y1="452" x2="1008" y2="452" stroke="#e2e8f0"/>

  <text x="72" y="484" class="emph">#423 mangles 150 where #378 keeps 157, and #390 mangles 151 where #378 keeps 157. No constant fits all three.</text>
  <text x="72" y="506" class="note">The one reading that does: the limit is the tail of some other budget the whole body spends. #423&#8217;s body is the longest and has the lowest boundary.</text>
  <text x="72" y="528" class="note">Five explanations have each lasted exactly one measurement &#8212; it is the <tspan font-family="ui-monospace, Menlo, monospace">.png</tspan>; it is the apostrophe; it is the link syntax; it is the position; it is being alone on the line.</text>

  <text x="72" y="578" class="panel-title">SO THE DECISION IS NOT A NUMBER</text>

  <rect x="72" y="596" width="440" height="152" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="96" y="622" class="emph">The precaution &#8212; clause 2</text>
  <text x="96" y="648" class="good">`decisions/0379-&#8230;.md`</text>
  <text x="300" y="648" class="what">a record, by path. Never linked.</text>
  <text x="96" y="672" class="good">&lt;https://&#8230;&gt;</text>
  <text x="300" y="672" class="what">an autolink</text>
  <text x="96" y="696" class="good">https://&#8230; on its own line</text>
  <text x="300" y="696" class="what">a report, carrying images by path</text>
  <text x="96" y="726" class="what">Never mangled, in any measurement on record.</text>

  <rect x="544" y="596" width="464" height="152" rx="6" fill="#0f172a"/>
  <text x="568" y="622" class="termdim">$ pnpm posted body.md</text>
  <text x="568" y="648" class="term">body.md  3 URLs, 4 mangled</text>
  <text x="568" y="670" class="term">  line 3: "``''" before the link's opening bracket</text>
  <text x="568" y="690" class="term">  line 3: "''``" after the closing parenthesis</text>
  <text x="568" y="710" class="term">  line 5: "````''''" inside the parentheses</text>
  <text x="568" y="730" class="term">  line 5: "''''````" after the closing parenthesis</text>

  <text x="72" y="782" class="emph">The check &#8212; clause 1. The read-back is one call, it is how every one of these measurements exists, and it is the only thing that has ever been reliable.</text>
  <text x="72" y="802" class="note">The terminal above is this run reading #854 back from the API: four runs found, and the two links in the same body that came back clean left alone.</text>
</svg>
