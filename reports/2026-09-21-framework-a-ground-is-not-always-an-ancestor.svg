<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 632" width="960" height="632" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="632" fill="#fbfaf8"/>

  <text x="32" y="38" font-size="19" font-weight="650" fill="#1c1917">A ground is not always an ancestor</text>
  <text x="32" y="60" font-size="13.5" fill="#57534e">One element tree, read two ways. <tspan font-style="italic">loom.overlay</tspan> declares its ink at the root and paints its ground on a scrim two</text>
  <text x="32" y="78" font-size="13.5" fill="#57534e">layers down and one layer under the words. Follow the chain and the two ends never meet.</text>

  <!-- ─────────── LEFT: the chain ─────────── -->
  <text x="32" y="122" font-size="11.5" font-weight="650" fill="#78716c" letter-spacing="0.06em">WHAT THE PROBE FOLLOWED — PARENT TO CHILD</text>

  <rect x="32" y="138" width="416" height="330" rx="6" fill="#ffffff" stroke="#e7e5e4"/>

  <rect x="56" y="162" width="368" height="46" rx="5" fill="#fafaf9" stroke="#e7e5e4"/>
  <text x="70" y="182" font-size="12.5" font-weight="650" fill="#1c1917">&lt;div&gt;  the root</text>
  <text x="70" y="199" font-size="12" fill="#a16207">color: var(--loom-fg-default)</text>
  <text x="330" y="199" font-size="11" font-style="italic" fill="#a8a29e">no ground</text>

  <path d="M96 208 L 96 236" stroke="#d6d3d1" stroke-width="1.5" fill="none"/>
  <path d="M91 230 L 96 238 L 101 230 Z" fill="#d6d3d1"/>

  <rect x="80" y="238" width="344" height="40" rx="5" fill="#fafaf9" stroke="#e7e5e4"/>
  <text x="94" y="256" font-size="12.5" fill="#1c1917">&lt;div&gt;  the ground layer</text>
  <text x="94" y="272" font-size="11.5" fill="#a8a29e">gridArea 1 / 1 · zIndex 0 · the photograph</text>

  <path d="M96 278 L 96 300" stroke="#d6d3d1" stroke-width="1.5" fill="none"/>
  <path d="M91 294 L 96 302 L 101 294 Z" fill="#d6d3d1"/>

  <rect x="80" y="302" width="344" height="40" rx="5" fill="#fefce8" stroke="#eab308"/>
  <text x="94" y="320" font-size="12.5" fill="#1c1917">&lt;div&gt;  the scrim</text>
  <text x="94" y="336" font-size="11.5" fill="#854d0e">background: var(--loom-bg-overlay)</text>

  <path d="M96 342 L 96 364" stroke="#d6d3d1" stroke-width="1.5" fill="none"/>
  <path d="M91 358 L 96 366 L 101 358 Z" fill="#d6d3d1"/>

  <rect x="80" y="366" width="344" height="40" rx="5" fill="#fafaf9" stroke="#e7e5e4"/>
  <text x="94" y="384" font-size="12.5" fill="#1c1917">&lt;div&gt;  the content — the words</text>
  <text x="94" y="400" font-size="11.5" fill="#a8a29e">gridArea 1 / 1 · zIndex 2 · sets no colour</text>

  <text x="56" y="436" font-size="12.5" fill="#7f1d1d">The scrim is the content&#8217;s <tspan font-style="italic">sibling</tspan>, not its parent, so the walk</text>
  <text x="56" y="453" font-size="12.5" fill="#7f1d1d">arrives with no ground. The ink was filed as floating at the root.</text>

  <!-- ─────────── ARROW ─────────── -->
  <path d="M466 300 L 502 300" stroke="#78716c" stroke-width="1.5" fill="none"/>
  <path d="M496 294 L 504 300 L 496 306 Z" fill="#78716c"/>
  <text x="464" y="284" font-size="11" font-weight="650" fill="#78716c" letter-spacing="0.04em">0178</text>

  <!-- ─────────── RIGHT: the stack ─────────── -->
  <text x="520" y="122" font-size="11.5" font-weight="650" fill="#78716c" letter-spacing="0.06em">WHAT THE PAGE RENDERS — ONE CELL, THREE LAYERS</text>

  <rect x="520" y="138" width="408" height="330" rx="6" fill="#ffffff" stroke="#e7e5e4"/>

  <text x="544" y="166" font-size="11.5" fill="#78716c">grid cell 1 / 1, back to front</text>

  <rect x="596" y="180" width="300" height="150" rx="5" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="610" y="200" font-size="11.5" fill="#78716c">zIndex 0 — the photograph</text>

  <rect x="576" y="212" width="300" height="150" rx="5" fill="#fefce8" stroke="#eab308"/>
  <text x="590" y="232" font-size="11.5" fill="#854d0e">zIndex 1 — bg-overlay</text>

  <rect x="556" y="244" width="300" height="150" rx="5" fill="#ffffff" stroke="#57534e"/>
  <text x="570" y="264" font-size="11.5" fill="#78716c">zIndex 2 — the words</text>
  <text x="570" y="300" font-size="21" font-weight="650" fill="#1c1917">Every word here</text>
  <text x="570" y="326" font-size="21" font-weight="650" fill="#1c1917">is fg-default</text>
  <text x="570" y="356" font-size="12.5" fill="#57534e">on bg-overlay, and has been since</text>
  <text x="570" y="373" font-size="12.5" fill="#57534e">15 September.</text>

  <text x="544" y="436" font-size="12.5" fill="#14532d">Two values now travel down — the ground in effect <tspan font-weight="650">and</tspan></text>
  <text x="544" y="453" font-size="12.5" fill="#14532d">the ink — and siblings in one cell are a stack.</text>

  <!-- ─────────── FOOTER ─────────── -->
  <line x1="32" y1="500" x2="928" y2="500" stroke="#e7e5e4"/>

  <text x="32" y="526" font-size="11.5" font-weight="650" fill="#78716c" letter-spacing="0.06em">WHAT THE AUDIT SAID ABOUT THE SLOT</text>

  <text x="32" y="552" font-size="12.5" fill="#7f1d1d">before</text>
  <text x="104" y="552" font-size="12.5" fill="#57534e">no pairing, no child ground, no entry outside the ramp — <tspan font-weight="650" fill="#7f1d1d">failures: []</tspan>, which is what a clean palette answers with</text>

  <text x="32" y="576" font-size="12.5" fill="#14532d">after</text>
  <text x="104" y="576" font-size="12.5" fill="#57534e">one painted row, four composed, and the fifth ground the text ramp is held to</text>

  <text x="32" y="600" font-size="12" fill="#a8a29e">A host palette that reads <tspan font-style="italic">overlay</tspan> as a dark wash now fails the painted bar. All twenty-one of Loom&#8217;s own set it to bg-surface.</text>
</svg>
