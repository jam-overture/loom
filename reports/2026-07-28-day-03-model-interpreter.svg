<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img" aria-label="The model-backed interpreter: request assembly, the network seam, and the draft-to-delta projection">
  <title>Loom — the model-backed ChangeInterpreter</title>
  <desc>Top band: an EditIntent and a tree are rendered into a prompt, sent through the ModelClient seam, and the reply is parsed, validated and projected into a TreeDelta, or exits as one of four InterpretationError codes. Bottom band: the draft a model emits beside the delta the runtime produces, showing that ids are minted by the runtime.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52606d"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2933; }
      .h { font-family: Georgia, "Times New Roman", serif; fill: #1f2933; }
      .lbl { font-size: 12px; }
      .sm { font-size: 10.5px; fill: #52606d; }
      .box { fill: #f6f8fa; stroke: #c9d2dc; stroke-width: 1.2; }
      .pure { fill: #f1f7f6; stroke: #0f766e; stroke-width: 1.2; }
      .ai { fill: #fdf5e7; stroke: #b45309; stroke-width: 1.4; }
      .errbox { fill: #fdf1f1; stroke: #b91c1c; stroke-width: 1.2; }
      .flow { stroke: #52606d; stroke-width: 1.4; fill: none; }
      .errflow { stroke: #b91c1c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .mintflow { stroke: #0f766e; stroke-width: 1.6; fill: none; }
      .rule { stroke: #dde3ea; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1040" height="720" fill="#ffffff"/>

  <text class="h" x="32" y="40" font-size="21">The model-backed interpreter</text>
  <text class="t sm" x="32" y="60">§2 Composition Runtime — every step but one is pure, and the one that is not sits behind a one-method seam</text>

  <!-- legend -->
  <g transform="translate(700,30)">
    <rect class="pure" x="0" y="0" width="14" height="14" rx="2"/>
    <text class="t sm" x="20" y="11">pure, offline-testable</text>
    <rect class="ai" x="0" y="20" width="14" height="14" rx="2"/>
    <text class="t sm" x="20" y="31">non-deterministic</text>
    <rect class="errbox" x="0" y="40" width="14" height="14" rx="2"/>
    <text class="t sm" x="20" y="51">InterpretationError</text>
  </g>

  <line class="rule" x1="32" y1="76" x2="1008" y2="76"/>

  <!-- ============ BAND A: the path ============ -->
  <text class="h" x="32" y="102" font-size="14">One interpretation, end to end</text>

  <!-- inputs -->
  <g transform="translate(32,118)">
    <rect class="box" x="0" y="0" width="150" height="62" rx="4"/>
    <text class="t lbl" x="12" y="20">EditIntent</text>
    <text class="t sm" x="12" y="36">utterance, origin,</text>
    <text class="t sm" x="12" y="50">scope, baseRevision</text>
  </g>
  <g transform="translate(32,196)">
    <rect class="box" x="0" y="0" width="150" height="62" rx="4"/>
    <text class="t lbl" x="12" y="20">LoomTree</text>
    <text class="t sm" x="12" y="36">the tree as it</text>
    <text class="t sm" x="12" y="50">stands right now</text>
  </g>

  <!-- render + prompt -->
  <g transform="translate(224,150)">
    <rect class="pure" x="0" y="0" width="164" height="78" rx="4"/>
    <text class="t lbl" x="12" y="20">render + prompt</text>
    <text class="t sm" x="12" y="38">an indented outline,</text>
    <text class="t sm" x="12" y="52">ids first, props sorted</text>
    <text class="t sm" x="12" y="68">+ a constant system prompt</text>
  </g>

  <!-- seam -->
  <g transform="translate(430,150)">
    <rect class="pure" x="0" y="0" width="146" height="78" rx="4"/>
    <text class="t lbl" x="12" y="20">ModelClient</text>
    <text class="t sm" x="12" y="38">complete(request)</text>
    <text class="t sm" x="12" y="52">→ Result&lt;text, err&gt;</text>
    <text class="t sm" x="12" y="68">the whole boundary</text>
  </g>

  <!-- model -->
  <g transform="translate(618,150)">
    <rect class="ai" x="0" y="0" width="150" height="78" rx="4"/>
    <text class="t lbl" x="12" y="20">a model</text>
    <text class="t sm" x="12" y="38">reply constrained by</text>
    <text class="t sm" x="12" y="52">a JSON Schema:</text>
    <text class="t sm" x="12" y="68">change | none | unclear</text>
  </g>

  <!-- parse/validate -->
  <g transform="translate(810,150)">
    <rect class="pure" x="0" y="0" width="164" height="78" rx="4"/>
    <text class="t lbl" x="12" y="20">parse + validate</text>
    <text class="t sm" x="12" y="38">JSON, then the Zod</text>
    <text class="t sm" x="12" y="52">draft schema, then</text>
    <text class="t sm" x="12" y="68">materialize + parseDelta</text>
  </g>

  <!-- output -->
  <g transform="translate(810,268)">
    <rect class="pure" x="0" y="0" width="164" height="76" rx="4"/>
    <text class="t lbl" x="12" y="20">ProposedChange</text>
    <text class="t sm" x="12" y="38">delta + rationale +</text>
    <text class="t sm" x="12" y="52">provenance (model id,</text>
    <text class="t sm" x="12" y="66">prompt hash, confidence)</text>
  </g>

  <!-- gate -->
  <g transform="translate(618,268)">
    <rect class="box" x="0" y="0" width="150" height="76" rx="4"/>
    <text class="t lbl" x="12" y="20">Gate (§2, shipped)</text>
    <text class="t sm" x="12" y="38">judges a model</text>
    <text class="t sm" x="12" y="52">proposal on exactly</text>
    <text class="t sm" x="12" y="66">the same terms</text>
  </g>

  <!-- errors -->
  <g transform="translate(224,268)">
    <rect class="errbox" x="0" y="0" width="340" height="76" rx="4"/>
    <text class="t lbl" x="12" y="20">InterpretationError — never a rejected proposal</text>
    <text class="t sm" x="12" y="38">not-understood · no-change-needed</text>
    <text class="t sm" x="12" y="54">malformed-proposal · interpreter-unavailable</text>
    <text class="t sm" x="12" y="70">"I did not understand" ≠ "you may not do that"</text>
  </g>

  <!-- flows -->
  <path class="flow" d="M 182 149 L 204 149 L 204 186 L 220 186" marker-end="url(#arrow)"/>
  <path class="flow" d="M 182 227 L 204 227 L 204 192 L 220 192" marker-end="url(#arrow)"/>
  <path class="flow" d="M 388 189 L 426 189" marker-end="url(#arrow)"/>
  <path class="flow" d="M 576 189 L 614 189" marker-end="url(#arrow)"/>
  <path class="flow" d="M 768 189 L 806 189" marker-end="url(#arrow)"/>
  <path class="flow" d="M 892 228 L 892 264" marker-end="url(#arrow)"/>
  <path class="flow" d="M 806 306 L 772 306" marker-end="url(#arrow)"/>

  <path class="errflow" d="M 892 232 L 892 250 L 580 250 L 570 262" marker-end="url(#arrow-err)"/>
  <path class="errflow" d="M 500 232 L 500 250 L 420 250 L 412 262" marker-end="url(#arrow-err)"/>
  <text class="t sm" x="604" y="246" fill="#b91c1c">bad shape, or an answer that is not a change</text>
  <text class="t sm" x="330" y="246" fill="#b91c1c">unreachable</text>

  <line class="rule" x1="32" y1="372" x2="1008" y2="372"/>

  <!-- ============ BAND B: the projection ============ -->
  <text class="h" x="32" y="400" font-size="14">What the model says, and what the runtime makes of it</text>
  <text class="t sm" x="32" y="418">Records 0003 and 0004: a model drafts; the runtime names. Ids are minted here, never proposed.</text>

  <!-- draft -->
  <g transform="translate(32,436)">
    <rect class="ai" x="0" y="0" width="440" height="242" rx="4"/>
    <text class="t lbl" x="14" y="22">draft — one insert operation, as replied</text>
    <text class="t sm" x="14" y="42" fill="#b45309">no ids · props tagged · nesting bounded at depth 4</text>
    <g class="t" font-size="11.5">
      <text x="14" y="66">{ "op": "insert",</text>
      <text x="14" y="84">  "parentId": "n_6",          <tspan class="sm">← copied from the outline</tspan></text>
      <text x="14" y="102">  "index": 0,</text>
      <text x="14" y="120">  "node": {</text>
      <text x="14" y="138">    "kind": "element",</text>
      <text x="14" y="156">    "type": "loom.note",</text>
      <text x="14" y="174">    "props": [ { "key": "tone",</text>
      <text x="14" y="192">                 "value": { "kind": "string",</text>
      <text x="14" y="210">                            "string": "quiet" } } ],</text>
      <text x="14" y="228">    "children": [ { "kind": "text", "value": "Thanks" } ] } }</text>
    </g>
  </g>

  <!-- delta -->
  <g transform="translate(568,436)">
    <rect class="pure" x="0" y="0" width="440" height="242" rx="4"/>
    <text class="t lbl" x="14" y="22">TreeDelta — after materializeDelta</text>
    <text class="t sm" x="14" y="42" fill="#0f766e">ids minted via IdFactory · props decoded · revision from the intent</text>
    <g class="t" font-size="11.5">
      <text x="14" y="66">{ "deltaId": "d_a1", "treeId": "t_1", "baseRevision": 0,</text>
      <text x="14" y="84">  "operations": [ { "op": "insert",</text>
      <text x="14" y="102">    "parentId": "n_6",</text>
      <text x="14" y="120">    "index": 0,</text>
      <text x="14" y="138">    "node": {</text>
      <text x="14" y="156">      "kind": "element",</text>
      <text x="14" y="174">      "id": "n_k3f",            <tspan class="sm" fill="#0f766e">← minted, not proposed</tspan></text>
      <text x="14" y="192">      "type": "loom.note",</text>
      <text x="14" y="210">      "props": { "tone": "quiet" },</text>
      <text x="14" y="228">      "children": [ { "kind": "text", "id": "n_k3g", … } ] } } ] }</text>
    </g>
  </g>

  <path class="mintflow" d="M 476 556 L 562 556" marker-end="url(#arrow-mint)"/>
  <text class="t sm" x="486" y="546" fill="#0f766e">project</text>

  <text class="t sm" x="32" y="702">A proposal that names an id outside the scheme, or a prop the runtime cannot decode, is malformed — it never reaches the Gate.</text>
</svg>
