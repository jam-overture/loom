<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="700" fill="#fbfaf8"/>

  <text x="32" y="44" font-size="19" font-weight="650" fill="#1c1917">The capture half, and where the view key stops</text>
  <text x="32" y="68" font-size="13.5" fill="#57534e">A funnel needs correlation. Everything here is arranged so the value that correlates cannot outlive one page view.</text>

  <!-- the pipeline -->
  <rect x="32" y="94" width="856" height="252" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="122" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">FROM A BROWSER TO A COUNTER</text>

  <rect x="52" y="142" width="140" height="52" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="122" y="164" font-size="13" text-anchor="middle" fill="#292524">broadcaster</text>
  <text x="122" y="182" font-size="11" text-anchor="middle" fill="#78716c">in the page</text>

  <path d="M 192 168 L 232 168" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 232 168 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="234" y="142" width="140" height="52" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="304" y="164" font-size="13" text-anchor="middle" fill="#292524">ingestReaderSignals</text>
  <text x="304" y="182" font-size="11" text-anchor="middle" fill="#78716c">parse, or refuse</text>

  <path d="M 374 168 L 414 168" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 414 168 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="416" y="142" width="140" height="52" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="486" y="164" font-size="13" text-anchor="middle" fill="#78350f">the buffer</text>
  <text x="486" y="182" font-size="11" text-anchor="middle" fill="#92400e">short-lived</text>

  <path d="M 556 168 L 596 168" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 596 168 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="598" y="142" width="120" height="52" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="658" y="164" font-size="13" text-anchor="middle" fill="#292524">rollUp</text>
  <text x="658" y="182" font-size="11" text-anchor="middle" fill="#78716c">pure</text>

  <path d="M 718 168 L 754 168" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 754 168 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="756" y="142" width="112" height="52" rx="7" fill="#dcfce7" stroke="#16a34a"/>
  <text x="812" y="164" font-size="13" text-anchor="middle" fill="#14532d">counters</text>
  <text x="812" y="182" font-size="11" text-anchor="middle" fill="#166534">durable</text>

  <!-- the view key's span -->
  <path d="M 122 216 L 122 240 L 658 240 L 658 216" stroke="#b91c1c" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
  <rect x="300" y="228" width="180" height="24" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="390" y="245" font-size="12" text-anchor="middle" fill="#7f1d1d">the view key lives here</text>

  <text x="52" y="278" font-size="12.5" fill="#57534e">Minted once per broadcast from 128 random bits. Read by <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">rollUp</tspan> and by nothing else.</text>
  <text x="52" y="298" font-size="12.5" fill="#57534e">It is not in a counter, not in a funnel answer, and not in anything the portal can read.</text>
  <text x="52" y="318" font-size="12.5" fill="#57534e">Forgetting the buffer is how it ceases to exist — which nothing schedules yet, and that is filed.</text>

  <!-- occurrences vs views -->
  <rect x="32" y="364" width="420" height="184" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="392" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">TWO KINDS OF NUMBER ON ONE ROW</text>

  <rect x="52" y="408" width="380" height="56" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="68" y="430" font-size="12.5" font-weight="600" fill="#292524">occurrences — they sum, exactly</text>
  <text x="68" y="450" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57534e">dwellMs · activations · opens · closes</text>

  <rect x="52" y="472" width="380" height="56" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="68" y="494" font-size="12.5" font-weight="600" fill="#78350f">views — distinct, so they do not sum exactly</text>
  <text x="68" y="514" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#92400e">views · reached  →  over-count, bounded, 0147</text>

  <!-- what a funnel is -->
  <rect x="468" y="364" width="420" height="184" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="488" y="392" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">WHAT A FUNNEL IS ALLOWED TO ASK</text>

  <rect x="488" y="408" width="380" height="48" rx="7" fill="#dcfce7" stroke="#16a34a"/>
  <text x="504" y="428" font-size="12.5" fill="#14532d">Of the views that <tspan font-weight="600">viewed</tspan> the pricing band,</text>
  <text x="504" y="446" font-size="12.5" fill="#14532d">how many <tspan font-weight="600">activated</tspan> the button?</text>

  <rect x="488" y="466" width="380" height="62" rx="7" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="504" y="486" font-size="12.5" fill="#7f1d1d">Which visitors came back on Tuesday?</text>
  <text x="504" y="504" font-size="12.5" fill="#7f1d1d">What route did this reader take?</text>
  <text x="504" y="521" font-size="11.5" fill="#991b1b">Not answerable, and not made answerable by a field.</text>

  <!-- the doorway -->
  <rect x="32" y="566" width="856" height="106" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="594" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">THE SHAPE IS THE ENFORCEMENT</text>

  <text x="52" y="620" font-size="12.5" fill="#57534e">A free-form correlation field is where a host would put a visitor id and have everything downstream keep working.</text>
  <text x="52" y="640" font-size="12.5" fill="#57534e">Thirty-two hex characters of nothing hold no room for one, and a batch carrying anything else is refused at the door:</text>
  <text x="52" y="660" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7f1d1d">reader@example.com · sha256:9f86… · user-4821 · 3f2504e0-4f89-11d3-… · uppercase hex — all refused, all tested</text>
</svg>
