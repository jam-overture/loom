  <text x="168" y="288" font-size="11.5" fill="#5c5751">the proposal that was refused</text>
  <text x="40" y="646" font-size="11" fill="#8a8178">Measured by <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">measureRepairPrompt</tspan>, starter catalogues wired, nothing sent. Record 0108.</text>
