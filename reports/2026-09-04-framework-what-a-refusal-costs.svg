<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="660" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" font-weight="650" fill="#15120e">What a refusal costs</text>
  <text x="40" y="70" font-size="13.5" fill="#5c5751">A repair sends the request again. The <tspan font-style="italic">ratio</tspan> never moves. The <tspan font-style="italic">gap</tspan> between scoping and not is the whole story.</text>
  <rect x="40" y="94" width="404" height="68" rx="10" fill="#faf8f5" stroke="#e4ded5"/>
  <text x="58" y="118" font-size="10.5" font-weight="700" fill="#8a8178" letter-spacing="0.06em">THE FINDING SAID THE RATIO WIDENS</text>
  <text x="58" y="140" font-size="13" fill="#5c5751">It is flat: <tspan font-weight="650" fill="#15120e">2.015 → 2.004</tspan> from 5 to 500 sections,</text>
  <text x="58" y="156" font-size="13" fill="#5c5751">drifting <tspan font-style="italic">towards</tspan> 2 as the fixed 305 characters shrink.</text>
  <rect x="476" y="94" width="404" height="68" rx="10" fill="#f5f8fa" stroke="#d5e0e6"/>
  <text x="494" y="118" font-size="10.5" font-weight="700" fill="#7a94a3" letter-spacing="0.06em">WHAT ACTUALLY WIDENS</text>
  <text x="494" y="140" font-size="13" fill="#4d6472">The absolute gap: <tspan font-weight="650" fill="#15120e">502 → 98,922</tspan> characters.</text>
  <text x="494" y="156" font-size="13" fill="#4d6472">A scope is worth <tspan font-style="italic">twice</tspan> as much on the repair path.</text>
  <text x="40" y="196" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">AN EPISODE — ONE REQUEST, REFUSED, THEN REPAIRED — IN CHARACTERS</text>
