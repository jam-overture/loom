<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <style>
    .t { fill: #18181b; }
    .m { fill: #52525b; }
    .box { fill: #fafafa; stroke: #d4d4d8; }
    .code { fill: #f5f3ff; stroke: #c4b5fd; }
    .ok { fill: #f0fdf4; stroke: #86efac; }
    .bad { fill: #fef2f2; stroke: #fca5a5; }
    .okt { fill: #166534; }
    .badt { fill: #991b1b; }
    .codet { fill: #6d28d9; }
    .line { stroke: #a1a1aa; fill: none; }
    .flow { stroke: #52525b; fill: none; }
    .gone { stroke: #fca5a5; fill: none; stroke-dasharray: 4 3; }
    text { font-size: 13px; }
    .h { font-size: 15px; font-weight: 700; }
    .k { font-size: 10.5px; letter-spacing: .07em; font-weight: 700; }
    .mono { font-size: 11px; font-family: "Geist Mono", ui-monospace, monospace; }
    .sm { font-size: 11.5px; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #fafafa } .m { fill: #a1a1aa }
      .box { fill: #1c1c1f; stroke: #3f3f46 }
      .code { fill: #17132b; stroke: #6d28d9 }
      .ok { fill: #0d2017; stroke: #15803d }
      .bad { fill: #220f0f; stroke: #b91c1c }
      .okt { fill: #4ade80 } .badt { fill: #f87171 } .codet { fill: #a78bfa }
      .line { stroke: #52525b } .flow { stroke: #a1a1aa } .gone { stroke: #b91c1c }
    }
  </style>

  <text class="h t" x="0" y="14">Eighteen settings, three places they are stated, and the six that reached none of them</text>
  <text class="m sm" x="0" y="34">A deployment's settings are read off the application, so a variable the guide does not name fails on the branch that adds it</text>

  <!-- the application -->
  <rect class="code" x="0" y="56" width="236" height="240" rx="8"/>
  <text class="k codet" x="16" y="80">THE APPLICATION READS</text>
  <text class="mono t" x="16" y="104">process.env.LOOM_SITE_ORIGIN</text>
  <text class="mono t" x="16" y="124">env[INTAKE_KEY]</text>
  <text class="mono t" x="16" y="144">env["LOOM_SIGNAL_KEPT_MS"]</text>
  <text class="m sm" x="16" y="172">24 names, in 14 of 655 sources.</text>
  <text class="m sm" x="16" y="190">Taken from the scanned code, so a</text>
  <text class="m sm" x="16" y="208">variable quoted in a doc comment and</text>
  <text class="m sm" x="16" y="226">a snippet printed for a customer are</text>
  <text class="m sm" x="16" y="244">not mistaken for settings.</text>
  <text class="m sm" x="16" y="272">18 settings · 6 declared not to be,</text>
  <text class="m sm" x="16" y="290">each with a reason.</text>

  <!-- arrows to the three statements -->
  <path class="flow" d="M236 110 H 300" marker-end="url(#a)"/>
  <path class="flow" d="M236 176 H 300" marker-end="url(#a)"/>
  <path class="flow" d="M236 242 H 300" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#52525b"/>
    </marker>
  </defs>

  <!-- three statements -->
  <rect class="box" x="300" y="80" width="300" height="60" rx="6"/>
  <text class="k t" x="314" y="102">docs/deployment.md, ANYWHERE</text>
  <text class="m sm" x="314" y="124">names every variable the code reads</text>

  <rect class="box" x="300" y="146" width="300" height="60" rx="6"/>
  <text class="k t" x="314" y="168">apps/loom/.env.example</text>
  <text class="m sm" x="314" y="190">offers a line for each, or says why not</text>

  <rect class="box" x="300" y="212" width="300" height="60" rx="6"/>
  <text class="k t" x="314" y="234">THE TABLE UNDER § ENVIRONMENT</text>
  <text class="m sm" x="314" y="256">a row per offer, and its count in words</text>

  <!-- fourth claim -->
  <rect class="box" x="300" y="290" width="300" height="60" rx="6"/>
  <text class="k t" x="314" y="312">THE SAMPLE RESPONSE IN § 8</text>
  <text class="m sm" x="314" y="334">every field of IntakeStatus, all ten</text>
  <path class="flow" d="M236 290 Q 268 320 300 320" marker-end="url(#a)"/>

  <!-- the gate -->
  <rect class="ok" x="640" y="80" width="260" height="270" rx="8"/>
  <text class="k okt" x="656" y="104">pnpm verify</text>
  <text class="m sm" x="656" y="128">Five claims, 29 tests. A setting added</text>
  <text class="m sm" x="656" y="146">without a line in the guide fails on the</text>
  <text class="m sm" x="656" y="164">branch that adds it, naming the</text>
  <text class="m sm" x="656" y="182">variable and the source that reads it.</text>
  <text class="m sm" x="656" y="214">Before this branch all five passed by</text>
  <text class="m sm" x="656" y="232">not existing. There is no step in the</text>
  <text class="m sm" x="656" y="250">gate that reads the guide, so the drift</text>
  <text class="m sm" x="656" y="268">was only ever found by somebody who</text>
  <text class="m sm" x="656" y="286">already knew the setting existed —</text>
  <text class="m sm" x="656" y="304">the one person who does not need it.</text>
  <text class="m sm" x="656" y="336">15 mutations run, 15 killed.</text>
  <path class="flow" d="M600 110 H 640" marker-end="url(#a)"/>
  <path class="flow" d="M600 176 H 640" marker-end="url(#a)"/>
  <path class="flow" d="M600 242 H 640" marker-end="url(#a)"/>
  <path class="flow" d="M600 320 Q 620 320 640 300" marker-end="url(#a)"/>

  <!-- what was behind -->
  <rect class="bad" x="0" y="384" width="900" height="200" rx="8"/>
  <text class="k badt" x="20" y="410">DOCUMENTED NOWHERE AN OPERATOR READS, MEASURED ON main AT b0db23c</text>

  <text class="mono t" x="20" y="440">LOOM_SIGNAL_REGION</text>
  <text class="m sm" x="230" y="440">counts which country a reader is in — on by default</text>
  <text class="mono t" x="20" y="462">LOOM_SIGNAL_REGION_HEADER</text>
  <text class="m sm" x="230" y="462">where that country is read from, and the reason it is configurable</text>
  <text class="mono t" x="20" y="484">LOOM_SIGNAL_REGION_FLOOR</text>
  <text class="m sm" x="230" y="484">the smallest bucket named, raise-only, refusals reported</text>
  <text class="mono t" x="20" y="506">LOOM_SIGNAL_KEPT_MS</text>
  <text class="m sm" x="230" y="506">how long a counted delivery is kept — the window a reader is promised</text>
  <text class="mono t" x="20" y="528">LOOM_SIGNAL_SWEEP_MS</text>
  <text class="m sm" x="230" y="528">how often the sweep runs — filed 28 October, undocumented since</text>
  <text class="mono t" x="20" y="550">POSTGRES_URL</text>
  <text class="m sm" x="230" y="550">read when DATABASE_URL is unset, so a database could be found unexplained</text>

  <text class="m sm" x="20" y="574">Three of the six are about what a deployment counts and keeps about its readers. The guide's own sentence said eleven variables; its table had ten rows.</text>
</svg>
