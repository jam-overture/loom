<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="430" fill="#0f1115"/>
  <text x="32" y="44" fill="#e6e9ef" font-size="17">What one proposal request is made of</text>
  <text x="32" y="68" fill="#8b93a7" font-size="12.5">Characters, measured by measurePrompt. The same 51 registered themes in both bars.</text>

  <line x1="32" y1="88" x2="868" y2="88" stroke="#242938"/>

  <text x="32" y="128" fill="#c9cede" font-size="13">sample tree</text>
  <text x="32" y="146" fill="#6f7789" font-size="11.5">5 nodes · 17,146</text>
  <rect x="140" y="112" width="65"  height="30" fill="#6f7789"/>
  <rect x="205" y="112" width="182" height="30" fill="#3e63dd"/>
  <rect x="387" y="112" width="142" height="30" fill="#f5a524"/>
  <rect x="529" y="112" width="6"   height="30" fill="#30a46c"/>
  <rect x="535" y="112" width="1"   height="30" fill="#e5484d"/>
  <text x="548" y="132" fill="#f5a524" font-size="12.5">themes: 35.9%</text>

  <text x="32" y="204" fill="#c9cede" font-size="13">marketing home</text>
  <text x="32" y="222" fill="#6f7789" font-size="11.5">a real page · 30,303</text>
  <rect x="140" y="188" width="65"  height="30" fill="#6f7789"/>
  <rect x="205" y="188" width="182" height="30" fill="#3e63dd"/>
  <rect x="387" y="188" width="142" height="30" fill="#f5a524"/>
  <rect x="529" y="188" width="310" height="30" fill="#30a46c"/>
  <rect x="839" y="188" width="1"   height="30" fill="#e5484d"/>
  <text x="548" y="208" fill="#0f1115" font-size="12.5">tree projection — 44.2%</text>

  <rect x="140" y="250" width="11" height="11" fill="#6f7789"/>
  <text x="158" y="260" fill="#8b93a7" font-size="12">system prompt 2,816 (cached)</text>
  <rect x="360" y="250" width="11" height="11" fill="#3e63dd"/>
  <text x="378" y="260" fill="#8b93a7" font-size="12">primitives 7,887 (50)</text>
  <rect x="548" y="250" width="11" height="11" fill="#f5a524"/>
  <text x="566" y="260" fill="#8b93a7" font-size="12">themes 6,155 (51)</text>
  <rect x="720" y="250" width="11" height="11" fill="#30a46c"/>
  <text x="738" y="260" fill="#8b93a7" font-size="12">tree · request</text>

  <line x1="32" y1="288" x2="868" y2="288" stroke="#242938"/>

  <text x="32" y="316" fill="#e6e9ef" font-size="13.5">Not a rounding error. One fifth of a real request, and the same 6,155 characters every time —</text>
  <text x="32" y="338" fill="#e6e9ef" font-size="13.5">it does not grow with the tree, it is not cached, and a repaired intent pays it twice.</text>

  <text x="32" y="374" fill="#8b93a7" font-size="12.5">Per entry, the additions are not equal: font packs 122, style presets 118, derived palettes 85.</text>
  <text x="32" y="394" fill="#8b93a7" font-size="12.5">0077 says cut presets and packs before palettes. The cost per entry says the same thing.</text>
</svg>
