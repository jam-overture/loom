<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1080" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5f9e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="24" fill="#1a1a1a">A sink observes, and stops getting a vote</text>
  <text x="40" y="72" font-size="14.5" fill="#666666">§2 · what happens inside `commitIntent` when the event sink throws on `change-committed`</text>

  <line x1="540" y1="96" x2="540" y2="668" stroke="#dcdcdc" stroke-width="1"/>

  <!-- ============================= BEFORE ============================= -->
  <text x="40" y="118" font-size="16.5" fill="#c0392b">Before — the sink got a vote</text>

  <!-- lifeline heads -->
  <rect x="52" y="134" width="116" height="30" rx="4" fill="#f2f5f9" stroke="#2b5f9e" stroke-width="1"/>
  <text x="110" y="154" font-size="13" fill="#1a1a1a" text-anchor="middle">commitIntent</text>
  <rect x="216" y="134" width="108" height="30" rx="4" fill="#f2f5f9" stroke="#2b5f9e" stroke-width="1"/>
  <text x="270" y="154" font-size="13" fill="#1a1a1a" text-anchor="middle">TreeStore</text>
  <rect x="378" y="134" width="104" height="30" rx="4" fill="#f2f5f9" stroke="#2b5f9e" stroke-width="1"/>
  <text x="430" y="154" font-size="13" fill="#1a1a1a" text-anchor="middle">EventSink</text>

  <line x1="110" y1="164" x2="110" y2="470" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="270" y1="164" x2="270" y2="470" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="430" y1="164" x2="430" y2="470" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- append -->
  <line x1="110" y1="204" x2="266" y2="204" stroke="#2b5f9e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="188" y="197" font-size="12.5" fill="#1a1a1a" text-anchor="middle">append(delta)</text>

  <line x1="270" y1="240" x2="114" y2="240" stroke="#1e7a4a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="192" y="233" font-size="12.5" fill="#1e7a4a" text-anchor="middle">revision 1 — durable</text>
  <text x="278" y="262" font-size="11.5" fill="#1e7a4a">the log has moved · 0016</text>

  <!-- emit -->
  <line x1="110" y1="304" x2="426" y2="304" stroke="#2b5f9e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="268" y="297" font-size="12.5" fill="#1a1a1a" text-anchor="middle">emit(change-committed)</text>

  <line x1="430" y1="342" x2="114" y2="342" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="272" y="335" font-size="12.5" fill="#c0392b" text-anchor="middle">throw</text>

  <rect x="52" y="366" width="212" height="30" rx="4" fill="#fdf1f0" stroke="#c0392b" stroke-width="1.2"/>
  <text x="158" y="386" font-size="12.5" fill="#c0392b" text-anchor="middle">commitIntent throws</text>

  <rect x="52" y="418" width="430" height="88" rx="5" fill="#fdf1f0" stroke="#c0392b" stroke-width="1.2"/>
  <text x="68" y="442" font-size="13.5" fill="#c0392b">The caller is told the change failed.</text>
  <text x="68" y="464" font-size="13.5" fill="#c0392b">The log says it happened.</text>
  <text x="68" y="490" font-size="12" fill="#8a4340">Both are read from the same runtime, and they disagree.</text>

  <rect x="52" y="524" width="430" height="122" rx="5" fill="#fafafa" stroke="#d6d6d6" stroke-width="1"/>
  <text x="68" y="548" font-size="12.5" fill="#444444">Why it was possible:</text>
  <text x="68" y="572" font-size="12.5" fill="#1a1a1a">`EventSink` promised a sink cannot fail an accepted</text>
  <text x="68" y="591" font-size="12.5" fill="#1a1a1a">change — but nothing enforced it. Two call sites</text>
  <text x="68" y="610" font-size="12.5" fill="#1a1a1a">(`pipeline.ts`, `commit.ts`) called `emit` bare, so the</text>
  <text x="68" y="629" font-size="12.5" fill="#1a1a1a">promise was an obligation on whoever wrote the sink.</text>

  <!-- ============================== AFTER ============================== -->
  <text x="560" y="118" font-size="16.5" fill="#1e7a4a">After — the runtime contains it (0042)</text>

  <rect x="572" y="134" width="116" height="30" rx="4" fill="#f2f5f9" stroke="#2b5f9e" stroke-width="1"/>
  <text x="630" y="154" font-size="13" fill="#1a1a1a" text-anchor="middle">commitIntent</text>
  <rect x="736" y="134" width="108" height="30" rx="4" fill="#f2f5f9" stroke="#2b5f9e" stroke-width="1"/>
  <text x="790" y="154" font-size="13" fill="#1a1a1a" text-anchor="middle">TreeStore</text>
  <rect x="898" y="134" width="104" height="30" rx="4" fill="#f2f5f9" stroke="#2b5f9e" stroke-width="1"/>
  <text x="950" y="154" font-size="13" fill="#1a1a1a" text-anchor="middle">EventSink</text>

  <line x1="630" y1="164" x2="630" y2="470" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="790" y1="164" x2="790" y2="470" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="950" y1="164" x2="950" y2="470" stroke="#b9b9b9" stroke-width="1" stroke-dasharray="4 4"/>

  <line x1="630" y1="204" x2="786" y2="204" stroke="#2b5f9e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="708" y="197" font-size="12.5" fill="#1a1a1a" text-anchor="middle">append(delta)</text>

  <line x1="790" y1="240" x2="634" y2="240" stroke="#1e7a4a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="712" y="233" font-size="12.5" fill="#1e7a4a" text-anchor="middle">revision 1 — durable</text>
  <text x="798" y="262" font-size="11.5" fill="#1e7a4a">the log has moved · 0016</text>

  <!-- narrator gate -->
  <rect x="676" y="286" width="108" height="36" rx="17" fill="#eef6f1" stroke="#1e7a4a" stroke-width="1.4"/>
  <text x="730" y="309" font-size="12.5" fill="#1e7a4a" text-anchor="middle">narrator</text>

  <line x1="630" y1="304" x2="672" y2="304" stroke="#2b5f9e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="788" y1="304" x2="946" y2="304" stroke="#2b5f9e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="880" y="297" font-size="12.5" fill="#1a1a1a" text-anchor="middle">emit(…)</text>

  <line x1="950" y1="342" x2="790" y2="342" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="872" y="335" font-size="12.5" fill="#c0392b" text-anchor="middle">throw · reject</text>
  <line x1="730" y1="322" x2="730" y2="338" stroke="#1e7a4a" stroke-width="1.4"/>
  <path d="M 714 338 L 746 338 L 746 352 Q 730 366 714 352 Z" fill="#eef6f1" stroke="#1e7a4a" stroke-width="1.4"/>
  <text x="676" y="386" font-size="12" fill="#1e7a4a" text-anchor="middle">contained</text>

  <line x1="672" y1="304" x2="634" y2="304" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowGrey)"/>
  <text x="592" y="342" font-size="12" fill="#6b6b6b" text-anchor="middle">returns</text>

  <rect x="572" y="418" width="430" height="88" rx="5" fill="#f1f8f4" stroke="#1e7a4a" stroke-width="1.2"/>
  <text x="588" y="442" font-size="13.5" fill="#1e7a4a">The caller is told the change committed.</text>
  <text x="588" y="464" font-size="13.5" fill="#1e7a4a">The log says it happened.</text>
  <text x="588" y="490" font-size="12" fill="#3d6b52">The event is lost, and only the event. That is the whole price.</text>

  <rect x="572" y="524" width="430" height="122" rx="5" fill="#fafafa" stroke="#d6d6d6" stroke-width="1"/>
  <text x="588" y="548" font-size="12.5" fill="#444444">What changed:</text>
  <text x="588" y="572" font-size="12.5" fill="#1a1a1a">One door — `runtime/narration.ts` — is now the only place</text>
  <text x="588" y="591" font-size="12.5" fill="#1a1a1a">an envelope is built. It contains a throw *and* a rejection</text>
  <text x="588" y="610" font-size="12.5" fill="#1a1a1a">(an `async` sink assigned to `() =&gt; void`), never awaits, and</text>
  <text x="588" y="629" font-size="12.5" fill="#1a1a1a">deliberately does <tspan font-style="italic">not</tspan> contain the clock — see 0042.</text>
</svg>
