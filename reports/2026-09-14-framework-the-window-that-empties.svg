<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="640" fill="#fbfaf8"/>

  <text x="32" y="38" font-size="19" font-weight="650" fill="#1c1917">The window that empties, and the set that cannot be two sets</text>
  <text x="32" y="60" font-size="13.5" fill="#57534e">A rollup reports what its window <tspan font-style="italic">added</tspan>. So a batch counted twice is counted twice forever — and the</text>
  <text x="32" y="78" font-size="13.5" fill="#57534e">wrong number looks exactly like a busy afternoon.</text>

  <!-- the buffer -->
  <rect x="32" y="92" width="856" height="214" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="122" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">ONE RUN OVER THE BUFFER, OLDEST FIRST</text>

  <!-- ripe chips -->
  <rect x="52" y="140" width="76" height="44" rx="7" fill="#eef2f0" stroke="#b7c7bf"/>
  <text x="90" y="160" font-size="12.5" text-anchor="middle" fill="#292524">seq 41</text>
  <text x="90" y="176" font-size="10.5" text-anchor="middle" fill="#78716c">2h old</text>

  <rect x="136" y="140" width="76" height="44" rx="7" fill="#eef2f0" stroke="#b7c7bf"/>
  <text x="174" y="160" font-size="12.5" text-anchor="middle" fill="#292524">seq 42</text>
  <text x="174" y="176" font-size="10.5" text-anchor="middle" fill="#78716c">96m old</text>

  <rect x="220" y="140" width="76" height="44" rx="7" fill="#eef2f0" stroke="#b7c7bf"/>
  <text x="258" y="160" font-size="12.5" text-anchor="middle" fill="#292524">seq 43</text>
  <text x="258" y="176" font-size="10.5" text-anchor="middle" fill="#78716c">63m old</text>

  <!-- the horizon -->
  <path d="M 316 128 L 316 200" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="322" y="134" font-size="11" fill="#b45309">horizon — now minus the window</text>

  <!-- waiting chips -->
  <rect x="332" y="140" width="76" height="44" rx="7" fill="#faf9f7" stroke="#e7e5e4"/>
  <text x="370" y="160" font-size="12.5" text-anchor="middle" fill="#a8a29e">seq 44</text>
  <text x="370" y="176" font-size="10.5" text-anchor="middle" fill="#a8a29e">18m old</text>

  <rect x="416" y="140" width="76" height="44" rx="7" fill="#faf9f7" stroke="#e7e5e4"/>
  <text x="454" y="160" font-size="12.5" text-anchor="middle" fill="#a8a29e">seq 45</text>
  <text x="454" y="176" font-size="10.5" text-anchor="middle" fill="#a8a29e">just now</text>

  <text x="52" y="206" font-size="11.5" fill="#57534e">ripe — old enough to count</text>
  <text x="332" y="206" font-size="11.5" fill="#a8a29e">waiting — a page view may not be over</text>

  <!-- brace under ripe -->
  <path d="M 52 216 L 52 224 L 296 224 L 296 216" stroke="#b7c7bf" stroke-width="1.4" fill="none"/>
  <path d="M 174 224 L 174 240" stroke="#b7c7bf" stroke-width="1.4" fill="none"/>
  <path d="M 174 240 l -4 -7 h 8 z" fill="#b7c7bf"/>

  <rect x="52" y="244" width="244" height="44" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="174" y="262" font-size="12.5" text-anchor="middle" fill="#292524">rollUp → store.apply</text>
  <text x="174" y="278" font-size="10.5" text-anchor="middle" fill="#78716c">tallies and funnels, added to what is there</text>

  <path d="M 296 266 L 340 266" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 340 266 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="342" y="244" width="244" height="44" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="464" y="262" font-size="12.5" text-anchor="middle" fill="#292524">journal.forget({ before: 44 })</text>
  <text x="464" y="278" font-size="10.5" text-anchor="middle" fill="#78716c">exactly the set that was counted</text>

  <path d="M 586 266 L 630 266" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 630 266 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="632" y="244" width="236" height="44" rx="7" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="750" y="262" font-size="12.5" text-anchor="middle" fill="#292524">the view keys are gone</text>
  <text x="750" y="278" font-size="10.5" text-anchor="middle" fill="#78716c">which is 0146's whole anonymity argument</text>

  <text x="600" y="150" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">WHY ONE CALL</text>
  <text x="600" y="172" font-size="11.5" fill="#57534e">forget without counting → the batches are lost</text>
  <text x="600" y="192" font-size="11.5" fill="#57534e">count without forgetting → counted again next run</text>
  <text x="600" y="212" font-size="11.5" fill="#292524">so there is no second function to call wrongly</text>

  <!-- one number, three facts -->
  <rect x="32" y="322" width="420" height="188" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="350" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">ONE NUMBER, THREE FACTS</text>
  <text x="52" y="374" font-size="13.5" fill="#1c1917">windowMs — default 1 hour, floor 1 minute</text>

  <path d="M 52 388 L 432 388" stroke="#e7e5e4" stroke-width="1"/>
  <text x="52" y="410" font-size="12" fill="#57534e">how long a page view is given to finish</text>
  <text x="432" y="410" font-size="11.5" text-anchor="end" fill="#78716c">longer is more accurate</text>
  <text x="52" y="436" font-size="12" fill="#57534e">how long a view key lives</text>
  <text x="432" y="436" font-size="11.5" text-anchor="end" fill="#78716c">shorter is more anonymous</text>
  <text x="52" y="462" font-size="12" fill="#57534e">how far the tallies lag the buffer</text>
  <text x="432" y="462" font-size="11.5" text-anchor="end" fill="#78716c">shorter is fresher</text>
  <text x="52" y="490" font-size="11.5" fill="#78716c">0147 already asked deployments to make this trade.</text>
  <text x="52" y="506" font-size="11.5" fill="#78716c">There is no second knob to set wrongly.</text>

  <!-- the named failure -->
  <rect x="468" y="322" width="420" height="188" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="488" y="350" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">THE ONE FAILURE WITH ITS OWN NAME</text>
  <text x="488" y="374" font-size="13.5" fill="#1c1917">counted-not-forgotten</text>

  <path d="M 488 388 L 868 388" stroke="#e7e5e4" stroke-width="1"/>
  <text x="488" y="410" font-size="12" fill="#57534e">The counters took the window. The buffer would not drop it.</text>
  <text x="488" y="432" font-size="12" fill="#57534e">Durable in both places, so the next run counts it again —</text>
  <text x="488" y="452" font-size="12" fill="#57534e">the one state that gets worse when it is ignored.</text>
  <text x="488" y="482" font-size="11.5" fill="#78716c">It carries the position to prune below, so an operator has</text>
  <text x="488" y="498" font-size="11.5" fill="#78716c">something to do rather than something to read.</text>

  <!-- footer -->
  <text x="32" y="546" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">WHAT IS STILL MISSING, AND IT IS THE OTHER END</text>
  <text x="32" y="570" font-size="13" fill="#292524">The buffer has a drain and no filler: ingestReaderSignals is published, and no route handler calls it.</text>
  <text x="32" y="592" font-size="12.5" fill="#57534e">Not built here on purpose: it is the only public write surface Loom has, and who may post and how often is a decision, not a file.</text>
  <text x="32" y="616" font-size="11.5" fill="#a8a29e">framework-35-the-window-that-empties · §4c · decision 0158</text>
</svg>
