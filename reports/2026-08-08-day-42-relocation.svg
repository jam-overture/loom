<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="700" fill="#ffffff"/>

  <text x="40" y="46" font-size="23" font-weight="600" fill="#141414">The same relocation, phrased two ways</text>
  <text x="40" y="70" font-size="14" fill="#5c5c5c">Day 42 — §2. The card ends up under the header either way. Only the node the delta names is different.</text>

  <!-- the tree -->
  <g font-size="13">
    <rect x="40" y="96" width="300" height="196" rx="8" fill="#fafafa" stroke="#d6d6d6"/>
    <text x="56" y="120" font-size="12" font-weight="600" fill="#5c5c5c" letter-spacing="0.6">THE TREE</text>

    <line x1="70" y1="146" x2="70" y2="248" stroke="#c9c9c9"/>
    <line x1="70" y1="176" x2="88" y2="176" stroke="#c9c9c9"/>
    <line x1="70" y1="206" x2="88" y2="206" stroke="#c9c9c9"/>
    <line x1="70" y1="248" x2="88" y2="248" stroke="#c9c9c9"/>
    <line x1="106" y1="206" x2="106" y2="236" stroke="#c9c9c9"/>
    <line x1="106" y1="236" x2="124" y2="236" stroke="#c9c9c9"/>

    <text x="56" y="150" fill="#141414">loom.page</text>
    <text x="92" y="180" fill="#141414">loom.header</text>
    <text x="92" y="210" fill="#141414">main</text>
    <text x="150" y="210" font-size="11" fill="#8a8a8a">(slot)</text>
    <text x="128" y="240" fill="#141414">loom.card</text>
    <text x="196" y="240" font-size="11" fill="#b4232a">protected</text>
    <text x="92" y="270" fill="#141414">loom.footer</text>
  </g>

  <!-- the two deltas -->
  <g font-size="13">
    <rect x="364" y="96" width="556" height="196" rx="8" fill="#fafafa" stroke="#d6d6d6"/>
    <text x="380" y="120" font-size="12" font-weight="600" fill="#5c5c5c" letter-spacing="0.6">TWO DELTAS, ONE OUTCOME</text>

    <rect x="380" y="136" width="248" height="60" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="396" y="160" font-family="monospace" font-size="13" fill="#141414">move main → header</text>
    <text x="396" y="180" font-size="12" fill="#5c5c5c">the card rides along inside the slot</text>

    <rect x="656" y="136" width="248" height="60" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="672" y="160" font-family="monospace" font-size="13" fill="#141414">move card → header</text>
    <text x="672" y="180" font-size="12" fill="#5c5c5c">the card is named directly</text>

    <path d="M504 200 L504 224 L642 224 L642 246" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    <path d="M780 200 L780 224 L642 224" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
    <path d="M636 240 L642 250 L648 240 Z" fill="#8a8a8a"/>
    <text x="512" y="272" font-size="13" fill="#141414">the card is now under the header</text>
  </g>

  <!-- BEFORE -->
  <g font-size="13">
    <rect x="40" y="320" width="420" height="300" rx="8" fill="#fdf6f6" stroke="#e0b8b8"/>
    <text x="60" y="348" font-size="13" font-weight="600" fill="#b4232a" letter-spacing="0.6">BEFORE — the verdict follows the phrasing</text>

    <rect x="60" y="366" width="380" height="106" rx="6" fill="#ffffff" stroke="#dcdcdc"/>
    <text x="76" y="388" font-family="monospace" font-size="12" fill="#5c5c5c">move main → header</text>
    <text x="76" y="412" font-family="monospace" font-size="12" fill="#141414">touchedPrimitiveTypes: []</text>
    <text x="76" y="432" font-family="monospace" font-size="12" fill="#141414">relocatedPrimitiveTypes: —</text>
    <rect x="76" y="444" width="86" height="20" rx="10" fill="#f0e2c4"/>
    <text x="88" y="459" font-size="12" fill="#7a5c14">stakes medium</text>
    <text x="176" y="459" font-size="12" fill="#b4232a">no factor names the card</text>

    <rect x="60" y="486" width="380" height="106" rx="6" fill="#ffffff" stroke="#dcdcdc"/>
    <text x="76" y="508" font-family="monospace" font-size="12" fill="#5c5c5c">move card → header</text>
    <text x="76" y="532" font-family="monospace" font-size="12" fill="#141414">touchedPrimitiveTypes: [loom.card]</text>
    <text x="76" y="552" font-family="monospace" font-size="12" fill="#141414">relocatedPrimitiveTypes: —</text>
    <rect x="76" y="564" width="70" height="20" rx="10" fill="#e8cfcf"/>
    <text x="88" y="579" font-size="12" fill="#8c2020">stakes high</text>
    <text x="160" y="579" font-size="12" fill="#b4232a">"touches protected loom.card"</text>
  </g>

  <!-- AFTER -->
  <g font-size="13">
    <rect x="500" y="320" width="420" height="300" rx="8" fill="#f5faf6" stroke="#b4d4bd"/>
    <text x="520" y="348" font-size="13" font-weight="600" fill="#1f7a3f" letter-spacing="0.6">AFTER 0044 — the verdict follows the change</text>

    <rect x="520" y="366" width="380" height="106" rx="6" fill="#ffffff" stroke="#dcdcdc"/>
    <text x="536" y="388" font-family="monospace" font-size="12" fill="#5c5c5c">move main → header</text>
    <text x="536" y="412" font-family="monospace" font-size="12" fill="#141414">touchedPrimitiveTypes: []</text>
    <text x="536" y="432" font-family="monospace" font-size="12" fill="#141414">relocatedPrimitiveTypes: [loom.card]</text>
    <rect x="536" y="444" width="70" height="20" rx="10" fill="#cfe3d6"/>
    <text x="548" y="459" font-size="12" fill="#1f7a3f">stakes high</text>
    <text x="620" y="459" font-size="12" fill="#3d6b4c">"relocates protected loom.card"</text>

    <rect x="520" y="486" width="380" height="106" rx="6" fill="#ffffff" stroke="#dcdcdc"/>
    <text x="536" y="508" font-family="monospace" font-size="12" fill="#5c5c5c">move card → header</text>
    <text x="536" y="532" font-family="monospace" font-size="12" fill="#141414">touchedPrimitiveTypes: []</text>
    <text x="536" y="552" font-family="monospace" font-size="12" fill="#141414">relocatedPrimitiveTypes: [loom.card]</text>
    <rect x="536" y="564" width="70" height="20" rx="10" fill="#cfe3d6"/>
    <text x="548" y="579" font-size="12" fill="#1f7a3f">stakes high</text>
    <text x="620" y="579" font-size="12" fill="#3d6b4c">"relocates protected loom.card"</text>
  </g>

  <text x="40" y="654" font-size="13" fill="#141414">
    <tspan font-weight="600">touched</tspan> now means created, destroyed, or reconfigured — a move contributes nothing to it, whichever node it names.
  </text>
  <text x="40" y="676" font-size="13" fill="#141414">
    <tspan font-weight="600">relocated</tspan> is the whole moved subtree, the named node included. Reversibility reads both, and ties go to irreversible.
  </text>
</svg>
