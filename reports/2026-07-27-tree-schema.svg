<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font-size: 21px; font-weight: 650; fill: #0f172a; }
      .sub { font-size: 13px; fill: #64748b; }
      .panel-title { font-size: 12px; font-weight: 650; fill: #475569; letter-spacing: 0.09em; }
      .node-label { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .node-id { font-size: 11px; fill: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .op { font-size: 13px; font-weight: 650; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .op-desc { font-size: 11.5px; fill: #475569; }
      .code { font-size: 12px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .code-dim { font-size: 12px; fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .legend { font-size: 11.5px; fill: #475569; }
      .stage { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .edge { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1080" height="760" fill="#ffffff"/>

  <text class="title" x="40" y="46">Loom — Tree schema and the delta model</text>
  <text class="sub" x="40" y="70">Build order §1 · 2026-07-27 · a tree changes only by applying an ordered, atomic TreeDelta</text>
  <line x1="40" y1="88" x2="1040" y2="88" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ── Panel A: the AST ─────────────────────────────────────────────── -->
  <text class="panel-title" x="40" y="122">THE AST — THREE NODE KINDS</text>

  <!-- root -->
  <rect x="150" y="140" width="176" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text class="node-label" x="164" y="160">element loom.page</text>
  <text class="node-id" x="164" y="175">n_7 · props { title }</text>

  <!-- edges from root -->
  <path class="edge" d="M 238 182 L 238 200 L 106 200 L 106 224" marker-end="url(#arrow)"/>
  <path class="edge" d="M 238 182 L 238 224" marker-end="url(#arrow)"/>
  <path class="edge" d="M 238 182 L 238 200 L 372 200 L 372 224" marker-end="url(#arrow)"/>

  <!-- header -->
  <rect x="24" y="224" width="164" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text class="node-label" x="38" y="244">element loom.header</text>
  <text class="node-id" x="38" y="259">n_2</text>

  <!-- slot main -->
  <rect x="190" y="224" width="96" height="42" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
  <text class="node-label" x="204" y="244">slot main</text>
  <text class="node-id" x="204" y="259">n_4</text>

  <!-- footer -->
  <rect x="292" y="224" width="160" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text class="node-label" x="306" y="244">element loom.footer</text>
  <text class="node-id" x="306" y="259">n_6</text>

  <path class="edge" d="M 106 266 L 106 296" marker-end="url(#arrow)"/>
  <path class="edge" d="M 238 266 L 238 296" marker-end="url(#arrow)"/>

  <!-- headline text -->
  <rect x="24" y="296" width="164" height="42" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <text class="node-label" x="38" y="316">text "Welcome"</text>
  <text class="node-id" x="38" y="331">n_1</text>

  <!-- card -->
  <rect x="190" y="296" width="176" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text class="node-label" x="204" y="316">element loom.card</text>
  <text class="node-id" x="204" y="331">n_5 · props { variant }</text>

  <path class="edge" d="M 278 338 L 278 368" marker-end="url(#arrow)"/>
  <rect x="190" y="368" width="176" height="42" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <text class="node-label" x="204" y="388">text "Body copy"</text>
  <text class="node-id" x="204" y="403">n_3</text>

  <!-- legend -->
  <rect x="24" y="432" width="13" height="13" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text class="legend" x="45" y="443">element — registered primitive; props + ordered children</text>
  <rect x="24" y="454" width="13" height="13" rx="3" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <text class="legend" x="45" y="465">text — leaf string, addressable like any other node</text>
  <rect x="24" y="476" width="13" height="13" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
  <text class="legend" x="45" y="487">slot — named projection region; children are the fallback</text>

  <text class="legend" x="24" y="518">A NodeId is minted once, at insert, and never changes — not on</text>
  <text class="legend" x="24" y="535">move, not on configure. Position is derived; the id is the address.</text>

  <!-- divider -->
  <line x1="500" y1="106" x2="500" y2="560" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ── Panel B: the four operations ─────────────────────────────────── -->
  <text class="panel-title" x="540" y="122">THE DELTA — FOUR DISCRETE OPERATIONS</text>

  <rect x="540" y="140" width="500" height="62" rx="9" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="op" x="558" y="163">insert</text>
  <text class="code-dim" x="620" y="163">{ parentId, index, node }</text>
  <text class="op-desc" x="558" y="184">Attaches a new subtree. Rejected if any incoming id already</text>
  <text class="op-desc" x="558" y="197">exists, or repeats within the subtree.</text>

  <rect x="540" y="212" width="500" height="62" rx="9" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="op" x="558" y="235">remove</text>
  <text class="code-dim" x="632" y="235">{ nodeId }</text>
  <text class="op-desc" x="558" y="256">Detaches the node and everything under it. The root is not</text>
  <text class="op-desc" x="558" y="269">detachable.</text>

  <rect x="540" y="284" width="500" height="62" rx="9" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="op" x="558" y="307">move</text>
  <text class="code-dim" x="612" y="307">{ nodeId, parentId, index }</text>
  <text class="op-desc" x="558" y="328">Detach then insert, so index is read against the post-detach</text>
  <text class="op-desc" x="558" y="341">list. Cannot move a node into itself or its own descendant.</text>

  <rect x="540" y="356" width="500" height="62" rx="9" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="op" x="558" y="379">configure</text>
  <text class="code-dim" x="646" y="379">{ nodeId, set, unset }</text>
  <text class="op-desc" x="558" y="400">Patches a node's settable surface: props on an element,</text>
  <text class="op-desc" x="558" y="413">value on text, name on a slot. Never changes a node's kind.</text>

  <rect x="540" y="432" width="500" height="104" rx="9" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text class="panel-title" x="558" y="455">WHY EXACTLY FOUR</text>
  <text class="op-desc" x="558" y="477">Every structural edit is expressible, and each operation stays</text>
  <text class="op-desc" x="558" y="491">individually reviewable — the Gate can reason about "insert a</text>
  <text class="op-desc" x="558" y="505">checkout button into the sidebar" without diffing two trees.</text>
  <text class="op-desc" x="558" y="519">Whole-tree replacement is deliberately not an operation.</text>

  <!-- ── Panel C: apply pipeline ──────────────────────────────────────── -->
  <line x1="40" y1="580" x2="1040" y2="580" stroke="#e2e8f0" stroke-width="1"/>
  <text class="panel-title" x="40" y="610">APPLICATION — PURE, ATOMIC, REVISIONED</text>

  <rect x="40" y="628" width="150" height="56" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="stage" x="58" y="652">LoomTree</text>
  <text class="code" x="58" y="670">revision: 4</text>

  <rect x="230" y="628" width="168" height="56" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="stage" x="248" y="652">TreeDelta</text>
  <text class="code" x="248" y="670">baseRevision: 4</text>

  <rect x="438" y="628" width="196" height="56" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text class="stage" x="456" y="652">applyDelta</text>
  <text class="op-desc" x="456" y="670">fold ops, short-circuit</text>

  <rect x="674" y="628" width="166" height="56" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text class="stage" x="692" y="652">ok(LoomTree)</text>
  <text class="code" x="692" y="670">revision: 5</text>

  <rect x="674" y="700" width="166" height="44" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text class="stage" x="692" y="728">err(TreeError)</text>

  <path class="edge" d="M 190 656 L 230 656" marker-end="url(#arrow)"/>
  <path class="edge" d="M 398 656 L 438 656" marker-end="url(#arrow)"/>
  <path d="M 634 656 L 674 656" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#arrowAccent)"/>
  <path d="M 536 684 L 536 722 L 674 722" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>

  <text class="op-desc" x="862" y="644">A delta names the revision it</text>
  <text class="op-desc" x="862" y="659">was authored against, so a stale</text>
  <text class="op-desc" x="862" y="674">proposal is rejected instead of</text>
  <text class="op-desc" x="862" y="689">landing on a tree that moved on.</text>
  <text class="op-desc" x="862" y="714">One failing operation discards</text>
  <text class="op-desc" x="862" y="729">the whole delta — the tree is</text>
  <text class="op-desc" x="862" y="744">never left half-edited.</text>
</svg>
