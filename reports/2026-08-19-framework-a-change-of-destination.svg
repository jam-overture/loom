<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="900" height="430" fill="#0f1115"/>
  <text x="32" y="44" fill="#e6e9ef" font-size="17" font-family="ui-sans-serif, system-ui, sans-serif">What the Gate says about a form whose destination moved</text>
  <text x="32" y="68" fill="#8b93a7" font-size="12.5">One tree, one form, already posting to newsletter.subscribe. Real dispositions, from src/runtime.</text>

  <line x1="32" y1="88" x2="868" y2="88" stroke="#242938"/>
  <text x="32" y="110" fill="#6f7789" font-size="11.5">CHANGE</text>
  <text x="470" y="110" fill="#6f7789" font-size="11.5">ORIGIN</text>
  <text x="580" y="110" fill="#6f7789" font-size="11.5">STAKES</text>
  <text x="676" y="110" fill="#6f7789" font-size="11.5">DISPOSITION</text>

  <line x1="32" y1="124" x2="868" y2="124" stroke="#242938"/>
  <text x="32" y="152" fill="#c8cedb" font-size="13">the form&#8217;s legend is rewritten</text>
  <text x="470" y="152" fill="#8b93a7" font-size="13">developer</text>
  <text x="580" y="152" fill="#8b93a7" font-size="13">low</text>
  <text x="676" y="152" fill="#5ec27a" font-size="13">accepted</text>
  <text x="32" y="172" fill="#5a6274" font-size="11.5">within-policy</text>

  <line x1="32" y1="192" x2="868" y2="192" stroke="#1b2030"/>
  <text x="32" y="220" fill="#c8cedb" font-size="13">it is pointed at another registered endpoint</text>
  <text x="470" y="220" fill="#8b93a7" font-size="13">developer</text>
  <text x="580" y="220" fill="#e0a648" font-size="13">high</text>
  <text x="676" y="220" fill="#e0a648" font-size="13">requires-confirmation</text>
  <text x="32" y="240" fill="#5a6274" font-size="11.5">redirected-submission &#183; redirects a submission: n_form1 from newsletter.subscribe to contact.enquiry</text>

  <line x1="32" y1="260" x2="868" y2="260" stroke="#1b2030"/>
  <text x="32" y="288" fill="#c8cedb" font-size="13">the same change, for the narrower origin</text>
  <text x="470" y="288" fill="#8b93a7" font-size="13">user-instruction</text>
  <text x="580" y="288" fill="#e0a648" font-size="13">high</text>
  <text x="676" y="288" fill="#e0a648" font-size="13">requires-confirmation</text>
  <text x="32" y="308" fill="#5a6274" font-size="11.5">redirected-submission &#183; the ceiling is per origin; this rule is not</text>

  <line x1="32" y1="328" x2="868" y2="328" stroke="#1b2030"/>
  <text x="32" y="356" fill="#c8cedb" font-size="13">the same change, where the host set refusalFloor: high</text>
  <text x="470" y="356" fill="#8b93a7" font-size="13">developer</text>
  <text x="580" y="356" fill="#e0a648" font-size="13">high</text>
  <text x="676" y="356" fill="#d4635f" font-size="13">rejected</text>
  <text x="32" y="376" fill="#5a6274" font-size="11.5">stakes-at-refusal-floor &#183; the floor stays sovereign over the escalation</text>

  <line x1="32" y1="396" x2="868" y2="396" stroke="#242938"/>
  <text x="32" y="418" fill="#5a6274" font-size="11.5">0071 &#183; high rather than critical, because moving a form is a change somebody may legitimately want &#8212; just never unnoticed.</text>
</svg>
