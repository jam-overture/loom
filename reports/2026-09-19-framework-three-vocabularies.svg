<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="620" fill="#fbfaf8"/>

  <text x="32" y="38" font-size="19" font-weight="650" fill="#1c1917">Five projections built so a model could be told, and two that were sending</text>
  <text x="32" y="60" font-size="13.5" fill="#57534e">Each seam built the projection its own record asked for. Only the first two reached a prompt; the other three were</text>
  <text x="32" y="78" font-size="13.5" fill="#57534e">written, tested, documented, and called by nothing. Costs below are measured, not estimated.</text>

  <!-- TABLE HEAD -->
  <text x="52" y="116" font-size="11.5" font-weight="650" fill="#78716c" letter-spacing="0.06em">PROJECTION</text>
  <text x="300" y="116" font-size="11.5" font-weight="650" fill="#78716c" letter-spacing="0.06em">RECORD</text>
  <text x="380" y="116" font-size="11.5" font-weight="650" fill="#78716c" letter-spacing="0.06em">REACHED THE MODEL</text>
  <text x="600" y="116" font-size="11.5" font-weight="650" fill="#78716c" letter-spacing="0.06em">BLOCK, AT ONE ENTRY</text>
  <text x="790" y="116" font-size="11.5" font-weight="650" fill="#78716c" letter-spacing="0.06em">PER ENTRY</text>
  <line x1="32" y1="126" x2="888" y2="126" stroke="#e7e5e4"/>

  <!-- ROWS -->
  <rect x="32" y="134" width="856" height="36" rx="6" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="157" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">catalogueOf</text>
  <text x="300" y="157" font-size="12.5" fill="#57534e">0013</text>
  <text x="380" y="157" font-size="12.5" font-weight="600" fill="#166534">yes</text>
  <text x="600" y="157" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">16,718 (96)</text>
  <text x="790" y="157" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57534e">~171</text>

  <rect x="32" y="174" width="856" height="36" rx="6" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="197" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">ThemeRegistry.catalogue</text>
  <text x="300" y="197" font-size="12.5" fill="#57534e">0049</text>
  <text x="380" y="197" font-size="12.5" font-weight="600" fill="#166534">yes</text>
  <text x="600" y="197" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">6,155 (51)</text>
  <text x="790" y="197" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57534e">—</text>

  <rect x="32" y="214" width="856" height="36" rx="6" fill="#fffbf5" stroke="#fed7aa"/>
  <text x="52" y="237" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">dataCatalogue</text>
  <text x="300" y="237" font-size="12.5" fill="#57534e">0058</text>
  <text x="380" y="237" font-size="12.5" font-weight="600" fill="#9a3412">no — nothing called it</text>
  <text x="600" y="237" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">773</text>
  <text x="790" y="237" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57534e">86</text>

  <rect x="32" y="254" width="856" height="36" rx="6" fill="#fffbf5" stroke="#fed7aa"/>
  <text x="52" y="277" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">submissionCatalogue</text>
  <text x="300" y="277" font-size="12.5" fill="#57534e">0065</text>
  <text x="380" y="277" font-size="12.5" font-weight="600" fill="#9a3412">no — nothing called it</text>
  <text x="600" y="277" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">441</text>
  <text x="790" y="277" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57534e">49</text>

  <rect x="32" y="294" width="856" height="36" rx="6" fill="#fffbf5" stroke="#fed7aa"/>
  <text x="52" y="317" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">frameCatalogue</text>
  <text x="300" y="317" font-size="12.5" fill="#57534e">0095</text>
  <text x="380" y="317" font-size="12.5" font-weight="600" fill="#9a3412">no — nothing called it</text>
  <text x="600" y="317" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">364</text>
  <text x="790" y="317" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57534e">51</text>

  <!-- WHAT IT COST -->
  <rect x="32" y="356" width="416" height="228" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="384" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">WHAT ONE REQUEST COSTS</text>
  <text x="52" y="410" font-size="12.5" fill="#57534e">Sample tree, starter library, starter themes.</text>

  <text x="52" y="440" font-size="12.5" fill="#57534e">nothing wired</text>
  <text x="404" y="440" font-size="12.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">3,124</text>

  <text x="52" y="466" font-size="12.5" fill="#57534e">library + themes (every deployment today)</text>
  <text x="404" y="466" font-size="12.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">25,997</text>

  <text x="52" y="492" font-size="12.5" fill="#57534e">+ 1 source, 1 endpoint, 1 origin</text>
  <text x="404" y="492" font-size="12.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">27,575</text>

  <text x="52" y="518" font-size="12.5" fill="#57534e">+ 8 sources, 4 endpoints, 3 origins</text>
  <text x="404" y="518" font-size="12.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">28,426</text>

  <line x1="52" y1="534" x2="404" y2="534" stroke="#e7e5e4"/>
  <text x="52" y="558" font-size="12.5" fill="#57534e">A deployment that wired none of the three</text>
  <text x="52" y="576" font-size="12.5" font-weight="600" fill="#1c1917">pays nothing: the blocks are absent, not empty.</text>

  <!-- THE THREE INSTRUCTIONS -->
  <rect x="472" y="356" width="416" height="228" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="492" y="384" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">AND THE THREE ARE NOT ALIKE</text>

  <text x="492" y="412" font-size="12.5" font-weight="600" fill="#292524">sources</text>
  <text x="492" y="430" font-size="12.5" fill="#57534e">Two refusals are loud. The third — a binding name</text>
  <text x="492" y="448" font-size="12.5" fill="#57534e">nothing reads — resolves, then is read by nobody,</text>
  <text x="492" y="466" font-size="12.5" fill="#57534e">so the block says: do not invent one.</text>

  <text x="492" y="494" font-size="12.5" font-weight="600" fill="#292524">endpoints</text>
  <text x="492" y="512" font-size="12.5" fill="#57534e">An id and a line. The address never goes in the tree.</text>

  <text x="492" y="540" font-size="12.5" font-weight="600" fill="#292524">origins</text>
  <text x="492" y="558" font-size="12.5" fill="#57534e">The only list that is not what may be written — it is</text>
  <text x="492" y="576" font-size="12.5" fill="#57534e">a constraint on a URL the model still chooses.</text>
</svg>
