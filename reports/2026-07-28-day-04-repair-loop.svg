<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" role="img" aria-label="The repair loop: a refused proposal gets exactly one more attempt, with both dispositions recorded">
  <title>Loom — one repair attempt, and the record it leaves</title>
  <desc>Left: the composition pipeline with the repair branch, showing that a refusal is emitted before the repair is requested and that the repaired proposal is judged by the same Gate. Right: the resulting event stream, with the original refusal and the repaired acceptance both present, linked by repairOf.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52606d"/>
    </marker>
    <marker id="a-rep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="a-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2933; }
      .h { font-family: Georgia, "Times New Roman", serif; fill: #1f2933; }
      .lbl { font-size: 12px; }
      .sm { font-size: 10.5px; fill: #52606d; }
      .box { fill: #f6f8fa; stroke: #c9d2dc; stroke-width: 1.2; }
      .pure { fill: #f1f7f6; stroke: #0f766e; stroke-width: 1.2; }
      .ai { fill: #fdf5e7; stroke: #b45309; stroke-width: 1.4; }
      .bad { fill: #fdf1f1; stroke: #b91c1c; stroke-width: 1.2; }
      .flow { stroke: #52606d; stroke-width: 1.4; fill: none; }
      .rep { stroke: #b45309; stroke-width: 1.6; fill: none; }
      .stop { stroke: #b91c1c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .rule { stroke: #dde3ea; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1040" height="700" fill="#ffffff"/>

  <text class="h" x="32" y="40" font-size="21">One repair attempt, and the record it leaves</text>
  <text class="t sm" x="32" y="60">§2 — a refusal is no longer a dead end, and it is not erased either</text>

  <line class="rule" x1="32" y1="78" x2="1008" y2="78"/>

  <!-- ===== left: the path ===== -->
  <text class="h" x="32" y="106" font-size="14">The path</text>

  <g transform="translate(32,120)">
    <rect class="box" x="0" y="0" width="150" height="40" rx="4"/>
    <text class="t lbl" x="12" y="25">EditIntent</text>
  </g>

  <g transform="translate(32,182)">
    <rect class="ai" x="0" y="0" width="150" height="46" rx="4"/>
    <text class="t lbl" x="12" y="20">interpret</text>
    <text class="t sm" x="12" y="36">ChangeInterpreter</text>
  </g>

  <g transform="translate(32,250)">
    <rect class="pure" x="0" y="0" width="150" height="60" rx="4"/>
    <text class="t lbl" x="12" y="22">assess + Gate</text>
    <text class="t sm" x="12" y="40">the same pure</text>
    <text class="t sm" x="12" y="52">function, both times</text>
  </g>

  <g transform="translate(32,332)">
    <rect class="bad" x="0" y="0" width="150" height="46" rx="4"/>
    <text class="t lbl" x="12" y="20">rejected</text>
    <text class="t sm" x="12" y="36">emitted before anything else</text>
  </g>

  <!-- repair branch -->
  <g transform="translate(232,332)">
    <rect class="ai" x="0" y="0" width="212" height="86" rx="4"/>
    <text class="t lbl" x="12" y="22">repair — one attempt</text>
    <text class="t sm" x="12" y="40">ChangeRepairer, a separate</text>
    <text class="t sm" x="12" y="54">interface. No repairer wired</text>
    <text class="t sm" x="12" y="68">in → a refusal stays terminal.</text>
    <text class="t sm" x="12" y="82" fill="#b45309">told which rule fired, and why</text>
  </g>

  <g transform="translate(232,448)">
    <rect class="pure" x="0" y="0" width="212" height="70" rx="4"/>
    <text class="t lbl" x="12" y="22">runtime stamps repairOf</text>
    <text class="t sm" x="12" y="40">the link is the runtime's to</text>
    <text class="t sm" x="12" y="54">record — a repairer that claims</text>
    <text class="t sm" x="12" y="66">otherwise is overruled</text>
  </g>

  <g transform="translate(32,448)">
    <rect class="bad" x="0" y="0" width="150" height="70" rx="4"/>
    <text class="t lbl" x="12" y="22">terminal</text>
    <text class="t sm" x="12" y="40">refused again, or the</text>
    <text class="t sm" x="12" y="54">repairer declined —</text>
    <text class="t sm" x="12" y="66">no second repair exists</text>
  </g>

  <g transform="translate(232,548)">
    <rect class="pure" x="0" y="0" width="212" height="46" rx="4"/>
    <text class="t lbl" x="12" y="20">assess + Gate, again</text>
    <text class="t sm" x="12" y="36">same policy, no second chance</text>
  </g>

  <path class="flow" d="M 107 160 L 107 178" marker-end="url(#a)"/>
  <path class="flow" d="M 107 228 L 107 246" marker-end="url(#a)"/>
  <path class="flow" d="M 107 310 L 107 328" marker-end="url(#a)"/>
  <path class="rep" d="M 182 355 L 228 355" marker-end="url(#a-rep)"/>
  <path class="rep" d="M 338 418 L 338 444" marker-end="url(#a-rep)"/>
  <path class="rep" d="M 338 518 L 338 544" marker-end="url(#a-rep)"/>
  <path class="stop" d="M 300 418 L 300 430 L 107 430 L 107 444" marker-end="url(#a-stop)"/>
  <path class="stop" d="M 232 571 L 190 571 L 190 522" marker-end="url(#a-stop)"/>
  <text class="t sm" x="196" y="345" fill="#b45309">only on a refusal</text>
  <text class="t sm" x="196" y="640">Not repaired: requires-confirmation (a person was asked)</text>
  <text class="t sm" x="196" y="656">or not-applicable (an interpreter bug, not a policy call)</text>

  <!-- ===== right: the record ===== -->
  <line class="rule" x1="486" y1="96" x2="486" y2="660"/>
  <text class="h" x="520" y="106" font-size="14">The record it leaves</text>
  <text class="t sm" x="520" y="124">Both halves survive. That is what makes the pattern findable.</text>

  <g transform="translate(520,140)">
    <rect class="box" x="0" y="0" width="470" height="404" rx="4"/>
    <g class="t" font-size="11.5">
      <text x="16" y="28">intent-received</text>
      <text x="16" y="52">change-proposed        <tspan class="sm">p_1 — remove the whole section</tspan></text>
      <text x="16" y="76">change-assessed</text>
      <text x="16" y="100" fill="#b91c1c">disposition-decided    <tspan class="sm" fill="#b91c1c">rejected · stakes-at-refusal-floor</tspan></text>
      <text x="16" y="130" fill="#b45309">repair-requested       <tspan class="sm" fill="#b45309">refusedProposalId: p_1</tspan></text>
      <text x="16" y="154">change-proposed        <tspan class="sm">p_2 — repairOf: p_1</tspan></text>
      <text x="16" y="178">change-assessed</text>
      <text x="16" y="202" fill="#0f766e">disposition-decided    <tspan class="sm" fill="#0f766e">accepted</tspan></text>
      <text x="16" y="226">change-applied</text>
    </g>
    <line class="rule" x1="16" y1="252" x2="454" y2="252"/>
    <text class="t sm" x="16" y="274">The refusal is never replaced by the repair — it is emitted first,</text>
    <text class="t sm" x="16" y="290">and stays. A weaker change accepted after a refusal therefore</text>
    <text class="t sm" x="16" y="306">reads as exactly that in the stream.</text>
    <text class="t sm" x="16" y="334" fill="#b45309">§6 is expected to look for this shape: refused → repairOf →</text>
    <text class="t sm" x="16" y="350" fill="#b45309">accepted, counted per interpreter. It is how salami-slicing</text>
    <text class="t sm" x="16" y="366" fill="#b45309">would show up — the loop is bounded, not prevented.</text>
    <text class="t sm" x="16" y="390">A repairer that declines emits repair-failed; the first refusal stands.</text>
  </g>

  <text class="t sm" x="520" y="574">Also this session: InterpretationError gained `refused`, so a model declining a</text>
  <text class="t sm" x="520" y="590">request is no longer indistinguishable from the model being down — one is a</text>
  <text class="t sm" x="520" y="606">content signal, the other an outage.</text>
</svg>
