  <text x="600" y="160" font-size="11.5" fill="#5c5751">Fraction of the most chroma</text>
  <text x="600" y="178" font-size="11.5" fill="#5c5751">sRGB can hold — pure blue is 1.</text>
  <text x="600" y="208" font-size="11.5" fill="#5c5751">Bars are painted in the slot</text>
  <text x="600" y="226" font-size="11.5" fill="#5c5751">they measure.</text>
  <rect x="600" y="248" width="280" height="92" rx="10" fill="#faf8f5" stroke="#e4ded5"/>
  <text x="618" y="272" font-size="10.5" font-weight="700" fill="#8a8178" letter-spacing="0.06em">THE FINDING, AS A NUMBER</text>
  <text x="618" y="296" font-size="12.5" fill="#5c5751">bold <tspan font-weight="650" fill="#15120e">0.584</tspan> · editorial <tspan font-weight="650" fill="#15120e">0.121</tspan></text>
  <text x="618" y="318" font-size="12.5" fill="#5c5751">A factor of <tspan font-weight="650" fill="#15120e">4.8</tspan>, under one opacity.</text>

  <text x="40" y="410" font-size="10.5" font-weight="700" fill="#8a8178" letter-spacing="0.06em">A DARK WASH, AS A PAIR — --loom-scrim AND --loom-scrim-fg</text>
  <text x="40" y="429" font-size="11.5" fill="#5c5751">The palette's own body-copy pair, whichever way round is darker. No invented colour, and a contrast the contrast bar already asserts.</text>
  
