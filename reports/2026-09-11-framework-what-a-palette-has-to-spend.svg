  <text x="40" y="46" font-size="21" font-weight="650" fill="#15120e">What a palette has to spend</text>
  <text x="40" y="70" font-size="13.5" fill="#5c5751">Two things a paint needed and CSS could not ask — both <tspan font-style="italic">measured</tspan> from slots the palette already declares.</text>

  <text x="40" y="112" font-size="10.5" font-weight="700" fill="#8a8178" letter-spacing="0.06em">CHROMA OF ACCENT-STRONG, ALL 21 STARTER PALETTES — --loom-accent-strong-chroma</text>
  <text x="40" y="131" font-size="11.5" fill="#5c5751">The same aurora at the same opacity: luminous on the full bars, a grey blob on the short ones. A stylesheet can now tell them apart.</text>
  
