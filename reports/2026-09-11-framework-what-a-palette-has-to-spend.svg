  <text x="314" y="514" font-size="11.5" fill="#5c5751">ink <tspan font-weight="650" fill="#15120e">bg-canvas</tspan></text>
  <text x="314" y="532" font-size="11.5" fill="#5c5751">18.93:1, lum 0.003</text>
  <text x="58" y="572" font-size="11.5" fill="#5c5751">Light palette: the ink becomes the ground, the page becomes the ink.</text>
  
