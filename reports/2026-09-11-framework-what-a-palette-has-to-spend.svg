  <text x="97" y="511" font-size="15" fill="#0a0a0a" text-anchor="middle">Aa</text>
  <text x="97" y="542" font-size="9.5" fill="#8a8178" text-anchor="middle">the page</text>
  <text x="152" y="511" font-size="15" fill="#8a8178">→</text>
