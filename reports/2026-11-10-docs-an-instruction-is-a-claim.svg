<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 650; fill: #0f172a; }
    .sub { font-size: 13px; fill: #64748b; }
    .panel-title { font-size: 12px; font-weight: 650; fill: #475569; letter-spacing: 0.09em; }
    .net { font-size: 13.5px; font-weight: 650; fill: #334155; }
    .eg { font-size: 11.5px; fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .val { font-size: 12px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .hit { font-size: 12px; font-weight: 650; fill: #7c3aed; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note { font-size: 11.5px; fill: #64748b; }
    .legend { font-size: 12px; fill: #475569; }
    .foot { font-size: 12px; fill: #475569; }
  </style>
  <rect width="1080" height="640" fill="#ffffff"/>
  <text x="72" y="48" class="title">Four nets over the same thirty-five pages, and only one of them is worth having</text>
  <text x="72" y="72" class="sub">Every written page of the Loom documentation site, swept for a sentence that tells a reader to do work. Measured on this branch.</text>
  <rect x="72" y="94" width="13" height="13" rx="2.5" fill="#cbd5e1"/>
  <text x="92" y="105" class="legend">sentences the net flags</text>
  <rect x="300" y="94" width="13" height="13" rx="2.5" fill="#7c3aed"/>
  <text x="320" y="105" class="legend">of those, a claim about what the runtime will not do for you</text>
  <text x="72" y="150" class="panel-title">WHAT EACH NET CATCHES</text>
  <text x="72" y="192" class="net">a sentence opening in an imperative verb</text>
  <text x="72" y="211" class="eg">Press a chip · Run it · Look at it</text>
  <rect x="392" y="178" width="588.0" height="26" rx="3" fill="#cbd5e1"/>
  <text x="990.0" y="197" class="val">97</text>
  <text x="1016.0" y="197" class="hit">—</text>
  <text x="392" y="222" class="note">the tutorial voice</text>
  <text x="72" y="286" class="net">by hand</text>
  <text x="72" y="305" class="eg">writing it out by hand is miserable</text>
  <rect x="392" y="272" width="66.7" height="26" rx="3" fill="#cbd5e1"/>
  <text x="468.7" y="291" class="val">11</text>
  <text x="494.7" y="291" class="hit">—</text>
  <text x="392" y="316" class="note">the work the runtime removed</text>
  <text x="72" y="380" class="net">the host in the third person</text>
  <text x="72" y="399" class="eg">your app has to · a deployment must</text>
  <rect x="392" y="366" width="42.4" height="26" rx="3" fill="#cbd5e1"/>
  <rect x="392" y="366" width="6.1" height="26" rx="3" fill="#7c3aed"/>
  <text x="444.4" y="385" class="val">7</text>
  <text x="462.4" y="385" class="hit">1 real</text>
  <text x="392" y="410" class="note">six are one page’s title in a link</text>
  <text x="72" y="474" class="net">the second person under an obligation</text>
  <text x="72" y="493" class="eg">you have to · yourself · remember to</text>
  <rect x="392" y="460" width="115.2" height="26" rx="3" fill="#cbd5e1"/>
  <rect x="392" y="460" width="18.2" height="26" rx="3" fill="#7c3aed"/>
  <text x="517.2" y="479" class="val">19</text>
  <text x="543.2" y="479" class="hit">3 real</text>
  <text x="392" y="504" class="note">swept, and registered</text>
  <line x1="72" y1="562" x2="1008" y2="562" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="588" class="foot">The imperative is not the marker. A page that says <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Press a chip and watch the revision go up</tspan> is teaching; a page that says</text>
  <text x="72" y="608" class="foot">you do this part <tspan font-style="italic">yourself</tspan> is making a claim about the runtime, and that claim goes false the day the runtime starts doing it.</text>
  <text x="72" y="628" class="foot">Three such claims are registered, each beside the published declaration that will contradict it.</text>
</svg>
