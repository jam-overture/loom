<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 668" width="920" height="668" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="668" fill="#fbfaf8"/>

  <text x="32" y="44" font-size="19" font-weight="650" fill="#1c1917">The broadcaster stops going blind</text>
  <text x="32" y="68" font-size="13.5" fill="#57534e">It found the addressed nodes once. Everything rendered afterwards was invisible to viewed and dwelled —</text>
  <text x="32" y="87" font-size="13.5" fill="#57534e">including every band a proposal had just changed, which is the one measurement Loom exists to make.</text>

  <!-- panel one: what the page gains -->
  <rect x="32" y="112" width="856" height="248" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="140" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">A PAGE THAT CHANGES AFTER THE BROADCAST STARTED</text>

  <text x="52" y="170" font-size="11.5" fill="#78716c">present when it started</text>
  <rect x="52" y="180" width="122" height="34" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="113" y="202" font-size="12.5" text-anchor="middle" fill="#292524">loom.page</text>
  <rect x="52" y="220" width="122" height="34" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="113" y="242" font-size="12.5" text-anchor="middle" fill="#292524">loom.section</text>
  <text x="113" y="274" font-size="11.5" text-anchor="middle" fill="#15803d">observed ✓</text>

  <path d="M 186 218 L 226 218" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 226 218 l -7 -4 v 8 z" fill="#a8a29e"/>
  <text x="206" y="208" font-size="11" text-anchor="middle" fill="#a8a29e">then</text>

  <text x="238" y="170" font-size="11.5" fill="#78716c">arriving afterwards — three ordinary ways a page grows</text>
  <rect x="238" y="180" width="196" height="34" rx="7" fill="#fafaf9" stroke="#d6d3d1" stroke-dasharray="4 3"/>
  <text x="336" y="202" font-size="12.5" text-anchor="middle" fill="#57534e">a Suspense boundary resolves</text>
  <rect x="444" y="180" width="196" height="34" rx="7" fill="#fafaf9" stroke="#d6d3d1" stroke-dasharray="4 3"/>
  <text x="542" y="202" font-size="12.5" text-anchor="middle" fill="#57534e">a client component mounts</text>
  <rect x="650" y="180" width="196" height="34" rx="7" fill="#fafaf9" stroke="#d6d3d1" stroke-dasharray="4 3"/>
  <text x="748" y="202" font-size="12.5" text-anchor="middle" fill="#57534e">a list grows</text>

  <rect x="238" y="220" width="608" height="34" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="542" y="242" font-size="12.5" text-anchor="middle" fill="#78350f">…and the one that is the whole product: a proposal is applied, and the changed band renders</text>

  <text x="52" y="304" font-size="12" font-weight="650" fill="#b91c1c" letter-spacing="0.04em">BEFORE</text>
  <rect x="122" y="288" width="330" height="26" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="138" y="306" font-size="12.5" fill="#7f1d1d">no viewed, no dwelled — for any of the four</text>
  <text x="468" y="306" font-size="12" fill="#78716c">the rest of the page counted normally, so the numbers looked like data</text>

  <text x="52" y="340" font-size="12" font-weight="650" fill="#15803d" letter-spacing="0.04em">NOW</text>
  <rect x="122" y="324" width="330" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="138" y="342" font-size="12.5" fill="#14532d">a MutationObserver hands each one over</text>
  <text x="468" y="342" font-size="12" fill="#78716c">built only when a time-based kind is asked for; the others never needed it</text>

  <!-- panel two: departure -->
  <rect x="32" y="376" width="856" height="164" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="404" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">A NODE THAT LEAVES WHILE IT IS STILL BEING COUNTED</text>

  <path d="M 52 432 L 846 432" stroke="#e7e5e4" stroke-width="1.4" fill="none"/>
  <circle cx="132" cy="432" r="4.5" fill="#57534e"/>
  <text x="132" y="422" font-size="11.5" text-anchor="middle" fill="#57534e">came on screen · 1.0s</text>
  <circle cx="392" cy="432" r="4.5" fill="#b91c1c"/>
  <text x="392" y="422" font-size="11.5" text-anchor="middle" fill="#b91c1c">removed from the page · 4.0s</text>
  <text x="700" y="422" font-size="11.5" text-anchor="middle" fill="#78716c">every later batch</text>

  <text x="52" y="470" font-size="12" font-weight="650" fill="#b91c1c" letter-spacing="0.04em">BEFORE</text>
  <rect x="122" y="454" width="330" height="26" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="138" y="472" font-size="12.5" fill="#7f1d1d">the stretch closes late, or never closes</text>
  <text x="468" y="472" font-size="12" fill="#78716c">a removed target need not be reported as leaving view</text>

  <text x="52" y="506" font-size="12" font-weight="650" fill="#15803d" letter-spacing="0.04em">NOW</text>
  <rect x="122" y="490" width="330" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="138" y="508" font-size="12.5" fill="#14532d">dwelled 3,000 ms, then nothing further</text>
  <text x="468" y="508" font-size="12" fill="#78716c">closed on the mutation, at the instant the node went</text>

  <!-- panel three: what is still read once -->
  <rect x="32" y="556" width="856" height="86" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="52" y="584" font-size="12" font-weight="650" fill="#92400e" letter-spacing="0.06em">STILL READ ONCE, AND NOW SAID OUT LOUD</text>
  <text x="52" y="610" font-size="13" fill="#78350f">The tree id and the revision are read off the root when the broadcast starts, and every batch is filed under them.</text>
  <text x="52" y="630" font-size="13" fill="#78350f">A new root — or a new revision in the same root — is a new broadcast. Filed as open: noticing that is a choice, not a detail.</text>
</svg>
