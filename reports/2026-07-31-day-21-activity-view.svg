<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="980" height="660" fill="#ffffff"/>

  <text x="32" y="40" font-size="20" fill="#1a1a1a">§6 gets a reader: the journal's newest page, folded into episodes</text>
  <text x="32" y="62" font-size="13" fill="#6e6e6e">Day 21 — the read path, and the paging change that made it one query instead of a scan</text>

  <!-- BEFORE -->
  <text x="32" y="104" font-size="13" fill="#a11b00" font-weight="600">before — forward only</text>
  <rect x="32" y="116" width="420" height="86" rx="4" fill="#fcfcfd" stroke="rgba(0,0,0,0.13)"/>
  <text x="46" y="138" font-size="11.5" fill="#4a4a4a" font-family="ui-monospace, monospace">read({ cursor })  →  { records, cursor }</text>

  <g font-family="ui-monospace, monospace" font-size="10" fill="#6e6e6e">
    <rect x="46" y="152" width="26" height="20" rx="2" fill="rgba(204,34,0,0.10)" stroke="#a11b00" stroke-width="0.7"/>
    <text x="53" y="166" fill="#a11b00">1</text>
    <rect x="78" y="152" width="26" height="20" rx="2" fill="#f4f5f7" stroke="rgba(0,0,0,0.13)"/><text x="85" y="166">2</text>
    <rect x="110" y="152" width="26" height="20" rx="2" fill="#f4f5f7" stroke="rgba(0,0,0,0.13)"/><text x="117" y="166">3</text>
    <text x="144" y="166" font-size="11">… every record ever written …</text>
    <rect x="300" y="152" width="52" height="20" rx="2" fill="#f4f5f7" stroke="rgba(0,0,0,0.13)"/><text x="307" y="166">n−1</text>
    <rect x="358" y="152" width="36" height="20" rx="2" fill="rgba(34,197,94,0.14)" stroke="#15803d" stroke-width="0.7"/><text x="367" y="166" fill="#15803d">n</text>
  </g>
  <text x="46" y="192" font-size="11" fill="#a11b00">"what happened recently" starts at record 1 and pages to the end</text>

  <!-- AFTER -->
  <text x="520" y="104" font-size="13" fill="#15803d" font-weight="600">after — a page is taken from an end (0025)</text>
  <rect x="520" y="116" width="428" height="86" rx="4" fill="#fcfcfd" stroke="rgba(0,0,0,0.13)"/>
  <text x="534" y="138" font-size="11.5" fill="#4a4a4a" font-family="ui-monospace, monospace">read({ direction: "older" })  →  { records, older, newer }</text>

  <g font-family="ui-monospace, monospace" font-size="10" fill="#6e6e6e">
    <rect x="534" y="152" width="26" height="20" rx="2" fill="#f4f5f7" stroke="rgba(0,0,0,0.13)"/><text x="541" y="166">1</text>
    <text x="568" y="166" font-size="11">…</text>
    <rect x="590" y="152" width="52" height="20" rx="2" fill="#f4f5f7" stroke="rgba(0,0,0,0.13)"/><text x="597" y="166">n−4</text>
    <rect x="648" y="152" width="52" height="20" rx="2" fill="rgba(34,197,94,0.14)" stroke="#15803d" stroke-width="0.7"/><text x="655" y="166" fill="#15803d">n−3</text>
    <rect x="706" y="152" width="52" height="20" rx="2" fill="rgba(34,197,94,0.14)" stroke="#15803d" stroke-width="0.7"/><text x="713" y="166" fill="#15803d">n−2</text>
    <rect x="764" y="152" width="52" height="20" rx="2" fill="rgba(34,197,94,0.14)" stroke="#15803d" stroke-width="0.7"/><text x="771" y="166" fill="#15803d">n−1</text>
    <rect x="822" y="152" width="36" height="20" rx="2" fill="rgba(34,197,94,0.14)" stroke="#15803d" stroke-width="0.7"/><text x="831" y="166" fill="#15803d">n</text>
  </g>
  <text x="534" y="192" font-size="11" fill="#15803d">one index seek — and the page still comes back ascending, so the fold is unchanged</text>

  <!-- pipeline -->
  <text x="32" y="252" font-size="13" fill="#1a1a1a" font-weight="600">the read path</text>

  <g>
    <rect x="32" y="268" width="150" height="62" rx="4" fill="#ffffff" stroke="rgba(0,0,0,0.36)"/>
    <text x="46" y="290" font-size="12" fill="#1a1a1a">loom_telemetry</text>
    <text x="46" y="307" font-size="10.5" fill="#6e6e6e">append-only rows</text>
    <text x="46" y="321" font-size="10.5" fill="#6e6e6e" font-family="ui-monospace, monospace">seq · tree_id · event</text>

    <path d="M182 299 h34" stroke="#5b6478" stroke-width="1.2" marker-end="url(#a)"/>

    <rect x="216" y="268" width="164" height="62" rx="4" fill="#ffffff" stroke="rgba(0,0,0,0.36)"/>
    <text x="230" y="290" font-size="12" fill="#1a1a1a">TelemetryJournal</text>
    <text x="230" y="307" font-size="10.5" fill="#6e6e6e" font-family="ui-monospace, monospace">read({direction})</text>
    <text x="230" y="321" font-size="10.5" fill="#6e6e6e">rows parsed, never cast</text>

    <path d="M380 299 h34" stroke="#5b6478" stroke-width="1.2" marker-end="url(#a)"/>

    <rect x="414" y="268" width="150" height="62" rx="4" fill="#ffffff" stroke="rgba(0,0,0,0.36)"/>
    <text x="428" y="290" font-size="12" fill="#1a1a1a">episodesOf</text>
    <text x="428" y="307" font-size="10.5" fill="#6e6e6e">pure fold, per intent</text>
    <text x="428" y="321" font-size="10.5" fill="#6e6e6e">reports what it can't attribute</text>

    <path d="M564 299 h34" stroke="#5b6478" stroke-width="1.2" marker-end="url(#a)"/>

    <rect x="598" y="268" width="140" height="62" rx="4" fill="#ffffff" stroke="rgba(0,0,0,0.36)"/>
    <text x="612" y="290" font-size="12" fill="#1a1a1a">tallyEpisodes</text>
    <text x="612" y="307" font-size="10.5" fill="#6e6e6e">counts, zero-filled</text>
    <text x="612" y="321" font-size="10.5" fill="#6e6e6e">absent ≠ zero</text>

    <path d="M738 299 h34" stroke="#5b6478" stroke-width="1.2" marker-end="url(#a)"/>

    <rect x="772" y="268" width="176" height="62" rx="4" fill="#f4f7fa" stroke="rgba(0,0,0,0.36)"/>
    <text x="786" y="290" font-size="12" fill="#1a1a1a">/activity</text>
    <text x="786" y="307" font-size="10.5" fill="#6e6e6e">a consumer, not an insider</text>
    <text x="786" y="321" font-size="10.5" fill="#6e6e6e">(0018)</text>
  </g>

  <!-- what an episode looks like -->
  <text x="32" y="382" font-size="13" fill="#1a1a1a" font-weight="600">one episode, as the page renders it</text>

  <rect x="32" y="396" width="916" height="112" rx="4" fill="#ffffff" stroke="rgba(0,0,0,0.13)"/>
  <rect x="46" y="410" width="196" height="20" rx="2" fill="rgba(251,146,60,0.15)"/>
  <text x="54" y="424" font-size="11" fill="#c2410c">waiting on you — held for a human</text>
  <text x="880" y="424" font-size="11" fill="#6e6e6e" font-family="ui-monospace, monospace" text-anchor="end">t_seed1</text>
  <text x="46" y="448" font-size="10.5" fill="#6e6e6e" font-family="ui-monospace, monospace">user-instruction · the whole tree · revision 1 · 31 characters</text>
  <line x1="46" y1="458" x2="46" y2="496" stroke="rgba(0,0,0,0.13)" stroke-width="2"/>
  <text x="60" y="470" font-size="11" fill="#1a1a1a">"Delete everything on this page" means the page keeps existing but is emptied…</text>
  <text x="60" y="488" font-size="10.5" fill="#6e6e6e" font-family="ui-monospace, monospace">changes delete, delete, delete, delete · confidence 0.82 · stakes high · reversible yes</text>

  <text x="32" y="536" font-size="12" fill="#4a4a4a">The delta is shown for every proposal, not only the applied ones. For a change that was refused or discarded the revision log holds nothing,</text>
  <text x="32" y="554" font-size="12" fill="#4a4a4a">so this is the only surviving account of what the model wanted to do — which is what 0023 kept it for.</text>

  <line x1="32" y1="580" x2="948" y2="580" stroke="rgba(0,0,0,0.13)"/>
  <text x="32" y="604" font-size="11.5" fill="#6e6e6e">0025 — a journal page is taken from an end, and names both of its ends</text>
  <text x="32" y="622" font-size="11.5" fill="#6e6e6e">runtime 62 files / 602 tests · portal 7 files / 42 tests · pnpm verify green, offline, no key</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6478"/>
    </marker>
  </defs>
</svg>
