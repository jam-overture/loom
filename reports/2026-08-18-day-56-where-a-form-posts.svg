<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="960" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="32" y="40" font-size="19" font-weight="600" fill="#111827" font-family="ui-sans-serif, system-ui, sans-serif">A submission names a destination, and never carries one</text>
  <text x="32" y="62" font-size="12.5" fill="#6b7280" font-family="ui-sans-serif, system-ui, sans-serif">0065 — day 56 — §4g → §3, §4b. The one prop that decides where a stranger's data goes, kept out of the tree.</text>

  <!-- ================= the two ways a form could get an action ================= -->
  <text x="32" y="102" font-size="12" font-weight="600" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif">HOW A FORM COULD GET AN ACTION</text>

  <rect x="32" y="116" width="440" height="146" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="44" y="138" font-size="11.5" fill="#991b1b">refused — an address in a prop</text>
  <text x="44" y="160" font-size="10.5" fill="#b91c1c">props: { action: "https://collect.example.com/harvest" }</text>
  <text x="44" y="184" font-size="9.5" fill="#6b7280">a prop is AI-authored by definition, and 0053's scheme</text>
  <text x="44" y="198" font-size="9.5" fill="#6b7280">allowlist does not help — that URL passes it</text>
  <text x="44" y="220" font-size="9.5" fill="#6b7280">an href a visitor did not click costs nothing; a form action</text>
  <text x="44" y="234" font-size="9.5" fill="#6b7280">is where their name, address and message are sent</text>
  <text x="44" y="252" font-size="9.5" fill="#9ca3af">…and it would ride in every delta, revision and diff</text>

  <rect x="496" y="116" width="432" height="146" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="508" y="138" font-size="11.5" fill="#166534">chosen — a name the deployment registered</text>
  <text x="508" y="160" font-size="10.5" fill="#059669">"loom:submit": { "to": "contact.enquiry" }</text>
  <text x="508" y="184" font-size="9.5" fill="#6b7280">one id, from a registry the host built — the whole</text>
  <text x="508" y="198" font-size="9.5" fill="#6b7280">AI-authored surface. No params, deliberately:</text>
  <text x="508" y="212" font-size="9.5" fill="#6b7280">two mailing lists are two registrations, not a param</text>
  <text x="508" y="236" font-size="9.5" fill="#059669">the tree says which form. The host says where it goes.</text>
  <text x="508" y="252" font-size="9.5" fill="#9ca3af">registers nothing → no form posts anywhere. Fails closed.</text>

  <!-- ================= the three steps ================= -->
  <text x="32" y="302" font-size="12" font-weight="600" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif">WHERE THE ADDRESS IS RESOLVED — BEFORE THE WALK, BESIDE THE DATA SEAM</text>

  <rect x="32" y="316" width="212" height="104" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="44" y="338" font-size="11" fill="#111827">planTreeSubmissions</text>
  <text x="44" y="358" font-size="9.5" fill="#6b7280">pure pass over the tree</text>
  <text x="44" y="374" font-size="9.5" fill="#6b7280">reads every `loom:submit`</text>
  <text x="44" y="390" font-size="9.5" fill="#6b7280">dedupes: one endpoint, one ask</text>
  <text x="44" y="410" font-size="9.5" fill="#2563eb">no IO</text>

  <line x1="248" y1="368" x2="284" y2="368" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="288" y="316" width="212" height="104" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="300" y="338" font-size="11" fill="#111827">resolveSubmissionPlan</text>
  <text x="300" y="358" font-size="9.5" fill="#6b7280">asks every endpoint at once</text>
  <text x="300" y="374" font-size="9.5" fill="#6b7280">catches a throw, a refusal,</text>
  <text x="300" y="390" font-size="9.5" fill="#6b7280">a target the seam refuses</text>
  <text x="300" y="410" font-size="9.5" fill="#b45309">the step that may do IO</text>

  <line x1="504" y1="368" x2="540" y2="368" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="544" y="316" width="212" height="104" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="556" y="338" font-size="11" fill="#111827">renderLoomTree</text>
  <text x="556" y="358" font-size="9.5" fill="#6b7280">a map read per node</text>
  <text x="556" y="374" font-size="9.5" fill="#6b7280">nothing parses, asks or waits</text>
  <text x="556" y="390" font-size="9.5" fill="#6b7280">still a pure projection (0008)</text>
  <text x="556" y="410" font-size="9.5" fill="#2563eb">no IO</text>

  <rect x="784" y="316" width="144" height="104" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="796" y="338" font-size="11" fill="#1e40af">renderRequest</text>
  <text x="796" y="358" font-size="9.5" fill="#6b7280">resolves data and</text>
  <text x="796" y="374" font-size="9.5" fill="#6b7280">submissions together,</text>
  <text x="796" y="390" font-size="9.5" fill="#6b7280">not one after the other</text>
  <text x="796" y="410" font-size="9.5" fill="#2563eb">Promise.all</text>

  <!-- ================= the three states ================= -->
  <text x="32" y="462" font-size="12" font-weight="600" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif">WHAT THE PRIMITIVE READS — THREE STATES, BECAUSE EACH IS A DIFFERENT PAGE</text>

  <rect x="32" y="476" width="290" height="128" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="44" y="498" font-size="10.5" fill="#111827">loom.submit === undefined</text>
  <text x="44" y="520" font-size="11" fill="#6b7280">the tree never said where this posts</text>
  <text x="44" y="540" font-size="9.5" fill="#6b7280">an authoring gap — the form renders,</text>
  <text x="44" y="554" font-size="9.5" fill="#6b7280">and nothing pretends it can be sent</text>
  <text x="44" y="580" font-size="9.5" fill="#9ca3af">also what every node that declares</text>
  <text x="44" y="594" font-size="9.5" fill="#9ca3af">nothing gets — which is nearly all of them</text>

  <rect x="338" y="476" width="290" height="128" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="350" y="498" font-size="10.5" fill="#92400e">status: "unavailable"</text>
  <text x="350" y="520" font-size="11" fill="#6b7280">the deployment could not answer now</text>
  <text x="350" y="540" font-size="9.5" fill="#b45309">no-such-endpoint · invalid-target</text>
  <text x="350" y="554" font-size="9.5" fill="#b45309">endpoint-threw · unavailable · refused</text>
  <text x="350" y="580" font-size="9.5" fill="#6b7280">one endpoint's bad afternoon costs its</text>
  <text x="350" y="594" font-size="9.5" fill="#6b7280">own form, never the page</text>

  <rect x="644" y="476" width="284" height="128" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="656" y="498" font-size="10.5" fill="#166534">status: "ready"</text>
  <text x="656" y="520" font-size="11" fill="#6b7280">where it goes, and what it carries</text>
  <text x="656" y="542" font-size="9.5" fill="#059669">action  /api/contact</text>
  <text x="656" y="558" font-size="9.5" fill="#059669">method  post</text>
  <text x="656" y="574" font-size="9.5" fill="#059669">fields  [{ name: "csrf", … }]</text>
  <text x="656" y="596" font-size="9.5" fill="#9ca3af">all host-authored; none of it in the tree</text>

  <!-- ================= footer ================= -->
  <rect x="32" y="628" width="896" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="44" y="650" font-size="10" fill="#374151">There is deliberately no fourth state — no way to say "no target, and that is fine". A submit button that silently goes nowhere</text>
  <text x="44" y="666" font-size="10" fill="#374151">is the failure this shape exists to prevent, and it is the one a screenshot cannot catch.</text>
  <text x="44" y="682" font-size="9.5" fill="#9ca3af">Closes the form-target half of "three Hermes blocks are blocked on seams, not on primitives" — filed by `Loom primitives`, 17 August. The `tabs` half stays open.</text>
</svg>
