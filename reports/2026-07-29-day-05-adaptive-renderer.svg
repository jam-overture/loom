<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6feb"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="980" height="700" fill="#ffffff"/>

  <text x="40" y="42" font-size="21" font-weight="600" fill="#1b1f24">§3 — The tree, projected into React</text>
  <text x="40" y="66" font-size="13.5" fill="#6a737d">Pure, total, per request. Node ids become React keys. Nothing is wrapped, and nothing is spread.</text>

  <!-- ============ PANEL A: the tree ============ -->
  <rect x="40" y="92" width="330" height="322" rx="8" fill="#fbfcfd" stroke="#d6dbe1"/>
  <text x="58" y="118" font-size="12.5" font-weight="600" fill="#1b1f24">LoomTree · t_1 · revision 0</text>
  <line x1="40" y1="130" x2="370" y2="130" stroke="#e4e8ec"/>

  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="56" y="144" width="252" height="26" rx="4" fill="#eaf1fe" stroke="#b6cdf8"/>
    <text x="66" y="161.5" fill="#1b1f24">element  loom.page</text>
    <text x="318" y="161.5" fill="#8b949e" font-size="11">n_7</text>

    <rect x="80" y="182" width="228" height="26" rx="4" fill="#eaf1fe" stroke="#b6cdf8"/>
    <text x="90" y="199.5" fill="#1b1f24">element  loom.header</text>
    <text x="318" y="199.5" fill="#8b949e" font-size="11">n_2</text>

    <rect x="104" y="220" width="204" height="26" rx="4" fill="#f4f5f7" stroke="#dcdfe4"/>
    <text x="114" y="237.5" fill="#3d444d">text  "Welcome"</text>
    <text x="318" y="237.5" fill="#8b949e" font-size="11">n_1</text>

    <rect x="80" y="258" width="228" height="26" rx="4" fill="#fff5e0" stroke="#f0d38a"/>
    <text x="90" y="275.5" fill="#1b1f24">slot  main</text>
    <text x="318" y="275.5" fill="#8b949e" font-size="11">n_5</text>

    <rect x="104" y="296" width="204" height="26" rx="4" fill="#eaf1fe" stroke="#b6cdf8"/>
    <text x="114" y="313.5" fill="#1b1f24">element  loom.card</text>
    <text x="318" y="313.5" fill="#8b949e" font-size="11">n_4</text>

    <rect x="128" y="334" width="180" height="26" rx="4" fill="#f4f5f7" stroke="#dcdfe4"/>
    <text x="138" y="351.5" fill="#3d444d">text  "Body copy"</text>
    <text x="318" y="351.5" fill="#8b949e" font-size="11">n_3</text>

    <rect x="80" y="372" width="228" height="26" rx="4" fill="#eaf1fe" stroke="#b6cdf8"/>
    <text x="90" y="389.5" fill="#1b1f24">element  loom.footer</text>
    <text x="318" y="389.5" fill="#8b949e" font-size="11">n_6</text>
  </g>

  <!-- ============ MIDDLE: the three mapping rules ============ -->
  <line x1="374" y1="195" x2="606" y2="195" stroke="#2f6feb" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="490" y="188" font-size="11.5" fill="#2f6feb" text-anchor="middle">resolver.resolve(type)</text>
  <text x="490" y="211" font-size="11" fill="#6a737d" text-anchor="middle">key = node id</text>

  <line x1="374" y1="271" x2="606" y2="271" stroke="#2f6feb" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="490" y="264" font-size="11.5" fill="#2f6feb" text-anchor="middle">projected ?? fallback</text>
  <text x="490" y="287" font-size="11" fill="#6a737d" text-anchor="middle">a fragment, never a box</text>

  <line x1="374" y1="347" x2="606" y2="347" stroke="#2f6feb" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="490" y="340" font-size="11.5" fill="#2f6feb" text-anchor="middle">the string itself</text>
  <text x="490" y="363" font-size="11" fill="#6a737d" text-anchor="middle">no element invented</text>

  <!-- ============ PANEL B: React output ============ -->
  <rect x="610" y="92" width="330" height="322" rx="8" fill="#fbfcfd" stroke="#d6dbe1"/>
  <text x="628" y="118" font-size="12.5" font-weight="600" fill="#1b1f24">React elements → markup</text>
  <line x1="610" y1="130" x2="940" y2="130" stroke="#e4e8ec"/>

  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="626" y="161.5" fill="#1a7f37">&lt;main&gt;</text>
    <text x="650" y="199.5" fill="#1a7f37">&lt;header&gt;</text>
    <text x="674" y="237.5" fill="#3d444d">Welcome</text>
    <text x="650" y="275.5" fill="#9a6700">— fragment —</text>
    <text x="674" y="313.5" fill="#1a7f37">&lt;article&gt;</text>
    <text x="698" y="351.5" fill="#3d444d">Body copy</text>
    <text x="650" y="389.5" fill="#1a7f37">&lt;footer&gt;</text>
  </g>

  <!-- ============ BOTTOM LEFT: what a primitive receives ============ -->
  <rect x="40" y="440" width="440" height="236" rx="8" fill="#fbfcfd" stroke="#d6dbe1"/>
  <text x="58" y="466" font-size="12.5" font-weight="600" fill="#1b1f24">What a primitive receives — three props, and only three</text>
  <line x1="40" y1="478" x2="480" y2="478" stroke="#e4e8ec"/>

  <g font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="58" y="502" fill="#3d444d">{</text>
    <text x="74" y="522" fill="#2f6feb">loom</text><text x="112" y="522" fill="#3d444d">:     { nodeId, type, editable? }</text>
    <text x="74" y="542" fill="#2f6feb">props</text><text x="120" y="542" fill="#3d444d">:    { title: "Home" }</text>
    <text x="74" y="562" fill="#2f6feb">children</text><text x="146" y="562" fill="#3d444d">: ReactNode | null</text>
    <text x="58" y="582" fill="#3d444d">}</text>
  </g>

  <line x1="58" y1="598" x2="462" y2="598" stroke="#e4e8ec"/>
  <text x="58" y="618" font-size="11.5" fill="#6a737d">AI-authored props stay in the bag. Nothing is spread, so</text>
  <text x="58" y="636" font-size="11.5" fill="#6a737d">dangerouslySetInnerHTML in a tree reaches the bag and</text>
  <text x="58" y="654" font-size="11.5" fill="#6a737d">stops there. §4 validates the bag against a declared schema.</text>

  <!-- ============ BOTTOM RIGHT: edit mode ============ -->
  <rect x="500" y="440" width="440" height="236" rx="8" fill="#fbfcfd" stroke="#d6dbe1"/>
  <text x="518" y="466" font-size="12.5" font-weight="600" fill="#1b1f24">Edit mode decorates; it never invents DOM</text>
  <line x1="500" y1="478" x2="940" y2="478" stroke="#e4e8ec"/>

  <text x="518" y="500" font-size="11.5" fill="#6a737d">off — the whole cost is one boolean per element</text>
  <rect x="518" y="508" width="404" height="28" rx="4" fill="#f4f5f7" stroke="#dcdfe4"/>
  <text x="530" y="527" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3d444d">&lt;main&gt;…&lt;article&gt;Body copy&lt;/article&gt;…&lt;/main&gt;</text>

  <text x="518" y="560" font-size="11.5" fill="#6a737d">on — same elements, same count, extra attributes</text>
  <rect x="518" y="568" width="404" height="46" rx="4" fill="#eaf1fe" stroke="#b6cdf8"/>
  <text x="530" y="585" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1b1f24">&lt;main data-loom-node="n_7" data-loom-type="loom.page"</text>
  <text x="530" y="602" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1b1f24">      data-loom-tree="t_1" data-loom-revision="0"&gt;</text>

  <line x1="518" y1="628" x2="922" y2="628" stroke="#e4e8ec"/>
  <text x="518" y="646" font-size="11.5" fill="#6a737d">The root pair is exactly the base an EditIntent needs, so a stale</text>
  <text x="518" y="664" font-size="11.5" fill="#6a737d">render names the stale revision instead of claiming the current one.</text>

  <!-- unknown primitive note -->
  <line x1="374" y1="130" x2="606" y2="130" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <text x="490" y="124" font-size="11" fill="#6a737d" text-anchor="middle">unknown type → subtree omitted,</text>
  <text x="490" y="146" font-size="11" fill="#6a737d" text-anchor="middle">one diagnostic, page still renders</text>
</svg>
