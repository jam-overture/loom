<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="940" height="620" fill="#fbfaf8"/>

  <text x="32" y="38" font-size="19" font-weight="650" fill="#1c1917">One press, before and after</text>
  <text x="32" y="60" font-size="13.5" fill="#57534e">A real broadcaster on a real DOM: a <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">loom.action</tspan> inside a card, inside a section, inside the page. Both</text>
  <text x="32" y="78" font-size="13.5" fill="#57534e">columns are the delivery this checkout actually produced, and the tallies <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">rollUp</tspan> made of it.</text>

  <!-- the page -->
  <rect x="32" y="100" width="286" height="196" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="128" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">THE PAGE</text>

  <rect x="52" y="142" width="246" height="136" rx="8" fill="#f7f6f4" stroke="#e7e5e4"/>
  <text x="64" y="161" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#78716c">n_1 loom.page</text>
  <rect x="68" y="170" width="214" height="98" rx="7" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="80" y="189" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#78716c">n_2 loom.section</text>
  <rect x="84" y="198" width="182" height="62" rx="6" fill="#f7f6f4" stroke="#e7e5e4"/>
  <text x="96" y="217" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#78716c">n_3 loom.card</text>
  <rect x="100" y="226" width="150" height="26" rx="5" fill="#1c1917"/>
  <text x="175" y="243" font-size="11.5" text-anchor="middle" fill="#fafaf9">n_4 — pressed</text>

  <!-- before -->
  <rect x="338" y="100" width="286" height="440" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="358" y="128" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">ON MAIN</text>

  <rect x="358" y="142" width="246" height="74" rx="7" fill="#f7f6f4" stroke="#e7e5e4"/>
  <text x="370" y="163" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">{ kind: "activated",</text>
  <text x="370" y="179" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">  nodeId: "n_4",</text>
  <text x="370" y="195" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">  type: "loom.action" }</text>
  <text x="370" y="211" font-size="11" fill="#a8a29e">— and nothing else</text>

  <text x="358" y="246" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">THE TALLIES IT ROLLED UP TO</text>
  <rect x="358" y="258" width="246" height="34" rx="6" fill="#f7f6f4" stroke="#e7e5e4"/>
  <text x="370" y="279" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">n_4   activations 1</text>
  <text x="370" y="316" font-size="12.5" fill="#57534e">One row. The card, the section and</text>
  <text x="370" y="334" font-size="12.5" fill="#57534e">the page are not in the output at all.</text>

  <rect x="358" y="356" width="246" height="164" rx="7" fill="#fdf6f6" stroke="#e8cfcf"/>
  <text x="374" y="378" font-size="12.5" font-weight="650" fill="#9f1239">Which band was it in?</text>
  <text x="374" y="399" font-size="11.5" fill="#78716c">Unanswerable, and not later either —</text>
  <text x="374" y="416" font-size="11.5" fill="#78716c">where a node sat is a fact about the</text>
  <text x="374" y="433" font-size="11.5" fill="#78716c">page at the moment of the press, and</text>
  <text x="374" y="450" font-size="11.5" fill="#78716c">a proposal may have moved it since.</text>
  <text x="374" y="475" font-size="11.5" fill="#78716c">Asking for activations on band types</text>
  <text x="374" y="492" font-size="11.5" fill="#78716c">returns none, not band-level ones:</text>
  <text x="374" y="509" font-size="11.5" fill="#78716c">the nearest node fails the filter.</text>

  <!-- after -->
  <rect x="644" y="100" width="264" height="440" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="664" y="128" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">ON THIS BRANCH</text>

  <rect x="664" y="142" width="224" height="140" rx="7" fill="#f6f8f5" stroke="#d6e3d2"/>
  <text x="676" y="163" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">{ kind: "activated",</text>
  <text x="676" y="179" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">  nodeId: "n_4",</text>
  <text x="676" y="195" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">  type: "loom.action",</text>
  <text x="676" y="211" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">  within: [ n_3 card,</text>
  <text x="676" y="227" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">            n_2 section,</text>
  <text x="676" y="243" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">            n_1 page ] }</text>
  <text x="676" y="266" font-size="11" fill="#a8a29e">nearest first, up to the root</text>

  <text x="664" y="304" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">THE TALLIES IT ROLLED UP TO</text>
  <rect x="664" y="316" width="224" height="34" rx="6" fill="#f7f6f4" stroke="#e7e5e4"/>
  <text x="676" y="337" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">n_4   activations 1</text>
  <rect x="664" y="354" width="224" height="34" rx="6" fill="#f6f8f5" stroke="#d6e3d2"/>
  <text x="676" y="375" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">n_3   engaged 1</text>
  <rect x="664" y="392" width="224" height="34" rx="6" fill="#f6f8f5" stroke="#d6e3d2"/>
  <text x="676" y="413" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">n_2   engaged 1</text>
  <rect x="664" y="430" width="224" height="34" rx="6" fill="#f6f8f5" stroke="#d6e3d2"/>
  <text x="676" y="451" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">n_1   engaged 1</text>

  <text x="664" y="486" font-size="12.5" fill="#57534e">The control keeps the press. The three</text>
  <text x="664" y="504" font-size="12.5" fill="#57534e">regions get one engaged view each,</text>
  <text x="664" y="522" font-size="12.5" fill="#57534e">and none of them gets an activation.</text>

  <text x="32" y="572" font-size="12.5" fill="#78716c">Distinct views, not presses: the same reader pressing four things in one band is one engaged view, which is why the</text>
  <text x="32" y="592" font-size="12.5" fill="#78716c">sentence “five readers used something in it” can be taken from it. Four presses is <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">engagements</tspan>, on the live fold.</text>
</svg>
