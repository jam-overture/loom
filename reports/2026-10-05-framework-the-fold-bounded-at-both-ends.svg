<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="520" fill="#0f1115"/>

  <text x="32" y="44" fill="#e6e9ef" font-size="17">What the tree as it was costs to read</text>
  <text x="32" y="68" fill="#8b93a7" font-size="12.5">Pages of a 250-entry log, default revision limit 100. Memory store; both columns measured on this branch and on main.</text>

  <line x1="32" y1="88" x2="868" y2="88" stroke="#242938"/>

  <text x="32" y="118" fill="#c9cede" font-size="13">pages read</text>
  <text x="32" y="300" fill="#6f7789" font-size="11.5">revision asked for</text>

  <line x1="148" y1="282" x2="868" y2="282" stroke="#242938"/>
  <line x1="148" y1="132" x2="868" y2="132" stroke="#1b2030"/>
  <text x="128" y="137" fill="#4e556a" font-size="11" text-anchor="end">3</text>
  <line x1="148" y1="182" x2="868" y2="182" stroke="#1b2030"/>
  <text x="128" y="187" fill="#4e556a" font-size="11" text-anchor="end">2</text>
  <line x1="148" y1="232" x2="868" y2="232" stroke="#1b2030"/>
  <text x="128" y="237" fill="#4e556a" font-size="11" text-anchor="end">1</text>

  <!-- group 0: revision 0 -->
  <rect x="160" y="132" width="26" height="150" fill="#6f7789"/>
  <rect x="192" y="279" width="26" height="3" fill="#30a46c"/>
  <text x="189" y="268" fill="#30a46c" font-size="11.5" text-anchor="middle">0</text>
  <text x="189" y="302" fill="#8b93a7" font-size="12" text-anchor="middle">0</text>

  <!-- group 1: revision 1 -->
  <rect x="248" y="132" width="26" height="150" fill="#6f7789"/>
  <rect x="280" y="232" width="26" height="50" fill="#30a46c"/>
  <text x="277" y="302" fill="#8b93a7" font-size="12" text-anchor="middle">1</text>

  <!-- group 2: revision 50 -->
  <rect x="336" y="132" width="26" height="150" fill="#6f7789"/>
  <rect x="368" y="232" width="26" height="50" fill="#30a46c"/>
  <text x="365" y="302" fill="#8b93a7" font-size="12" text-anchor="middle">50</text>

  <!-- group 3: revision 100 -->
  <rect x="424" y="132" width="26" height="150" fill="#6f7789"/>
  <rect x="456" y="232" width="26" height="50" fill="#30a46c"/>
  <text x="453" y="302" fill="#8b93a7" font-size="12" text-anchor="middle">100</text>

  <!-- group 4: revision 101 -->
  <rect x="512" y="132" width="26" height="150" fill="#6f7789"/>
  <rect x="544" y="182" width="26" height="100" fill="#30a46c"/>
  <text x="541" y="302" fill="#8b93a7" font-size="12" text-anchor="middle">101</text>

  <!-- group 5: revision 125 -->
  <rect x="600" y="132" width="26" height="150" fill="#6f7789"/>
  <rect x="632" y="182" width="26" height="100" fill="#30a46c"/>
  <text x="629" y="302" fill="#8b93a7" font-size="12" text-anchor="middle">125</text>

  <!-- group 6: revision 200 -->
  <rect x="688" y="132" width="26" height="150" fill="#6f7789"/>
  <rect x="720" y="182" width="26" height="100" fill="#30a46c"/>
  <text x="717" y="302" fill="#8b93a7" font-size="12" text-anchor="middle">200</text>

  <!-- group 7: revision 250, the head -->
  <rect x="776" y="132" width="26" height="150" fill="#6f7789"/>
  <rect x="808" y="132" width="26" height="150" fill="#30a46c"/>
  <text x="805" y="302" fill="#8b93a7" font-size="12" text-anchor="middle">250</text>
  <text x="805" y="318" fill="#4e556a" font-size="10.5" text-anchor="middle">the head</text>

  <rect x="160" y="336" width="11" height="11" fill="#6f7789"/>
  <text x="178" y="346" fill="#8b93a7" font-size="12">fold to the end of the log — what a consumer writes for itself today</text>
  <rect x="604" y="336" width="11" height="11" fill="#30a46c"/>
  <text x="622" y="346" fill="#8b93a7" font-size="12">treeAt, stopped where asked</text>

  <line x1="32" y1="372" x2="868" y2="372" stroke="#242938"/>

  <text x="32" y="400" fill="#e6e9ef" font-size="13.5">Two more numbers, and the second one is a defect rather than a saving.</text>

  <text x="48" y="430" fill="#c9cede" font-size="12.5">two revisions (120 and 250), as a before-and-after reading asks for them</text>
  <text x="652" y="430" fill="#6f7789" font-size="12.5">6 pages, two walks</text>
  <text x="782" y="430" fill="#30a46c" font-size="12.5">→ 3, one walk</text>

  <text x="48" y="458" fill="#c9cede" font-size="12.5">auditSnapshot from a checkpoint seed at revision 200, which 0028 permits</text>
  <text x="652" y="458" fill="#e5484d" font-size="12.5">unreplayable</text>
  <text x="782" y="458" fill="#30a46c" font-size="12.5">→ agrees</text>

  <text x="32" y="494" fill="#8b93a7" font-size="12">It read one page, met revision 1, and called a log that was never gapped gapped: <tspan fill="#c9cede">expected 201, found 1</tspan>.</text>
</svg>
