<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 650; fill: #0f172a; }
    .sub { font-size: 13px; fill: #64748b; }
    .panel-title { font-size: 12px; font-weight: 650; fill: #475569; letter-spacing: 0.09em; }
    .axis { font-size: 11.5px; fill: #94a3b8; }
    .axis-name { font-size: 11.5px; fill: #64748b; font-weight: 600; }
    .val { font-size: 11px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .wall { font-size: 11px; font-weight: 650; fill: #b91c1c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .legend { font-size: 12px; fill: #475569; }
    .note { font-size: 12px; fill: #475569; }
  </style>
  <rect width="1080" height="640" fill="#ffffff"/>
  <text x="72" y="48" class="title">A tree&#8217;s shape no longer bounds an edit of it</text>
  <text x="72" y="72" class="sub">replaceNode, measured with tsx on one container, default stack, one run per size. Recursive search against a descent by the path.</text>
  <rect x="72" y="92" width="13" height="13" rx="2.5" fill="#94a3b8"/>
  <text x="92" y="103" class="legend">recursive, containsNode per level, siblings accumulated with a spread (before)</text>
  <rect x="620" y="92" width="13" height="13" rx="2.5" fill="#7c3aed"/>
  <text x="640" y="103" class="legend">descends by nodePath, one pass per sibling list (after)</text>
  <text x="72" y="140" class="panel-title">BY SIBLINGS &#8212; THE DIMENSION A PAGE REACHES</text>
  <line x1="72.0" y1="450.4" x2="500.0" y2="450.4" stroke="#e2e8f0" stroke-width="1"/>
  <text x="62.0" y="454.4" class="axis" text-anchor="end">1 ms</text>
  <line x1="72.0" y1="385.2" x2="500.0" y2="385.2" stroke="#e2e8f0" stroke-width="1"/>
  <text x="62.0" y="389.2" class="axis" text-anchor="end">10 ms</text>
  <line x1="72.0" y1="320.0" x2="500.0" y2="320.0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="62.0" y="324.0" class="axis" text-anchor="end">100 ms</text>
  <line x1="72.0" y1="254.8" x2="500.0" y2="254.8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="62.0" y="258.8" class="axis" text-anchor="end">1 s</text>
  <line x1="72.0" y1="189.6" x2="500.0" y2="189.6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="62.0" y="193.6" class="axis" text-anchor="end">10 s</text>
  <rect x="104.3" y="337.4" width="34" height="132.6" rx="2" fill="#94a3b8"/>
  <text x="121.3" y="330.4" class="val" text-anchor="middle">54.1 ms</text>
  <rect x="148.3" y="447.7" width="34" height="22.3" rx="2" fill="#7c3aed"/>
  <text x="165.3" y="440.7" class="val" text-anchor="middle">1.1 ms</text>
  <text x="143.3" y="490.0" class="axis" text-anchor="middle">6,000 siblings</text>
  <rect x="247.0" y="176.8" width="34" height="293.2" rx="2" fill="#94a3b8"/>
  <text x="264.0" y="169.8" class="val" text-anchor="middle">15.7 s</text>
  <rect x="291.0" y="381.5" width="34" height="88.5" rx="2" fill="#7c3aed"/>
  <text x="308.0" y="374.5" class="val" text-anchor="middle">11.4 ms</text>
  <text x="286.0" y="490.0" class="axis" text-anchor="middle">60,000 siblings</text>
  <text x="406.7" y="440.0" class="wall" text-anchor="middle">not</text>
  <text x="406.7" y="454.0" class="wall" text-anchor="middle">measured</text>
  <rect x="433.7" y="313.7" width="34" height="156.3" rx="2" fill="#7c3aed"/>
  <text x="450.7" y="306.7" class="val" text-anchor="middle">124.8 ms</text>
  <text x="428.7" y="490.0" class="axis" text-anchor="middle">600,000 siblings</text>
  <line x1="72.0" y1="470.0" x2="500.0" y2="470.0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="72.0" y="518.0" class="axis-name">siblings of the edited node, milliseconds on a log scale</text>
  <text x="72.0" y="548.0" class="note">Fifteen and a half seconds to change one node of a 60,000-node</text>
  <text x="72.0" y="566.0" class="note">page. Rule 4 is written against 6,000, where it cost 54 ms.</text>
  <text x="72.0" y="584.0" class="note">600,000 before would be tens of minutes at that rate.</text>
  <text x="592" y="140" class="panel-title">BY DEPTH &#8212; THE DIMENSION NO PAGE REACHES</text>
  <line x1="592.0" y1="450.4" x2="1008.0" y2="450.4" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="592.0" y1="385.2" x2="1008.0" y2="385.2" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="592.0" y1="320.0" x2="1008.0" y2="320.0" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="592.0" y1="254.8" x2="1008.0" y2="254.8" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="592.0" y1="189.6" x2="1008.0" y2="189.6" stroke="#e2e8f0" stroke-width="1"/>
  <polyline points="592.0,358.8 633.7,343.4" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="592.0" cy="358.8" r="4" fill="#94a3b8"/>
  <circle cx="633.7" cy="343.4" r="4" fill="#94a3b8"/>
  <line x1="675.5" y1="158.0" x2="675.5" y2="470.0" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="682.5" y="168.0" class="wall">RangeError from here, before</text>
  <polyline points="592.0,418.3 633.7,430.8 675.5,404.3 717.2,408.4 772.4,393.3 911.1,341.5 1008.0,303.0" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="592.0" cy="418.3" r="4" fill="#7c3aed"/>
  <circle cx="633.7" cy="430.8" r="4" fill="#7c3aed"/>
  <circle cx="675.5" cy="404.3" r="4" fill="#7c3aed"/>
  <circle cx="717.2" cy="408.4" r="4" fill="#7c3aed"/>
  <circle cx="772.4" cy="393.3" r="4" fill="#7c3aed"/>
  <circle cx="911.1" cy="341.5" r="4" fill="#7c3aed"/>
  <circle cx="1008.0" cy="303.0" r="4" fill="#7c3aed"/>
  <text x="586.0" y="346.8" class="val">25.4 ms</text>
  <text x="1000.0" y="293.0" class="val" text-anchor="end">182.0 ms</text>
  <text x="590.0" y="436.3" class="val">3.1 ms</text>
  <text x="592.0" y="490.0" class="axis" text-anchor="middle">500</text>
  <text x="675.5" y="490.0" class="axis" text-anchor="middle">2k</text>
  <text x="772.4" y="490.0" class="axis" text-anchor="middle">10k</text>
  <text x="911.1" y="490.0" class="axis" text-anchor="middle">100k</text>
  <text x="1008.0" y="490.0" class="axis" text-anchor="middle">500k</text>
  <line x1="592.0" y1="470.0" x2="1008.0" y2="470.0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="592.0" y="518.0" class="axis-name">depth of the chain, log scale; same milliseconds axis</text>
  <text x="592.0" y="548.0" class="note">Half a million deep is edited in 182 ms. An insert beside that</text>
  <text x="592.0" y="566.0" class="note">node takes 251 ms and a detach 240 ms, where both threw at 2,000.</text>
  <text x="592.0" y="584.0" class="note">The bound is the heap, as it is for every read since 0372.</text>
</svg>
