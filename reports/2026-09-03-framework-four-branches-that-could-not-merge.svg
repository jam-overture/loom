<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="600" fill="#ffffff"/>

  <text x="40" y="46" font-size="21" font-weight="650" fill="#15120e">Four branches off one trunk, and none of them could stand beside another</text>
  <text x="40" y="70" font-size="13.5" fill="#5c5751">Measured, not predicted — the merges were run. Every conflict is in a file nobody disagreed about.</text>

  <!-- ================= BEFORE ================= -->
  <text x="40" y="120" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">BEFORE — FOUR OPEN PULL REQUESTS FROM ONE LANE</text>

  <rect x="40" y="134" width="400" height="268" rx="10" fill="#faf8f5" stroke="#e4ded5"/>

  <circle cx="240" cy="164" r="5" fill="#15120e"/>
  <text x="256" y="169" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15120e">main d7375ef</text>

  <path d="M240 170 L100 208 M240 170 L193 208 M240 170 L287 208 M240 170 L380 208" stroke="#c9c0b4" stroke-width="1.2" fill="none"/>

  <circle cx="100" cy="214" r="4.5" fill="#7a6f62"/>
  <circle cx="193" cy="214" r="4.5" fill="#7a6f62"/>
  <circle cx="287" cy="214" r="4.5" fill="#7a6f62"/>
  <circle cx="380" cy="214" r="4.5" fill="#7a6f62"/>

  <text x="100" y="238" font-size="12" font-weight="650" fill="#15120e" text-anchor="middle">#221</text>
  <text x="193" y="238" font-size="12" font-weight="650" fill="#15120e" text-anchor="middle">#223</text>
  <text x="287" y="238" font-size="12" font-weight="650" fill="#15120e" text-anchor="middle">#228</text>
  <text x="380" y="238" font-size="12" font-weight="650" fill="#15120e" text-anchor="middle">#230</text>

  <text x="100" y="256" font-size="10.5" fill="#7a6f62" text-anchor="middle">a handle on</text>
  <text x="100" y="269" font-size="10.5" fill="#7a6f62" text-anchor="middle">the control</text>
  <text x="193" y="256" font-size="10.5" fill="#7a6f62" text-anchor="middle">fixtures a host</text>
  <text x="193" y="269" font-size="10.5" fill="#7a6f62" text-anchor="middle">can import</text>
  <text x="287" y="256" font-size="10.5" fill="#7a6f62" text-anchor="middle">a page where</text>
  <text x="287" y="269" font-size="10.5" fill="#7a6f62" text-anchor="middle">there is no CSS</text>
  <text x="380" y="256" font-size="10.5" fill="#7a6f62" text-anchor="middle">where the</text>
  <text x="380" y="269" font-size="10.5" fill="#7a6f62" text-anchor="middle">face is</text>

  <line x1="60" y1="292" x2="420" y2="292" stroke="#e4ded5"/>

  <text x="60" y="316" font-size="12" font-weight="650" fill="#b4442e">3 of 4 conflict on merge</text>
  <text x="60" y="338" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7a6f62">FINDINGS.md</text>
  <text x="248" y="338" font-size="11.5" fill="#5c5751">append-only — both sides wanted</text>
  <text x="60" y="358" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7a6f62">decisions/README.md</text>
  <text x="248" y="358" font-size="11.5" fill="#5c5751">generated by a script</text>
  <text x="60" y="378" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7a6f62">reference.generated.json</text>
  <text x="248" y="378" font-size="11.5" fill="#5c5751">clean this time, by luck</text>

  <!-- ================= AFTER ================= -->
  <text x="480" y="120" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">AFTER — ONE BRANCH, FOUR UNITS, GREEN</text>

  <rect x="480" y="134" width="400" height="268" rx="10" fill="#f6f8f5" stroke="#d8e2d4"/>

  <circle cx="680" cy="164" r="5" fill="#15120e"/>
  <text x="696" y="169" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15120e">main d7375ef</text>

  <path d="M680 170 L540 202 M680 170 L633 202 M680 170 L727 202 M680 170 L820 202" stroke="#c9c0b4" stroke-width="1.2" fill="none"/>
  <path d="M540 214 L680 268 M633 214 L680 268 M727 214 L680 268 M820 214 L680 268" stroke="#5f7f56" stroke-width="1.4" fill="none"/>

  <circle cx="540" cy="208" r="4.5" fill="#7a6f62"/>
  <circle cx="633" cy="208" r="4.5" fill="#7a6f62"/>
  <circle cx="727" cy="208" r="4.5" fill="#7a6f62"/>
  <circle cx="820" cy="208" r="4.5" fill="#7a6f62"/>
  <circle cx="680" cy="274" r="6.5" fill="#5f7f56"/>

  <text x="680" y="300" font-size="12" font-weight="650" fill="#15120e" text-anchor="middle">framework-25-where-the-face-is</text>
  <text x="680" y="317" font-size="11.5" fill="#5c5751" text-anchor="middle">merging this one marks all four merged</text>

  <line x1="500" y1="336" x2="860" y2="336" stroke="#d8e2d4"/>

  <text x="500" y="360" font-size="11.5" fill="#5c5751">FINDINGS.md — took both sides, everywhere</text>
  <text x="500" y="380" font-size="11.5" fill="#5c5751">the two generated files — regenerated, never hand-merged</text>

  <!-- ================= FOOT ================= -->
  <text x="40" y="446" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">AND THE HOLE THE CONFLICT WAS HIDING</text>

  <rect x="40" y="460" width="840" height="104" rx="10" fill="#faf8f5" stroke="#e4ded5"/>

  <text x="60" y="486" font-size="12" fill="#5c5751">The decisions index on <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#15120e">main</tspan> reads <tspan fill="#b4442e" font-style="italic">No record on this branch</tspan> four times. Three of the four are these pull requests.</text>

  <text x="60" y="514" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#b4442e">0103  0104  0105</text>
  <text x="196" y="514" font-size="11.5" fill="#7a6f62">before — three numbers that read as deleted</text>
  <text x="60" y="536" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5f7f56">0103  0104  0105</text>
  <text x="196" y="536" font-size="11.5" fill="#5c5751">after — a control's class · published fixtures · values instead of references</text>
  <text x="60" y="556" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8178">0106</text>
  <text x="196" y="556" font-size="11.5" fill="#8a8178">still a hole — another lane's open branch, and not this run's to fill</text>
</svg>
