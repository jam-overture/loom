<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#111827">Three ways a binding can be wrong</text>
  <text x="40" y="68" font-size="13" fill="#6b7280">"loom:data": { "&lt;name&gt;": { "source": "&lt;id&gt;", "params": { … } } }</text>

  <!-- column headers -->
  <text x="40" y="112" font-size="12" font-weight="700" fill="#9ca3af" letter-spacing="0.06em">WHAT IS WRONG</text>
  <text x="380" y="112" font-size="12" font-weight="700" fill="#9ca3af" letter-spacing="0.06em">BEFORE</text>
  <text x="640" y="112" font-size="12" font-weight="700" fill="#9ca3af" letter-spacing="0.06em">AFTER 0181</text>
  <line x1="40" y1="124" x2="860" y2="124" stroke="#e5e7eb" stroke-width="1"/>

  <!-- row 1 -->
  <text x="40" y="156" font-size="14" fill="#111827">the source id is not registered</text>
  <text x="40" y="176" font-size="12" fill="#9ca3af">"source": "nowhere"</text>
  <rect x="380" y="140" width="176" height="26" rx="13" fill="#dcfce7"/>
  <text x="396" y="158" font-size="12.5" fill="#166534">refused · no-such-source</text>
  <rect x="640" y="140" width="176" height="26" rx="13" fill="#f3f4f6"/>
  <text x="656" y="158" font-size="12.5" fill="#6b7280">unchanged</text>
  <line x1="40" y1="196" x2="860" y2="196" stroke="#f3f4f6" stroke-width="1"/>

  <!-- row 2 -->
  <text x="40" y="228" font-size="14" fill="#111827">a param the source did not declare</text>
  <text x="40" y="248" font-size="12" fill="#9ca3af">"params": { "limitt": 6 }</text>
  <rect x="380" y="212" width="196" height="26" rx="13" fill="#dcfce7"/>
  <text x="396" y="230" font-size="12.5" fill="#166534">refused · by the source's schema</text>
  <rect x="640" y="212" width="176" height="26" rx="13" fill="#f3f4f6"/>
  <text x="656" y="230" font-size="12.5" fill="#6b7280">unchanged</text>
  <line x1="40" y1="268" x2="860" y2="268" stroke="#f3f4f6" stroke-width="1"/>

  <!-- row 3 - the one -->
  <rect x="24" y="280" width="852" height="86" rx="10" fill="#fefce8"/>
  <text x="40" y="312" font-size="14" font-weight="700" fill="#111827">a binding name nothing reads</text>
  <text x="40" y="332" font-size="12" fill="#9ca3af">"entires" — the primitive looks under "entries"</text>
  <text x="40" y="352" font-size="12" fill="#a16207">the source is asked · the answer comes back · nobody looks at it</text>
  <rect x="380" y="296" width="196" height="26" rx="13" fill="#fee2e2"/>
  <text x="396" y="314" font-size="12.5" fill="#991b1b">silent — nothing said at all</text>
  <rect x="640" y="296" width="200" height="26" rx="13" fill="#dbeafe"/>
  <text x="656" y="314" font-size="12.5" fill="#1e40af">reported · data-unread</text>
  <text x="640" y="344" font-size="11.5" fill="#6b7280">and the model is shown the names</text>

  <!-- footer: the bargain -->
  <line x1="40" y1="392" x2="860" y2="392" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="418" font-size="13" font-weight="700" fill="#111827">Only ever for a primitive whose author has declared.</text>
  <text x="40" y="440" font-size="12.5" fill="#6b7280">reads: ["entries"] — reads these · reads: [] — reads no data · no clause — nobody has said, and nothing is reported</text>
  <text x="40" y="460" font-size="11.5" fill="#9ca3af">Ninety-eight primitives declare nothing today, so today the seam says nothing about any of them.</text>
</svg>
