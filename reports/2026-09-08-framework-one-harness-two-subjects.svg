<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .ink { fill: #111827; }
    .muted { fill: #6b7280; }
    .rule { stroke: #d1d5db; fill: none; }
    .seam { stroke: #10b981; fill: none; }
    .box { fill: #ffffff; stroke: #d1d5db; }
    .core { fill: #f9fafb; stroke: #10b981; }
    .h { font-size: 15px; font-weight: 650; }
    .b { font-size: 13px; }
    .s { font-size: 11.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f3f4f6; }
      .muted { fill: #9ca3af; }
      .rule { stroke: #4b5563; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .core { fill: #111827; stroke: #10b981; }
    }
  </style>

  <text class="ink h" x="40" y="34">One harness, two subjects</text>
  <text class="muted s" x="40" y="54">What differs is the subject. Everything after it is decided once.</text>

  <rect class="box" x="40" y="80" width="360" height="96" rx="8"/>
  <text class="ink b mono" x="60" y="106">pnpm specimen &lt;module&gt;</text>
  <text class="muted s" x="60" y="128">a tree the harness renders itself</text>
  <text class="muted s mono" x="60" y="150">renderSpecimen · serveDirectory · shotsAt</text>
  <text class="muted s" x="60" y="166">no server of yours, no hydration</text>

  <rect class="box" x="480" y="80" width="360" height="96" rx="8"/>
  <text class="ink b mono" x="500" y="106">pnpm shoot &lt;list.json&gt;</text>
  <text class="muted s" x="500" y="128">an address something else is serving</text>
  <text class="muted s mono" x="500" y="150">shotListSchema · urlFor(base, path)</text>
  <text class="muted s" x="500" y="166">a session, a database, a build behind it</text>

  <path class="rule" d="M220 176 L220 208 Q220 216 228 216 L432 216 Q440 216 440 224 L440 244"/>
  <path class="rule" d="M660 176 L660 208 Q660 216 652 216 L448 216 Q440 216 440 224"/>

  <rect class="core" x="150" y="248" width="580" height="72" rx="8"/>
  <text class="ink b mono" x="170" y="276">Shot</text>
  <text class="muted s mono" x="222" y="276">name · url · file · viewport · waitFor · fullPage</text>
  <text class="muted s" x="170" y="302">the only value the two subjects have to agree on</text>

  <path class="seam" d="M440 320 L440 352"/>

  <rect class="core" x="150" y="356" width="580" height="160" rx="8"/>
  <text class="ink b" x="170" y="382">One core — tools/specimen/</text>

  <text class="muted s mono" x="170" y="410">locateChromium</text>
  <text class="muted s" x="330" y="410">derived from the directory, never a build number</text>

  <text class="muted s mono" x="170" y="432">LAUNCH_ARGS</text>
  <text class="muted s" x="330" y="432">--no-sandbox --disable-dev-shm-usage</text>

  <text class="muted s mono" x="170" y="454">reducedMotion</text>
  <text class="muted s" x="330" y="454">or a revealing band photographs blank</text>

  <text class="muted s mono" x="170" y="476">measure()</text>
  <text class="muted s" x="330" y="476">scrollWidth against innerWidth, before the shutter</text>

  <text class="muted s mono" x="170" y="498">loadChromium</text>
  <text class="muted s" x="330" y="498">resolved at call time — never a dependency (0116)</text>

  <text class="muted s" x="40" y="544">Before: two of each of those five, on two branches of one lane, twelve hours apart. `wide` meant 1440 in one and 1280 in the other.</text>
</svg>
