<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Inter, Geist, -apple-system, Segoe UI, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>

  <text x="48" y="54" font-size="21" font-weight="650" fill="#111827">The file a reader waits for</text>
  <text x="48" y="80" font-size="14" fill="#6b7280">Compressed bytes that have to arrive before the search box can answer anything at all.</text>

  <!-- scale: 22,000 bytes over 760px, origin x=200 -->

  <!-- BEFORE -->
  <text x="48" y="146" font-size="13" font-weight="600" fill="#6b7280">BEFORE</text>
  <text x="48" y="164" font-size="11.5" fill="#9ca3af">one file</text>

  <rect x="200" y="124" width="263" height="42" fill="#0f9d76"/>
  <rect x="463" y="124" width="403" height="42" fill="#0f9d76" opacity="0.38"/>
  <text x="212" y="150" font-size="12.5" fill="#ffffff" font-weight="600">7,626 pages and headings</text>
  <text x="475" y="150" font-size="12.5" fill="#0b6b51" font-weight="600">11,655 published names</text>

  <line x1="891" y1="112" x2="891" y2="186" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="899" y="134" font-size="12" fill="#b91c1c" font-weight="600">cap 20,000</text>
  <text x="899" y="150" font-size="11.5" fill="#b91c1c">719 bytes left —</text>
  <text x="899" y="165" font-size="11.5" fill="#b91c1c">about 60 exports</text>

  <text x="200" y="196" font-size="12" fill="#6b7280">19,281 — and 60% of it grew whenever any lane in the repository exported a function.</text>

  <!-- AFTER -->
  <text x="48" y="276" font-size="13" font-weight="600" fill="#6b7280">AFTER</text>
  <text x="48" y="294" font-size="11.5" fill="#9ca3af">two files</text>

  <rect x="200" y="254" width="263" height="42" fill="#0f9d76"/>
  <text x="212" y="280" font-size="12.5" fill="#ffffff" font-weight="600">7,626 pages and headings</text>

  <line x1="614" y1="242" x2="614" y2="316" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="622" y="264" font-size="12" fill="#b91c1c" font-weight="600">cap 12,000</text>
  <text x="622" y="280" font-size="11.5" fill="#b91c1c">4,374 bytes left, and it moves</text>
  <text x="622" y="295" font-size="11.5" fill="#b91c1c">only when this site writes a page</text>

  <!-- the names, detached -->
  <rect x="200" y="330" width="216" height="30" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="212" y="350" font-size="12" fill="#6b7280">names 6,253</text>
  <text x="428" y="350" font-size="12" fill="#9ca3af">arrives underneath the results · nobody waits for it · 20,158 raw, down from 137,992</text>

  <line x1="48" y1="392" x2="952" y2="392" stroke="#e5e7eb" stroke-width="1"/>
  <text x="48" y="418" font-size="12" fill="#6b7280">1,067 names cost 20 KB rather than 138 because what is written down is a name, not an address: the browser rebuilds every href.</text>
</svg>
