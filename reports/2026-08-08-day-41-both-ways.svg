<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Day 41 — a revision is a place, and the log reads both ways</title>
  <desc>Before and after: the portal's revision log could only be descended from the newest end, and pages that named a revision left the reader to find it. Now the log reads in both directions and every named revision is a link.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5fb4"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="980" height="660" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" fill="#1a1a1a">A revision is a place, and the log reads both ways</text>
  <text x="40" y="64" font-size="13" fill="#6a6a6a">Day 41 · §5 — Loom Portal · no contract change: the store has named its `newer` end since 0025</text>

  <line x1="40" y1="82" x2="940" y2="82" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ============ BEFORE ============ -->
  <text x="40" y="112" font-size="14" fill="#8a8a8a" letter-spacing="1.2">BEFORE</text>

  <!-- source pages that name a revision -->
  <g font-size="11">
    <rect x="40" y="132" width="132" height="30" rx="4" fill="#fafafa" stroke="#d4d4d4"/>
    <text x="52" y="151" fill="#3a3a3a">/trees — credit</text>

    <rect x="40" y="176" width="132" height="30" rx="4" fill="#fafafa" stroke="#d4d4d4"/>
    <text x="52" y="195" fill="#3a3a3a">/activity — episode</text>

    <rect x="40" y="220" width="132" height="30" rx="4" fill="#fafafa" stroke="#d4d4d4"/>
    <text x="52" y="239" fill="#3a3a3a">/audit — finding</text>
  </g>

  <!-- dashed stubs that go nowhere -->
  <g stroke="#b0b0b0" stroke-width="1.4" stroke-dasharray="4 4" fill="none">
    <path d="M 172 147 L 226 147"/>
    <path d="M 172 191 L 226 191"/>
    <path d="M 172 235 L 226 235"/>
  </g>
  <g fill="#b0b0b0" font-size="15">
    <text x="232" y="152">×</text>
    <text x="232" y="196">×</text>
    <text x="232" y="240">×</text>
  </g>
  <text x="250" y="185" font-size="11" fill="#8a8a8a">“revision 5”, as text.</text>
  <text x="250" y="201" font-size="11" fill="#8a8a8a">Read the number, open</text>
  <text x="250" y="217" font-size="11" fill="#8a8a8a">/history, page back.</text>

  <!-- the log, descended one way -->
  <g>
    <rect x="90" y="292" width="290" height="46" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <text x="106" y="315" font-size="12" fill="#1a1a1a">newest page</text>
    <text x="106" y="331" font-size="11" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r7 r8 r9</text>

    <rect x="90" y="386" width="290" height="46" rx="5" fill="#ffffff" stroke="#c4c4c4"/>
    <text x="106" y="409" font-size="12" fill="#1a1a1a">?older=…</text>
    <text x="106" y="425" font-size="11" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r4 r5 r6</text>

    <rect x="90" y="480" width="290" height="46" rx="5" fill="#ffffff" stroke="#c4c4c4"/>
    <text x="106" y="503" font-size="12" fill="#1a1a1a">?older=…</text>
    <text x="106" y="519" font-size="11" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r1 r2 r3</text>
  </g>

  <g stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrow-dark)">
    <path d="M 180 338 L 180 382"/>
    <path d="M 180 432 L 180 476"/>
  </g>
  <text x="192" y="366" font-size="11" fill="#3a3a3a">← earlier</text>
  <text x="192" y="460" font-size="11" fill="#3a3a3a">← earlier</text>

  <!-- the only way back: all the way out -->
  <path d="M 380 503 C 424 503 424 315 384 315" stroke="#8a8a8a" stroke-width="1.4" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arrow-grey)"/>
  <text x="398" y="412" font-size="11" fill="#8a8a8a" transform="rotate(-90 398 412)">latest → (start again)</text>

  <text x="90" y="562" font-size="11" fill="#8a8a8a">No way forward one step. “What happened after this?”</text>
  <text x="90" y="578" font-size="11" fill="#8a8a8a">is answered by leaving and descending again.</text>

  <!-- divider -->
  <line x1="500" y1="100" x2="500" y2="600" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ============ AFTER ============ -->
  <text x="540" y="112" font-size="14" fill="#1a5fb4" letter-spacing="1.2">AFTER</text>

  <g font-size="11">
    <rect x="540" y="132" width="132" height="30" rx="4" fill="#f4f8fd" stroke="#9dbde4"/>
    <text x="552" y="151" fill="#1a5fb4">/trees — credit</text>

    <rect x="540" y="176" width="132" height="30" rx="4" fill="#f4f8fd" stroke="#9dbde4"/>
    <text x="552" y="195" fill="#1a5fb4">/activity — episode</text>

    <rect x="540" y="220" width="132" height="30" rx="4" fill="#f4f8fd" stroke="#9dbde4"/>
    <text x="552" y="239" fill="#1a5fb4">/audit — finding</text>
  </g>

  <!-- solid links straight into the anchored page -->
  <g stroke="#1a5fb4" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 672 147 C 726 147 736 340 748 382"/>
    <path d="M 672 191 C 730 191 740 344 752 382"/>
    <path d="M 672 235 C 734 235 744 348 756 382"/>
  </g>
  <text x="686" y="286" font-size="11" fill="#1a5fb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">?at=5</text>
  <text x="686" y="302" font-size="11" fill="#6a6a6a">every revision named</text>
  <text x="686" y="318" font-size="11" fill="#6a6a6a">is a link (0043)</text>

  <g>
    <rect x="540" y="292" width="290" height="46" rx="5" fill="#ffffff" stroke="#c4c4c4"/>
    <text x="556" y="315" font-size="12" fill="#1a1a1a">newest page</text>
    <text x="556" y="331" font-size="11" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r7 r8 r9</text>

    <rect x="540" y="386" width="290" height="46" rx="5" fill="#f4f8fd" stroke="#1a5fb4" stroke-width="1.6"/>
    <text x="556" y="409" font-size="12" fill="#1a1a1a">?at=5 — opens here, marks r5</text>
    <text x="556" y="425" font-size="11" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r4 <tspan fill="#1a5fb4" font-weight="bold">r5</tspan> r6</text>

    <rect x="540" y="480" width="290" height="46" rx="5" fill="#ffffff" stroke="#c4c4c4"/>
    <text x="556" y="503" font-size="12" fill="#1a1a1a">?older=…</text>
    <text x="556" y="519" font-size="11" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r1 r2 r3</text>
  </g>

  <!-- both directions -->
  <g stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrow-dark)">
    <path d="M 600 338 L 600 382"/>
    <path d="M 600 432 L 600 476"/>
  </g>
  <g stroke="#1a5fb4" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 700 382 L 700 338"/>
    <path d="M 700 476 L 700 432"/>
  </g>
  <text x="500" y="366" font-size="11" fill="#3a3a3a" text-anchor="end" transform="translate(96 0)">← earlier</text>
  <text x="500" y="460" font-size="11" fill="#3a3a3a" text-anchor="end" transform="translate(96 0)">← earlier</text>
  <text x="712" y="366" font-size="11" fill="#1a5fb4">later →</text>
  <text x="712" y="460" font-size="11" fill="#1a5fb4">later →</text>

  <text x="540" y="562" font-size="11" fill="#6a6a6a">`?newer=` resumes forward from the end the page reported.</text>
  <text x="540" y="578" font-size="11" fill="#6a6a6a">A stale anchor now says which way it went, not just that it is gone.</text>

  <line x1="40" y1="606" x2="940" y2="606" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="630" font-size="11" fill="#8a8a8a">Runtime 980 / 78 · portal 313 / 28 · one shared RevisionLink, so a fragment cannot stop matching a row id</text>
</svg>
