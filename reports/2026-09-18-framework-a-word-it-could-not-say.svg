<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" width="920" height="590" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="590" fill="#fbfaf8"/>

  <text x="32" y="38" font-size="19" font-weight="650" fill="#1c1917">A word it was told to read, and could not</text>
  <text x="32" y="60" font-size="13.5" fill="#57534e">One <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">loom.stat</tspan> holding <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">{ value: 3400, label: "appointments", caption: "" }</tspan>, read by <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">copyIn</tspan> against a type</text>
  <text x="32" y="78" font-size="13.5" fill="#57534e">that declared all three as copy. Both readings below are one script's output, run against each branch.</text>

  <!-- MAIN -->
  <rect x="32" y="98" width="416" height="214" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="126" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">ON MAIN</text>

  <rect x="52" y="140" width="376" height="62" rx="7" fill="#f7f6f4" stroke="#e7e5e4"/>
  <text x="68" y="162" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">words:    ["appointments"]</text>
  <text x="68" y="184" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">unread:   []</text>

  <text x="52" y="230" font-size="13" fill="#57534e">The figure left <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">words</tspan> and arrived nowhere. It is not</text>
  <text x="52" y="250" font-size="13" fill="#57534e">coerced, which is right, and it is not reported, which</text>
  <text x="52" y="270" font-size="13" fill="#57534e">is the gap: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">unread: []</tspan> is a positive claim that every</text>
  <text x="52" y="290" font-size="13" font-weight="600" fill="#9a3412">type under here declared — so these are all the words.</text>

  <!-- BRANCH -->
  <rect x="472" y="98" width="416" height="214" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="492" y="126" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">ON THIS BRANCH</text>

  <rect x="492" y="140" width="376" height="84" rx="7" fill="#f7f6f4" stroke="#e7e5e4"/>
  <text x="508" y="162" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">words:    ["appointments"]</text>
  <text x="508" y="184" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">unread:   []</text>
  <text x="508" y="206" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166534">unspoken: [{ props: ["value"] }]</text>

  <text x="492" y="250" font-size="13" fill="#57534e">Still not guessed at — the component owns the separator</text>
  <text x="492" y="270" font-size="13" fill="#57534e">and the runtime does not. It is now <tspan font-weight="600" fill="#166534">accounted for</tspan> —</text>
  <text x="492" y="290" font-size="13" fill="#57534e">named per node and type, beside the props nobody spoke for.</text>

  <!-- THREE CASES -->
  <rect x="32" y="332" width="416" height="180" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="360" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">A DECLARED COPY PROP, THREE WAYS</text>

  <line x1="52" y1="374" x2="428" y2="374" stroke="#e7e5e4"/>
  <text x="52" y="398" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">caption absent</text>
  <text x="250" y="398" font-size="12.5" fill="#57534e">nothing — never written</text>

  <line x1="52" y1="412" x2="428" y2="412" stroke="#f0eeeb"/>
  <text x="52" y="436" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">caption: ""</text>
  <text x="250" y="436" font-size="12.5" fill="#57534e">nothing — the page shows none</text>

  <line x1="52" y1="450" x2="428" y2="450" stroke="#f0eeeb"/>
  <text x="52" y="474" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">value: 3400</text>
  <text x="250" y="474" font-size="12.5" font-weight="600" fill="#166534">unspoken</text>

  <!-- THE ASYMMETRY -->
  <rect x="472" y="332" width="416" height="180" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="492" y="360" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">THE SAME NODE, NOTHING DECLARED</text>

  <rect x="492" y="374" width="376" height="62" rx="7" fill="#f7f6f4" stroke="#e7e5e4"/>
  <text x="508" y="396" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">unread:   [{ props: ["label"] }]</text>
  <text x="508" y="418" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#292524">unspoken: []</text>

  <text x="492" y="460" font-size="13" fill="#57534e">Unchanged, on both branches, and deliberately. Absent a</text>
  <text x="492" y="480" font-size="13" fill="#57534e">declaration, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">3400</tspan> is a setting — and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">weight: 2</tspan> on a divider</text>
  <text x="492" y="500" font-size="13" fill="#57534e">is not a word a reader could lose.</text>

  <text x="32" y="544" font-size="13.5" font-weight="600" fill="#1c1917">A declaration is what makes a non-string value a missing word. Absent one, it is a setting.</text>
  <text x="32" y="566" font-size="12.5" fill="#78716c">0169 · src/sdk/copy.ts · filed by Loom lessons on 13 September while writing lesson 24</text>
</svg>
