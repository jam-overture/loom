<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" width="1000" height="648" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="648" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="600" fill="#0f172a">Day 44 — what a render test pulls across the boundary</text>
  <text x="40" y="64" font-size="13" fill="#475569">The portal's first 21 rendering tests. Left: the graph the first attempt assembled. Right: the graph the framework would.</text>

  <line x1="500" y1="88" x2="500" y2="500" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============ LEFT: the failure ============ -->
  <text x="40" y="110" font-size="13" font-weight="600" fill="#b91c1c">Vitest alone — no substitution</text>

  <rect x="145" y="126" width="220" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="255" y="146" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">RevisionRow</text>
  <text x="255" y="163" font-size="11" text-anchor="middle" fill="#64748b" font-family="ui-monospace, Menlo, monospace">render(&lt;RevisionRow /&gt;)</text>

  <line x1="255" y1="172" x2="255" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="145" y="192" width="220" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="255" y="212" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">UndoButton</text>
  <text x="255" y="229" font-size="11" text-anchor="middle" fill="#64748b" font-family="ui-monospace, Menlo, monospace">"use client"</text>

  <line x1="255" y1="238" x2="255" y2="254" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="145" y="258" width="220" height="46" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="255" y="278" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">history/actions.ts</text>
  <text x="255" y="295" font-size="11" text-anchor="middle" fill="#b91c1c" font-family="ui-monospace, Menlo, monospace">"use server"</text>

  <line x1="255" y1="304" x2="255" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="145" y="324" width="220" height="46" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="255" y="344" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">lib/write</text>
  <text x="255" y="361" font-size="11" text-anchor="middle" fill="#64748b" font-family="ui-monospace, Menlo, monospace">→ lib/interpreter</text>

  <line x1="255" y1="370" x2="255" y2="386" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="145" y="390" width="220" height="46" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="255" y="410" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">new Anthropic({ apiKey })</text>
  <text x="255" y="427" font-size="11" text-anchor="middle" fill="#64748b">a key, in a browser-like environment</text>

  <rect x="70" y="452" width="370" height="44" rx="6" fill="#b91c1c"/>
  <text x="255" y="470" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">✗  "It looks like you're running in a browser-like environment."</text>
  <text x="255" y="487" font-size="11" text-anchor="middle" fill="#fecaca">The SDK was the only thing in the room that noticed.</text>

  <!-- ============ RIGHT: the substitution ============ -->
  <text x="560" y="110" font-size="13" font-weight="600" fill="#047857">With loom:server-action-stubs</text>

  <rect x="635" y="126" width="220" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="745" y="146" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">RevisionRow</text>
  <text x="745" y="163" font-size="11" text-anchor="middle" fill="#64748b" font-family="ui-monospace, Menlo, monospace">render(&lt;RevisionRow /&gt;)</text>

  <line x1="745" y1="172" x2="745" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="635" y="192" width="220" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="745" y="212" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">UndoButton</text>
  <text x="745" y="229" font-size="11" text-anchor="middle" fill="#64748b" font-family="ui-monospace, Menlo, monospace">"use client"</text>

  <line x1="745" y1="238" x2="745" y2="254" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="757" y="251" font-size="10" fill="#047857" font-family="ui-monospace, Menlo, monospace">directive detected</text>

  <rect x="635" y="258" width="220" height="46" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="745" y="278" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">undoRevision</text>
  <text x="745" y="295" font-size="11" text-anchor="middle" fill="#047857">an opaque handle — throws if called</text>

  <line x1="560" y1="330" x2="930" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="560" y="324" font-size="11" font-weight="600" fill="#64748b">the client / server boundary</text>

  <rect x="600" y="346" width="290" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <text x="745" y="367" font-size="11" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace">lib/write · lib/interpreter · Anthropic</text>
  <text x="745" y="385" font-size="11" text-anchor="middle" fill="#94a3b8">never loaded — tested where it runs</text>

  <rect x="560" y="452" width="370" height="44" rx="6" fill="#047857"/>
  <text x="745" y="470" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">✓  21 assertions about a document, offline, no key</text>
  <text x="745" y="487" font-size="11" text-anchor="middle" fill="#a7f3d0">revision 0 is not a link · silence when 0029 requires it · no cursor</text>

  <!-- ============ BOTTOM: the two projects ============ -->
  <text x="40" y="536" font-size="13" font-weight="600" fill="#0f172a">A filename says which suite a test belongs to (0015: a filename is a type)</text>

  <rect x="40" y="550" width="440" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="574" font-size="13" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">*.test.ts</text>
  <text x="60" y="594" font-size="11" fill="#475569">node · no DOM · 338 tests · 29 files</text>
  <text x="60" y="610" font-size="11" fill="#64748b">pure logic, store contracts, Postgres — a document would be scenery</text>

  <rect x="520" y="550" width="440" height="70" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="540" y="574" font-size="13" font-weight="600" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">*.test.tsx</text>
  <text x="540" y="594" font-size="11" fill="#047857">jsdom · Testing Library · cleanup · stubs · 21 tests · 4 files</text>
  <text x="540" y="610" font-size="11" fill="#64748b">what a component renders — and nothing about what an action does</text>
</svg>
