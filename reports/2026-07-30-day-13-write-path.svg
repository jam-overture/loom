<svg xmlns="http://www.w3.org/2000/svg" width="980" height="880" viewBox="0 0 980 880" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#414a5c"/>
    </marker>
    <marker id="arrow-refuse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a11b00"/>
    </marker>
    <marker id="arrow-hold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="980" height="880" fill="#ffffff"/>

  <text x="40" y="42" font-size="21" fill="#1a1a1a">The one write path</text>
  <text x="40" y="65" font-size="13" fill="#6e6e6e">§5 — a sentence goes in, a log entry comes out, and the only other exit is custody.</text>

  <!-- lane headers -->
  <g font-size="12">
    <rect x="40" y="86" width="132" height="30" rx="4" fill="#f0f1f3" stroke="#e0e1e5"/>
    <text x="106" y="105" text-anchor="middle" fill="#1a1a1a">browser</text>

    <rect x="196" y="86" width="150" height="30" rx="4" fill="#f0f1f3" stroke="#e0e1e5"/>
    <text x="271" y="105" text-anchor="middle" fill="#1a1a1a">server action</text>

    <rect x="370" y="86" width="150" height="30" rx="4" fill="#e3e6ee" stroke="#5b6478"/>
    <text x="445" y="105" text-anchor="middle" fill="#1a1a1a">commitIntent</text>

    <rect x="544" y="86" width="176" height="30" rx="4" fill="#f0f1f3" stroke="#e0e1e5"/>
    <text x="632" y="105" text-anchor="middle" fill="#1a1a1a">composeChange · Gate</text>

    <rect x="744" y="86" width="196" height="30" rx="4" fill="#f0f1f3" stroke="#e0e1e5"/>
    <text x="842" y="105" text-anchor="middle" fill="#1a1a1a">TreeStore · HoldStore</text>
  </g>

  <!-- lifelines -->
  <g stroke="#c9ccd4" stroke-dasharray="3 4">
    <line x1="106" y1="120" x2="106" y2="836"/>
    <line x1="271" y1="120" x2="271" y2="836"/>
    <line x1="445" y1="120" x2="445" y2="836"/>
    <line x1="632" y1="120" x2="632" y2="836"/>
    <line x1="842" y1="120" x2="842" y2="836"/>
  </g>

  <g font-size="11.5" fill="#1a1a1a">
    <!-- 1 -->
    <line x1="106" y1="152" x2="265" y2="152" stroke="#414a5c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="112" y="146">utterance + baseRevision</text>
    <text x="112" y="168" font-size="10.5" fill="#6e6e6e" font-style="italic">never a delta, never an origin (0017)</text>

    <!-- 2 -->
    <line x1="271" y1="200" x2="439" y2="200" stroke="#414a5c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="277" y="194">EditIntent · origin: user-instruction</text>

    <!-- 3 head -->
    <line x1="445" y1="240" x2="836" y2="240" stroke="#414a5c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="451" y="234">head(treeId)</text>
    <line x1="842" y1="266" x2="451" y2="266" stroke="#414a5c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="700" y="260" text-anchor="end">revision</text>

    <!-- stale exit -->
    <rect x="360" y="284" width="392" height="42" rx="4" fill="#ffe9e4" stroke="#ff9999"/>
    <text x="374" y="301" font-size="11" fill="#a11b00">revision ≠ baseRevision → revision-conflict {expected, found}</text>
    <text x="374" y="317" font-size="10.5" fill="#a11b00" font-style="italic">refused here, before a model call is ever spent on it</text>
    <line x1="360" y1="305" x2="112" y2="305" stroke="#a11b00" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-refuse)"/>

    <!-- 4 compose -->
    <line x1="445" y1="368" x2="626" y2="368" stroke="#414a5c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="451" y="362">composeChange(tree, intent)</text>

    <rect x="546" y="384" width="176" height="72" rx="4" fill="#f7f8fa" stroke="#c9ccd4"/>
    <text x="558" y="402" font-size="10.5" fill="#4a4a4a">interpret → ProposedChange</text>
    <text x="558" y="418" font-size="10.5" fill="#4a4a4a">assess: stakes · reversibility</text>
    <text x="558" y="434" font-size="10.5" fill="#4a4a4a">gate(assessment, policy)</text>
    <text x="558" y="450" font-size="10.5" fill="#6e6e6e" font-style="italic">one repair attempt (0006)</text>

    <!-- accepted branch -->
    <line x1="632" y1="490" x2="451" y2="490" stroke="#414a5c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="626" y="484" text-anchor="end">accepted</text>

    <line x1="445" y1="522" x2="836" y2="522" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="451" y="516" fill="#15803d">append(delta, provenance, appliedAt)</text>
    <rect x="440" y="532" width="330" height="20" rx="3" fill="#e6f6ec"/>
    <text x="452" y="546" font-size="10.5" fill="#15803d">change-applied → change-committed · the log is the truth (0016)</text>

    <!-- held branch -->
    <line x1="632" y1="596" x2="451" y2="596" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-hold)"/>
    <text x="626" y="590" text-anchor="end" fill="#c2410c">requires-confirmation</text>

    <line x1="445" y1="626" x2="836" y2="626" stroke="#c2410c" stroke-width="1.6" marker-end="url(#arrow-hold)"/>
    <text x="451" y="620" fill="#c2410c">holds.hold(proposal, baseRevision)</text>
    <rect x="440" y="636" width="352" height="20" rx="3" fill="#fdeee2"/>
    <text x="452" y="650" font-size="10.5" fill="#c2410c">server-side custody, keyed by proposalId (0021) · proposal-held</text>
  </g>

  <!-- answer section -->
  <line x1="40" y1="686" x2="940" y2="686" stroke="#e0e1e5"/>
  <text x="40" y="706" font-size="12.5" fill="#4a4a4a">later — a human answers</text>

  <g font-size="11.5" fill="#1a1a1a">
    <line x1="106" y1="742" x2="439" y2="742" stroke="#414a5c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="112" y="736">proposalId — the answer names an id, never a change</text>

    <line x1="445" y1="782" x2="836" y2="782" stroke="#414a5c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="451" y="776">holds.release(proposalId)  ·  a take, so exactly one answer lands</text>

    <rect x="360" y="798" width="482" height="34" rx="4" fill="#f7f8fa" stroke="#c9ccd4"/>
    <text x="372" y="814" font-size="10.5" fill="#4a4a4a">apply → the Gate runs again against head, then append · discard → hold-discarded</text>
    <text x="372" y="828" font-size="10.5" fill="#6e6e6e" font-style="italic">a moved tree makes the hold dead, not stale: released, and reported as a conflict</text>
  </g>
</svg>
