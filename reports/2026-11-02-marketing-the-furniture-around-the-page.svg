<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <style>
    .t { fill: #18181b; }
    .m { fill: #52525b; }
    .box { fill: #fafafa; stroke: #d4d4d8; }
    .ok { fill: #f0fdf4; stroke: #86efac; }
    .bad { fill: #fef2f2; stroke: #fca5a5; }
    .okt { fill: #166534; }
    .badt { fill: #991b1b; }
    .page { fill: #0a0a0a; stroke: #3f3f46; }
    .pagetext { fill: #f5f5f5; }
    .light { fill: #ffffff; stroke: #a1a1aa; }
    .dark { fill: #0a0a0a; stroke: #52525b; }
    text { font-size: 13px; }
    .h { font-size: 15px; font-weight: 700; }
    .k { font-size: 11px; letter-spacing: .06em; font-weight: 700; }
    .s { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #fafafa } .m { fill: #a1a1aa }
      .box { fill: #1c1c1f; stroke: #3f3f46 }
      .ok { fill: #0d2017; stroke: #15803d } .bad { fill: #220f0f; stroke: #b91c1c }
      .okt { fill: #4ade80 } .badt { fill: #f87171 }
    }
  </style>

  <text class="h t" x="24" y="30">What a tree ends at, and what the document was never told</text>
  <text class="m" x="24" y="52">`/?theme=bold`, whose canvas is `#0a0a0a`. Measured on a production build, 2 November 2026.</text>

  <!-- BEFORE -->
  <rect class="bad" x="24" y="76" width="400" height="320" rx="8"/>
  <text class="k badt" x="44" y="102">AS IT SHIPPED — THE DOCUMENT SAYS NOTHING</text>

  <rect class="light" x="44" y="118" width="360" height="156" rx="5"/>
  <text class="s m" x="54" y="136">the document element · no `color-scheme`</text>
  <rect class="page" x="54" y="146" width="322" height="98" rx="4"/>
  <text class="s pagetext" x="66" y="170">the tree · `bg-canvas: #0a0a0a`</text>
  <text class="s pagetext" x="66" y="190" opacity="0.6">every `--loom-*` on the root primitive</text>
  <rect class="light" x="382" y="146" width="14" height="98" rx="3"/>
  <rect class="light" x="54" y="250" width="322" height="12" rx="2"/>

  <text class="s badt" x="44" y="296">The scrollbar beside the page, the canvas past the end of a</text>
  <text class="s badt" x="44" y="312">short one and an unstyled control keep the light default.</text>
  <text class="badt" x="44" y="344">`color-scheme` in the served document:</text>
  <text class="h badt" x="44" y="370">0 occurrences, on every palette</text>

  <!-- AFTER -->
  <rect class="ok" x="456" y="76" width="400" height="320" rx="8"/>
  <text class="k okt" x="476" y="102">AFTER — THE HOST TAKES THE RULE FOR ITS `:root`</text>

  <rect class="dark" x="476" y="118" width="360" height="156" rx="5"/>
  <text class="s pagetext" x="486" y="136">the document element · `color-scheme: dark`</text>
  <rect class="page" x="486" y="146" width="322" height="98" rx="4"/>
  <text class="s pagetext" x="498" y="170">the tree · `bg-canvas: #0a0a0a`</text>
  <text class="s pagetext" x="498" y="190" opacity="0.6">unchanged — not one pixel of the page moved</text>
  <rect class="dark" x="814" y="146" width="14" height="98" rx="3"/>
  <rect class="dark" x="486" y="250" width="322" height="12" rx="2"/>

  <text class="s okt" x="476" y="296">The browser is told which way round the palette is, so all</text>
  <text class="s okt" x="476" y="312">three of them follow the page.</text>
  <text class="okt" x="476" y="344">`color-scheme` in the served document:</text>
  <text class="h okt" x="476" y="370">1, in the head, and it is the palette in the address</text>

  <!-- the three palettes -->
  <rect class="box" x="24" y="418" width="832" height="100" rx="8"/>
  <text class="k t" x="44" y="442">WHAT EACH PALETTE NOW PUTS ON THE DOCUMENT</text>
  <text class="m" x="44" y="468">`?theme=minimal`</text>
  <text class="t" x="186" y="468">`color-scheme: light` · `background-color: #ffffff`</text>
  <text class="m" x="590" y="468">2,255 B in the head</text>
  <text class="m" x="44" y="488">`?theme=editorial`</text>
  <text class="t" x="186" y="488">`color-scheme: light` · `background-color: #fafaf7`</text>
  <text class="m" x="590" y="488">1,969 B in the head</text>
  <text class="m" x="44" y="508">`?theme=bold`</text>
  <text class="t" x="186" y="508">`color-scheme: dark` · `background-color: #0a0a0a`</text>
  <text class="m" x="590" y="508">1,976 B — 0.14% of it</text>
</svg>
