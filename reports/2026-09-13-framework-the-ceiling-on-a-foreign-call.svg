<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="660" fill="#fbfaf8"/>

  <text x="32" y="44" font-size="19" font-weight="650" fill="#1c1917">The ceiling on a foreign call</text>
  <text x="32" y="68" font-size="13.5" fill="#57534e">Loom awaits somebody else's code in three places. All three could report a timeout; none could produce one.</text>

  <!-- the model seam -->
  <rect x="32" y="94" width="856" height="216" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="122" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">ASKING A MODEL WHAT TO CHANGE</text>

  <rect x="52" y="140" width="150" height="40" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="127" y="165" font-size="13" text-anchor="middle" fill="#292524">modelInterpreter</text>

  <path d="M 202 160 L 240 160" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 240 160 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="242" y="140" width="132" height="40" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="308" y="165" font-size="13" text-anchor="middle" fill="#78350f">ceiling · 3m</text>

  <path d="M 374 160 L 412 160" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 412 160 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="414" y="140" width="178" height="40" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="503" y="165" font-size="13" text-anchor="middle" fill="#292524">ModelClient.complete</text>

  <path d="M 592 160 L 630 160" stroke="#a8a29e" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
  <path d="M 630 160 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="632" y="140" width="236" height="40" rx="7" fill="#fafaf9" stroke="#e7e5e4" stroke-dasharray="4 3"/>
  <text x="750" y="165" font-size="13" text-anchor="middle" fill="#78716c">a request never answered</text>

  <path d="M 503 188 L 503 212" stroke="#d97706" stroke-width="1.4" fill="none" stroke-dasharray="3 3"/>
  <text x="515" y="206" font-size="11.5" fill="#92400e">AbortSignal — the socket is let go</text>

  <text x="52" y="250" font-size="12" font-weight="650" fill="#b91c1c" letter-spacing="0.04em">BEFORE</text>
  <rect x="120" y="234" width="330" height="26" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="136" y="252" font-size="12.5" fill="#7f1d1d">"Working on it…" until the harness gives up</text>
  <text x="466" y="252" font-size="12" fill="#78716c">nothing in the log, and none of the five codes</text>

  <text x="52" y="288" font-size="12" font-weight="650" fill="#15803d" letter-spacing="0.04em">NOW</text>
  <rect x="120" y="272" width="330" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="136" y="290" font-size="12.5" fill="#14532d">interpreter-unavailable — no reply in 3m</text>
  <text x="466" y="290" font-size="12" fill="#78716c">a host's own client is bounded too, having written nothing</text>

  <!-- the data seam -->
  <rect x="32" y="326" width="856" height="294" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="52" y="354" font-size="12" font-weight="650" fill="#78716c" letter-spacing="0.06em">ANSWERING THE BINDINGS OF ONE PAGE</text>

  <rect x="52" y="416" width="150" height="40" rx="7" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="127" y="441" font-size="13" text-anchor="middle" fill="#292524">resolveDataPlan</text>

  <path d="M 202 436 L 228 436" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 228 388 L 228 484" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 228 388 L 258 388" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 258 388 l -7 -4 v 8 z" fill="#a8a29e"/>
  <path d="M 228 436 L 258 436" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 258 436 l -7 -4 v 8 z" fill="#a8a29e"/>
  <path d="M 228 484 L 258 484" stroke="#a8a29e" stroke-width="1.6" fill="none"/>
  <path d="M 258 484 l -7 -4 v 8 z" fill="#a8a29e"/>

  <rect x="260" y="372" width="126" height="32" rx="6" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="323" y="393" font-size="12.5" text-anchor="middle" fill="#292524">profile</text>
  <rect x="260" y="420" width="126" height="32" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="323" y="441" font-size="12.5" text-anchor="middle" fill="#78350f">orders · hangs</text>
  <rect x="260" y="468" width="126" height="32" rx="6" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="323" y="489" font-size="12.5" text-anchor="middle" fill="#292524">services</text>

  <text x="406" y="394" font-size="12" fill="#15803d">ready</text>
  <text x="406" y="442" font-size="12" fill="#b45309">ten seconds, and each source has its own</text>
  <text x="406" y="490" font-size="12" fill="#15803d">ready</text>

  <text x="52" y="524" font-size="11.5" fill="#a8a29e">The submission seam is this module with the nouns changed — same Promise.all, same claim, same ceiling.</text>

  <text x="52" y="564" font-size="12" font-weight="650" fill="#b91c1c" letter-spacing="0.04em">BEFORE</text>
  <rect x="120" y="548" width="330" height="26" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="136" y="566" font-size="12.5" fill="#7f1d1d">Promise.all held the page, not the region</text>
  <text x="466" y="566" font-size="12" fill="#78716c">the module comment had promised otherwise</text>

  <text x="52" y="602" font-size="12" font-weight="650" fill="#15803d" letter-spacing="0.04em">NOW</text>
  <rect x="120" y="586" width="330" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="136" y="604" font-size="12.5" fill="#14532d">unavailable — no answer in 10s, in one region</text>
  <text x="466" y="604" font-size="12" fill="#78716c">two regions draw; the third says what happened</text>

  <text x="32" y="644" font-size="11.5" fill="#a8a29e">0140 · ten tests that could not finish before the ceiling existed · pnpm verify green: 2,406 runtime and 4,021 application tests</text>
</svg>
