<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#faf9f7"/>

  <text x="40" y="46" font-size="20" font-weight="600" fill="#1a1a1a">Two nodes name the same anchor. Only one of the two checks can tell.</text>
  <text x="40" y="70" font-size="14" fill="#6b6b66">Each node is valid on its own. What is wrong is a fact about the pair.</text>

  <!-- LEFT: a prop schema -->
  <rect x="40" y="98" width="420" height="378" rx="10" fill="#ffffff" stroke="#e0ddd6"/>
  <text x="64" y="130" font-size="13" font-weight="600" fill="#8a8378" letter-spacing="0.08em">A PROP SCHEMA, ONE NODE AT A TIME</text>

  <rect x="64" y="148" width="372" height="62" rx="7" fill="#f5f3ef" stroke="#e0ddd6"/>
  <text x="82" y="174" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">loom.section  anchor: "pricing"</text>
  <text x="82" y="196" font-size="13" fill="#2f7a4f">✓ a slug — valid</text>

  <rect x="64" y="224" width="372" height="62" rx="7" fill="#f5f3ef" stroke="#e0ddd6"/>
  <text x="82" y="250" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">loom.section  anchor: "pricing"</text>
  <text x="82" y="272" font-size="13" fill="#2f7a4f">✓ a slug — valid</text>

  <path d="M250 296 L250 322" stroke="#c4bfb4" stroke-width="1.5"/>
  <path d="M244 315 L250 323 L256 315" fill="none" stroke="#c4bfb4" stroke-width="1.5"/>

  <rect x="64" y="330" width="372" height="118" rx="7" fill="#fdf2f0" stroke="#e8c4bd"/>
  <text x="82" y="356" font-size="13" font-weight="600" fill="#a33d2b">The document</text>
  <text x="82" y="380" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">&lt;section id="pricing"&gt;</text>
  <text x="82" y="400" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">&lt;section id="pricing"&gt;</text>
  <text x="82" y="428" font-size="12.5" fill="#a33d2b">#pricing lands on whichever the parser preferred.</text>

  <!-- RIGHT: the render -->
  <rect x="500" y="98" width="420" height="378" rx="10" fill="#ffffff" stroke="#e0ddd6"/>
  <text x="524" y="130" font-size="13" font-weight="600" fill="#8a8378" letter-spacing="0.08em">THE RENDER, WHICH SEES THE WALK</text>

  <rect x="524" y="148" width="372" height="62" rx="7" fill="#f5f3ef" stroke="#e0ddd6"/>
  <text x="542" y="174" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">loom:anchor  "pricing"</text>
  <text x="542" y="196" font-size="13" fill="#2f7a4f">✓ claimed — first in document order</text>

  <rect x="524" y="224" width="372" height="62" rx="7" fill="#f5f3ef" stroke="#e0ddd6"/>
  <text x="542" y="250" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">loom:anchor  "pricing"</text>
  <text x="542" y="272" font-size="13" fill="#b0762a">— already held by n_3</text>

  <path d="M710 296 L710 322" stroke="#c4bfb4" stroke-width="1.5"/>
  <path d="M704 315 L710 323 L716 315" fill="none" stroke="#c4bfb4" stroke-width="1.5"/>

  <rect x="524" y="330" width="372" height="118" rx="7" fill="#f0f6f2" stroke="#bcd8c6"/>
  <text x="542" y="356" font-size="13" font-weight="600" fill="#2f7a4f">The document</text>
  <text x="542" y="380" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">&lt;section id="pricing"&gt;</text>
  <text x="542" y="400" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8378">&lt;section&gt;</text>
  <text x="542" y="428" font-size="12.5" fill="#2f7a4f">#pricing lands. The second is a diagnostic.</text>

  <text x="40" y="502" font-size="13" fill="#6b6b66">The same argument decides the decorative copy: a copy is the same children with identity off, and an anchor is identity.</text>
</svg>
