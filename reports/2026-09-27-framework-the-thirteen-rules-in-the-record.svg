<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="Five refused changes, grouped by what the journal could say about them before and after">
  <title>Five refusals, grouped by what a stored record can say</title>
  <style>
    .h { font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111827 }
    .sub { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #6b7280 }
    .lbl { font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #374151 }
    .num { font: 600 12.5px ui-sans-serif, system-ui, sans-serif; fill: #111827 }
    .rule { stroke: #e5e7eb; stroke-width: 1 }
    .barA { fill: #9ca3af }
    .barB { fill: #4b5563 }
    .barC { fill: #b91c1c }
    .note { font: 400 11.5px ui-sans-serif, system-ui, sans-serif; fill: #6b7280 }
  </style>
  <rect width="880" height="372" fill="#ffffff" />

  <text class="h" x="32" y="34">Five changes the Gate refused. Same corpus, two ways of asking why.</text>
  <text class="sub" x="32" y="54">Printed by running the code: two footer removals under a host that protects it, three nodes no primitive is registered for.</text>

  <line class="rule" x1="32" y1="72" x2="848" y2="72" />

  <text class="h" x="32" y="100">Before — grouped by the reason the Gate recorded</text>
  <text class="lbl" x="32" y="130">rejected / stakes-at-refusal-floor</text>
  <rect class="barA" x="300" y="118" width="440" height="16" rx="2" />
  <text class="num" x="752" y="131">5</text>
  <text class="note" x="32" y="154">One row. It is true, and there is nothing in it an operator can act on.</text>

  <line class="rule" x1="32" y1="172" x2="848" y2="172" />

  <text class="h" x="32" y="200">After — grouped by the rules the record now carries</text>

  <text class="lbl" x="32" y="230">unknown-primitive</text>
  <rect class="barC" x="300" y="218" width="264" height="16" rx="2" />
  <text class="num" x="576" y="231">3</text>

  <text class="lbl" x="32" y="256">protected-type-removed</text>
  <rect class="barB" x="300" y="244" width="176" height="16" rx="2" />
  <text class="num" x="488" y="257">2</text>

  <text class="lbl" x="32" y="282">protected-type-touched</text>
  <rect class="barB" x="300" y="270" width="176" height="16" rx="2" />
  <text class="num" x="488" y="283">2</text>

  <text class="lbl" x="32" y="308">shallow-structural-change</text>
  <rect class="barB" x="300" y="296" width="176" height="16" rx="2" />
  <text class="num" x="488" y="309">2</text>

  <text class="note" x="32" y="338">Four rows, and the red one is the actionable finding: the model invented three parts this deployment has no code for.</text>
  <text class="note" x="32" y="358">Only one of the four is critical. The level was the whole of what the record used to say; the rules are what it says now.</text>
</svg>
