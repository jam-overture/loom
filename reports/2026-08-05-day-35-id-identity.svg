<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="700" fill="#ffffff"/>

  <text x="32" y="42" font-size="21" fill="#111827">An id that comes back — and whether it is the same node</text>
  <text x="32" y="66" font-size="13" fill="#6b7280">0038. Two revisions of one tree, told twice. Same operations; different node arriving at n_4.</text>

  <!-- ============ LEFT: RESTORATION ============ -->
  <rect x="32" y="92" width="440" height="330" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="52" y="120" font-size="15" fill="#166534">restored — the node that left came back</text>
  <text x="52" y="140" font-size="12" fill="#15803d">what an undo of a remove produces (inverse.ts)</text>

  <!-- rev 1 -->
  <text x="52" y="176" font-size="11" fill="#6b7280">revision 1</text>
  <rect x="52" y="186" width="180" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="207" font-size="12" fill="#111827">n_4</text>
  <text x="64" y="226" font-size="12" fill="#6b7280">loom.card</text>
  <text x="244" y="216" font-size="18" fill="#dc2626">remove</text>

  <!-- departure record -->
  <rect x="52" y="256" width="380" height="40" rx="6" fill="#fef9c3" stroke="#fde047"/>
  <text x="64" y="281" font-size="12" fill="#713f12">left at 1, fingerprint: element n_4 loom.card {} [text n_9 "Body"]</text>

  <!-- rev 2 -->
  <text x="52" y="326" font-size="11" fill="#6b7280">revision 2 — insert</text>
  <rect x="52" y="336" width="180" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="357" font-size="12" fill="#111827">n_4</text>
  <text x="64" y="376" font-size="12" fill="#6b7280">loom.card</text>

  <path d="M 244 363 L 300 363" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <text x="312" y="358" font-size="13" fill="#166534">fingerprints match</text>
  <text x="312" y="376" font-size="12" fill="#15803d">one node, one address</text>

  <!-- ============ RIGHT: RECYCLING ============ -->
  <rect x="508" y="92" width="440" height="330" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="528" y="120" font-size="15" fill="#991b1b">recycled — a different node took the address</text>
  <text x="528" y="140" font-size="12" fill="#b91c1c">every id-joined reading of the log is now ambiguous</text>

  <text x="528" y="176" font-size="11" fill="#6b7280">revision 1</text>
  <rect x="528" y="186" width="180" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="540" y="207" font-size="12" fill="#111827">n_4</text>
  <text x="540" y="226" font-size="12" fill="#6b7280">loom.card</text>
  <text x="720" y="216" font-size="18" fill="#dc2626">remove</text>

  <rect x="528" y="256" width="380" height="40" rx="6" fill="#fef9c3" stroke="#fde047"/>
  <text x="540" y="281" font-size="12" fill="#713f12">left at 1, fingerprint: element n_4 loom.card {} [text n_9 "Body"]</text>

  <text x="528" y="326" font-size="11" fill="#6b7280">revision 2 — insert</text>
  <rect x="528" y="336" width="180" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="540" y="357" font-size="12" fill="#111827">n_4</text>
  <text x="540" y="376" font-size="12" fill="#6b7280">text "Sale"</text>

  <path d="M 720 363 L 776 363" stroke="#dc2626" stroke-width="2" marker-end="url(#red)"/>
  <text x="788" y="358" font-size="13" fill="#991b1b">they differ</text>
  <text x="788" y="376" font-size="12" fill="#b91c1c">one address, two nodes</text>

  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ============ WHERE THE RULE RUNS ============ -->
  <text x="32" y="470" font-size="16" fill="#111827">Where the rule runs — one criterion, two ranges</text>

  <!-- within a delta -->
  <rect x="32" y="486" width="440" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="52" y="512" font-size="14" fill="#1e40af">within one delta — enforced</text>
  <text x="52" y="536" font-size="12" fill="#1e3a8a">applyDelta carries the ids this delta removed</text>
  <text x="52" y="556" font-size="12" fill="#1e3a8a">a different node at one of them → recycled-node-id</text>
  <text x="52" y="576" font-size="12" fill="#1e3a8a">the node that left, unchanged → accepted (undo still works)</text>
  <text x="52" y="596" font-size="12" fill="#6b7280">no new state, no migration</text>

  <!-- across a log -->
  <rect x="508" y="486" width="440" height="120" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="528" y="512" font-size="14" fill="#6b21a8">across a log — reported</text>
  <text x="528" y="536" font-size="12" fill="#581c87">auditSnapshot folds; IdHistory rides along the same pass</text>
  <text x="528" y="556" font-size="12" fill="#581c87">SnapshotAudit.idReturns → /audit, its own finding</text>
  <text x="528" y="576" font-size="12" fill="#581c87">separate from the verdict: a tree can agree and still be ambiguous</text>
  <text x="528" y="596" font-size="12" fill="#6b7280">enforcing here would need retired ids on the tree — escalated</text>

  <!-- the gap -->
  <rect x="32" y="622" width="916" height="46" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="52" y="642" font-size="12" fill="#374151">The gap, stated rather than papered over: a recycling spread across two deltas is still accepted at write time.</text>
  <text x="52" y="660" font-size="12" fill="#6b7280">It is found when someone audits — and nothing schedules an audit yet.</text>
</svg>
