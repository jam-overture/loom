<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="600" fill="#ffffff"/>

  <text x="40" y="46" font-size="21" font-weight="650" fill="#15120e">Where a primitive that throws under every configuration ends up</text>
  <text x="40" y="70" font-size="13.5" fill="#5c5751">The audit knew the difference and a host could not act on it. The difference was a sentence; it is now a field.</text>

  <!-- ================= BEFORE ================= -->
  <text x="40" y="118" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">BEFORE</text>

  <rect x="40" y="132" width="392" height="176" rx="10" fill="#faf8f5" stroke="#e4ded5"/>

  <text x="60" y="160" font-size="13" font-weight="650" fill="#15120e">throwsOnDeclaredProps</text>
  <text x="60" y="179" font-size="11.5" fill="#5c5751">&#8220;a tree the validator accepts can take the page down&#8221;</text>
  <rect x="60" y="189" width="352" height="30" rx="6" fill="#ffffff" stroke="#e4ded5" stroke-dasharray="3 3"/>
  <text x="236" y="208" font-size="12" fill="#a09488" text-anchor="middle" font-style="italic">empty &#8212; the worst case is not here</text>

  <text x="60" y="243" font-size="13" font-weight="650" fill="#15120e">notProbeable</text>
  <text x="60" y="262" font-size="11.5" fill="#5c5751">cannot be asserted empty &#8212; legitimate primitives live here</text>
  <rect x="60" y="272" width="352" height="24" rx="6" fill="#fdf0ec" stroke="#e8bfae"/>
  <text x="72" y="289" font-size="11.5" fill="#8a4b2e">loom.hooked &#183; ClassPrimitive &#183; </text>
  <text x="253" y="289" font-size="11.5" font-weight="700" fill="#b5341a">loom.exploding</text>

  <!-- arrow -->
  <path d="M 452 218 L 496 218" stroke="#c9bfb2" stroke-width="1.5" fill="none"/>
  <path d="M 496 218 l -8 -4.5 l 0 9 z" fill="#c9bfb2"/>

  <!-- ================= AFTER ================= -->
  <text x="516" y="118" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">AFTER</text>

  <rect x="516" y="132" width="364" height="176" rx="10" fill="#f6faf6" stroke="#cfe0cf"/>

  <text x="536" y="160" font-size="13" font-weight="650" fill="#15120e">throwsOnDeclaredProps</text>
  <text x="536" y="179" font-size="11.5" fill="#5c5751">every primitive that threw, complete at last</text>
  <rect x="536" y="189" width="324" height="24" rx="6" fill="#ffffff" stroke="#cfe0cf"/>
  <text x="548" y="206" font-size="11.5" font-weight="700" fill="#2f6b3a">loom.exploding</text>
  <text x="647" y="206" font-size="11" fill="#5c5751">everyConfiguration: true</text>

  <text x="536" y="243" font-size="13" font-weight="650" fill="#15120e">notProbeable</text>
  <text x="536" y="262" font-size="11.5" fill="#5c5751">unchanged &#8212; still a third answer, not a failure</text>
  <rect x="536" y="272" width="324" height="24" rx="6" fill="#faf8f5" stroke="#e4ded5"/>
  <text x="548" y="289" font-size="11.5" fill="#5c5751">loom.hooked &#183; ClassPrimitive &#183; loom.exploding</text>

  <!-- ================= THE LINE ================= -->
  <text x="40" y="358" font-size="12" font-weight="700" fill="#8a8178" letter-spacing="0.08em">THE LINE THE PROBE CAN ACTUALLY DRAW</text>

  <rect x="40" y="374" width="840" height="184" rx="10" fill="#ffffff" stroke="#e4ded5"/>

  <line x1="320" y1="374" x2="320" y2="558" stroke="#efe9e0"/>
  <line x1="600" y1="374" x2="600" y2="558" stroke="#efe9e0"/>

  <!-- col 1 -->
  <rect x="60" y="394" width="10" height="10" rx="2" fill="#8a8178"/>
  <text x="80" y="403" font-size="12.5" font-weight="650" fill="#15120e">cause: not-callable</text>
  <text x="60" y="426" font-size="11.5" fill="#5c5751">Nothing was called at all &#8212; not a</text>
  <text x="60" y="443" font-size="11.5" fill="#5c5751">function, or a class component.</text>
  <text x="60" y="474" font-size="11.5" font-weight="600" fill="#2f6b3a">Never a fault.</text>
  <text x="60" y="497" font-size="11" fill="#8a8178">failures: []</text>
  <text x="60" y="527" font-size="11" fill="#a09488">ClassPrimitive</text>

  <!-- col 2 -->
  <rect x="340" y="394" width="10" height="10" rx="2" fill="#c9a227"/>
  <text x="360" y="403" font-size="12.5" font-weight="650" fill="#15120e">threw, everyConfiguration</text>
  <text x="340" y="426" font-size="11.5" fill="#5c5751">Called, and nothing answered. A</text>
  <text x="340" y="443" font-size="11.5" fill="#5c5751">broken component and a hook-using</text>
  <text x="340" y="460" font-size="11.5" fill="#5c5751">one look identical from out here.</text>
  <text x="340" y="491" font-size="11.5" font-weight="600" fill="#9a7a12">Reported, not concluded.</text>
  <text x="340" y="514" font-size="11" fill="#8a8178">asserted empty by a host with no hooks</text>
  <text x="340" y="537" font-size="11" fill="#a09488">loom.exploding &#183; loom.hooked</text>

  <!-- col 3 -->
  <rect x="620" y="394" width="10" height="10" rx="2" fill="#b5341a"/>
  <text x="640" y="403" font-size="12.5" font-weight="650" fill="#15120e">threw, some answered</text>
  <text x="620" y="426" font-size="11.5" fill="#5c5751">Rendered under one shape and threw</text>
  <text x="620" y="443" font-size="11.5" fill="#5c5751">under another its own schema accepts.</text>
  <text x="620" y="460" font-size="11.5" fill="#5c5751">Nothing legitimate does this.</text>
  <text x="620" y="491" font-size="11.5" font-weight="600" fill="#b5341a">Certain.</text>
  <text x="620" y="514" font-size="11" fill="#8a8178">assertable by every host</text>
  <text x="620" y="537" font-size="11" fill="#a09488">loom.brittle</text>

  <text x="40" y="584" font-size="11" fill="#a09488">No function-call probe can split the middle column: both are functions, both throw, and React&#8217;s hook error is a message rather than a type. 0090 says so rather than guessing.</text>
</svg>
