<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="960" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="32" y="40" font-size="19" font-weight="600" fill="#111827" font-family="ui-sans-serif, system-ui, sans-serif">One walk, many undos</text>
  <text x="32" y="62" font-size="12.5" fill="#6b7280" font-family="ui-sans-serif, system-ui, sans-serif">day 57 — §5, from the store side. `planReverts` plans a page of history rows in one read; each plan is what `planRevert` would have said alone.</text>

  <!-- ================= a row at a time ================= -->
  <text x="32" y="104" font-size="12" font-weight="600" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif">WHAT A PAGE OF `/history` COSTS ASKED A ROW AT A TIME — `planRevert` PER ROW</text>

  <rect x="32" y="118" width="896" height="258" rx="6" fill="#fef2f2" stroke="#fecaca"/>

  <!-- lane 1 -->
  <text x="48" y="160" font-size="10.5" fill="#111827">row 1 → undo r6</text>
  <line x1="176" y1="156" x2="656" y2="156" stroke="#dc2626" stroke-width="5"/>
  <line x1="656" y1="156" x2="816" y2="156" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="656" cy="156" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="836" y="160" font-size="9.5" fill="#6b7280">8 entries read</text>

  <!-- lane 2 -->
  <text x="48" y="200" font-size="10.5" fill="#111827">row 2 → undo r4</text>
  <line x1="176" y1="196" x2="496" y2="196" stroke="#dc2626" stroke-width="5"/>
  <line x1="496" y1="196" x2="816" y2="196" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="496" cy="196" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="836" y="200" font-size="9.5" fill="#6b7280">8 entries read</text>

  <!-- lane 3 -->
  <text x="48" y="240" font-size="10.5" fill="#111827">row 3 → undo r2</text>
  <line x1="176" y1="236" x2="336" y2="236" stroke="#dc2626" stroke-width="5"/>
  <line x1="336" y1="236" x2="816" y2="236" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="336" cy="236" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="836" y="240" font-size="9.5" fill="#6b7280">8 entries read</text>

  <text x="48" y="284" font-size="10" fill="#b91c1c">every row replays the log from the seed again: 3 reads, 3 replays, `O(rows × head)` — and three answers about three moments of a log still being appended to</text>

  <text x="48" y="316" font-size="9.5" fill="#6b7280">the portal would not reimplement the walk to avoid it (0018), so `/history` pays it per row, and the seeded preview never feels it</text>

  <rect x="48" y="330" width="360" height="30" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="60" y="349" font-size="9.5" fill="#111827">replay from the seed</text>
  <line x1="196" y1="345" x2="236" y2="345" stroke="#dc2626" stroke-width="5"/>
  <text x="248" y="349" font-size="9.5" fill="#111827">trail to head</text>
  <line x1="336" y1="345" x2="392" y2="345" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>

  <line x1="480" y1="386" x2="480" y2="412" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= one walk ================= -->
  <text x="32" y="444" font-size="12" font-weight="600" fill="#374151" font-family="ui-sans-serif, system-ui, sans-serif">WHAT THE SAME PAGE COSTS ASKED ONCE — `planReverts(reader, { treeId, revisions: [6, 4, 2], seed })`</text>

  <rect x="32" y="458" width="896" height="182" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>

  <text x="48" y="500" font-size="10.5" fill="#111827">one pass</text>
  <line x1="176" y1="496" x2="656" y2="496" stroke="#059669" stroke-width="5"/>
  <line x1="656" y1="496" x2="816" y2="496" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="336" cy="496" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <circle cx="496" cy="496" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <circle cx="656" cy="496" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="836" y="500" font-size="9.5" fill="#6b7280">8 entries read</text>

  <text x="326" y="482" font-size="9" fill="#6b7280">r2</text>
  <text x="486" y="482" font-size="9" fill="#6b7280">r4</text>
  <text x="646" y="482" font-size="9" fill="#6b7280">r6</text>

  <line x1="336" y1="516" x2="816" y2="516" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="496" y1="532" x2="816" y2="532" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="656" y1="548" x2="816" y2="548" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="836" y="520" font-size="9" fill="#6b7280">discards, r2</text>
  <text x="836" y="536" font-size="9" fill="#6b7280">discards, r4</text>
  <text x="836" y="552" font-size="9" fill="#6b7280">discards, r6</text>

  <text x="48" y="584" font-size="10" fill="#047857">one read, one replay, the three trails walked together — and the replay stops at the last target, so a delta that fails after it cannot contradict a plan already finished</text>
  <text x="48" y="606" font-size="9.5" fill="#6b7280">the head-ward trail genuinely differs per target, so it stays per target; the forward replay does not, so it is walked once</text>
  <text x="48" y="626" font-size="9.5" fill="#6b7280">`planRevert` is now this walk told to look for one revision — one implementation, so the batch cannot drift from the single</text>

  <!-- ================= the contract ================= -->
  <rect x="32" y="656" width="896" height="44" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="48" y="676" font-size="10" fill="#111827">the property the tests hold: for every revision, `planReverts(...).get(r)` deep-equals `planRevert(..., r)` — including out-of-range, a gap, a delta that no longer applies, and a target that cannot be inverted</text>
  <text x="48" y="692" font-size="9.5" fill="#6b7280">1259 runtime tests across 89 files, 522 portal, 11 added · `pnpm verify` green · no decision record: additive, reversible, and enforced by the equivalence tests rather than by direction</text>
</svg>
