<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <style>
    .t { fill: #18181b; }
    .m { fill: #52525b; }
    .box { fill: #fafafa; stroke: #d4d4d8; }
    .ok { fill: #f0fdf4; stroke: #86efac; }
    .bad { fill: #fef2f2; stroke: #fca5a5; }
    .okt { fill: #166534; }
    .badt { fill: #991b1b; }
    .line { stroke: #a1a1aa; }
    .dead { stroke: #fca5a5; }
    text { font-size: 13px; }
    .h { font-size: 15px; font-weight: 700; }
    .k { font-size: 11px; letter-spacing: .06em; }
    .mono { font-size: 11.5px; font-family: "Geist Mono", ui-monospace, monospace; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #fafafa } .m { fill: #a1a1aa }
      .box { fill: #1c1c1f; stroke: #3f3f46 }
      .ok { fill: #0d2017; stroke: #15803d }
      .bad { fill: #220f0f; stroke: #b91c1c }
      .okt { fill: #4ade80 } .badt { fill: #f87171 }
      .line { stroke: #52525b } .dead { stroke: #b91c1c }
    }
  </style>

  <text class="h t" x="24" y="30">What held the documentation site's colours to the palette they are copied from</text>

  <!-- BEFORE -->
  <text class="k badt" x="24" y="64">BEFORE — 3 NOVEMBER</text>

  <rect class="box" x="24" y="78" width="200" height="60" rx="6"/>
  <text class="t" x="38" y="102">the registered palette</text>
  <text class="mono m" x="38" y="122">src/theme/library.ts</text>

  <rect class="box" x="300" y="78" width="200" height="60" rx="6"/>
  <text class="t" x="314" y="102">the furniture's colours</text>
  <text class="mono m" x="314" y="122">(docs)/globals.css</text>

  <rect class="bad" x="576" y="78" width="300" height="60" rx="6"/>
  <text class="badt" x="590" y="102">a hex typed into the test</text>
  <text class="mono badt" x="590" y="122">toContain("--surface-page: #ffffff")</text>

  <path class="dead" stroke-dasharray="5 4" d="M224 108 H296" fill="none"/>
  <text class="mono badt" x="232" y="100">copied by hand</text>
  <path class="line" d="M500 108 H572" fill="none"/>
  <text class="mono m" x="512" y="100">checked</text>

  <text class="badt" x="24" y="166">The palette is at neither end of the only check, so it can move and nothing goes red.</text>
  <text class="m" x="24" y="186">It did. `--ink-faint` was `#6f6f7a` against a `fg-subtle` of `#8a8a94` that 0074 changed to `#6e6e78` on 20 August —</text>
  <text class="m" x="24" y="204">the value the chrome had departed *to* by hand. Ten weeks, and a comment citing a number held nowhere in the repository.</text>

  <!-- AFTER -->
  <text class="k okt" x="24" y="252">AFTER</text>

  <rect class="box" x="24" y="266" width="200" height="60" rx="6"/>
  <text class="t" x="38" y="290">the registered palette</text>
  <text class="mono m" x="38" y="310">src/theme/library.ts</text>

  <rect class="box" x="300" y="266" width="200" height="60" rx="6"/>
  <text class="t" x="314" y="290">the furniture's colours</text>
  <text class="mono m" x="314" y="310">(docs)/globals.css</text>

  <rect class="ok" x="576" y="266" width="300" height="60" rx="6"/>
  <text class="okt" x="590" y="290">the correspondence, read off both</text>
  <text class="mono okt" x="590" y="310">(docs)/_lib/chrome-palette.ts</text>

  <path class="line" stroke-dasharray="5 4" d="M224 296 H296" fill="none"/>
  <text class="mono m" x="232" y="288">copied by hand</text>

  <path class="line" d="M700 266 V236 H124 V332" fill="none" marker-end="url(#a)"/>
  <path class="line" d="M700 326 V356 H400 V332" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#a1a1aa"/>
    </marker>
  </defs>

  <text class="okt" x="24" y="392">33 colours, each named as a copy of a slot, a stated departure from one, or a colour the palette has not got.</text>
  <text class="m" x="24" y="412">A colour in none of the three lists fails. A departure equal to its slot fails. `color-scheme` is read from `themeGround`.</text>

  <rect class="ok" x="24" y="428" width="852" height="28" rx="6"/>
  <text class="okt" x="38" y="447">Measured: moving `minimal`'s `bg-canvas` leaves all 38 chrome tests green on `main`, and turns this branch red naming the slot.</text>
</svg>
