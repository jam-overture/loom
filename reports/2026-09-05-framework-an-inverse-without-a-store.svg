<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="660" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" font-weight="650" fill="#15120e">An inverse in hand, without a store</text>
  <text x="40" y="70" font-size="13.5" fill="#5c5751">The runtime computed the undo. The only way to offer one back went through a log the front door does not have.</text>

  <!-- BEFORE -->
  <rect x="40" y="96" width="404" height="308" rx="10" fill="#fdf6f3" stroke="#e8cfc2"/>
  <text x="58" y="122" font-size="10.5" font-weight="700" fill="#a8674a" letter-spacing="0.06em">BEFORE — ONE PATH, THROUGH A STORE</text>

  <rect x="58" y="138" width="368" height="42" rx="7" fill="#ffffff" stroke="#d8cec2"/>
  <text x="242" y="156" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15120e" text-anchor="middle">assessReversibility → Reversibility.inverse</text>
  <text x="242" y="171" font-size="10" fill="#8a8178" text-anchor="middle">computed on every change, then thrown away</text>

  <line x1="150" y1="180" x2="150" y2="206" stroke="#c9bfb2" stroke-width="1.4"/>
  <line x1="334" y1="180" x2="334" y2="206" stroke="#c9bfb2" stroke-width="1.4"/>

  <!-- portal path, works -->
  <rect x="58" y="206" width="184" height="86" rx="7" fill="#ffffff" stroke="#d8cec2"/>
  <text x="150" y="226" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15120e" text-anchor="middle">revertRevision</text>
  <text x="150" y="243" font-size="10" fill="#8a8178" text-anchor="middle">plans by replaying a store</text>
  <text x="150" y="258" font-size="10" fill="#8a8178" text-anchor="middle">RevertablePlan.target =</text>
  <text x="150" y="272" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8178" text-anchor="middle">StoredRevision</text>
  <text x="150" y="286" font-size="10" font-weight="650" fill="#4a7a52" text-anchor="middle">✓ portal, demo</text>

  <!-- marketing path, blocked -->
  <rect x="258" y="206" width="168" height="86" rx="7" fill="#ffffff" stroke="#e0b9a5"/>
  <text x="342" y="226" font-size="11" fill="#15120e" text-anchor="middle">a stateless surface</text>
  <text x="342" y="243" font-size="10" fill="#8a8178" text-anchor="middle">holds the inverse already</text>
  <text x="342" y="258" font-size="10" fill="#8a8178" text-anchor="middle">no log, nothing to contest</text>
  <text x="342" y="278" font-size="15" font-weight="700" fill="#b06a4a" text-anchor="middle">✕</text>

  <text x="242" y="318" font-size="10.5" fill="#a8674a" text-anchor="middle">The whole path was reachable only through a store,</text>
  <text x="242" y="332" font-size="10.5" fill="#a8674a" text-anchor="middle">so the front door wrote its own — about thirty lines,</text>
  <text x="242" y="346" font-size="10.5" fill="#a8674a" text-anchor="middle">most of them provenance — and filed the workaround.</text>

  <rect x="58" y="358" width="368" height="32" rx="6" fill="#ffffff" stroke="#e0b9a5" stroke-dasharray="3 3"/>
  <text x="242" y="378" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a8674a" text-anchor="middle">(marketing)/_lib/adapt/undo.ts</text>

  <!-- AFTER -->
  <rect x="476" y="96" width="404" height="308" rx="10" fill="#f4f8f4" stroke="#cadfc9"/>
  <text x="494" y="122" font-size="10.5" font-weight="700" fill="#4a7a52" letter-spacing="0.06em">AFTER — ONE INTERPRETER, TWO CALLERS</text>

  <rect x="494" y="138" width="368" height="42" rx="7" fill="#ffffff" stroke="#d8cec2"/>
  <text x="678" y="156" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15120e" text-anchor="middle">inverseInterpreter(inverse, terms, ids, clock)</text>
  <text x="678" y="171" font-size="10" fill="#8a8178" text-anchor="middle">src/runtime/ — no store dependency</text>

  <line x1="586" y1="180" x2="586" y2="206" stroke="#c9bfb2" stroke-width="1.4"/>
  <line x1="770" y1="180" x2="770" y2="206" stroke="#c9bfb2" stroke-width="1.4"/>

  <rect x="494" y="206" width="184" height="86" rx="7" fill="#ffffff" stroke="#cadfc9"/>
  <text x="586" y="226" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#15120e" text-anchor="middle">revertInterpreter</text>
  <text x="586" y="243" font-size="10" fill="#8a8178" text-anchor="middle">= it, plus what a log knows:</text>
  <text x="586" y="258" font-size="10" fill="#8a8178" text-anchor="middle">the revision, and</text>
  <text x="586" y="272" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8178" text-anchor="middle">discards</text>
  <text x="586" y="286" font-size="10" font-weight="650" fill="#4a7a52" text-anchor="middle">✓ unchanged — 21 tests untouched</text>

  <rect x="694" y="206" width="168" height="86" rx="7" fill="#ffffff" stroke="#cadfc9"/>
  <text x="778" y="226" font-size="11" fill="#15120e" text-anchor="middle">any stateless surface</text>
  <text x="778" y="243" font-size="10" fill="#8a8178" text-anchor="middle">passes the inverse it holds</text>
  <text x="778" y="258" font-size="10" fill="#8a8178" text-anchor="middle">and names its own stamp</text>
  <text x="778" y="278" font-size="15" font-weight="700" fill="#4a7a52" text-anchor="middle">✓</text>

  <text x="678" y="318" font-size="10.5" fill="#4a7a52" text-anchor="middle">Same seam, same head check, same provenance grade,</text>
  <text x="678" y="332" font-size="10.5" fill="#4a7a52" text-anchor="middle">same Gate. An undo is judged like any other change</text>
  <text x="678" y="346" font-size="10.5" fill="#4a7a52" text-anchor="middle">whether or not a store was ever involved.</text>

  <rect x="494" y="358" width="368" height="32" rx="6" fill="#ffffff" stroke="#cadfc9"/>
  <text x="678" y="378" font-size="10.5" fill="#4a7a52" text-anchor="middle">nothing in (marketing) was touched, and nothing needs to be</text>

  <!-- the required terms -->
  <rect x="40" y="428" width="840" height="132" rx="10" fill="#fbfaf8" stroke="#e2dcd3"/>
  <text x="58" y="454" font-size="10.5" font-weight="700" fill="#5c5751" letter-spacing="0.06em">THE ONE DEPARTURE FROM WHAT WAS ASKED FOR — 0109</text>
  <text x="58" y="478" font-size="12" fill="#15120e">The finding proposed <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">inverseInterpreter(inverse, ids, clock)</tspan>. That signature has to default the interpreter stamp to something.</text>

  <rect x="58" y="492" width="392" height="52" rx="7" fill="#fdf6f3" stroke="#e8cfc2"/>
  <text x="72" y="512" font-size="11" fill="#a8674a">if it defaulted to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">REVERT_INTERPRETER</tspan></text>
  <text x="72" y="530" font-size="10.5" fill="#a8674a">unrelated callers share one stamp — and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">(demo)</tspan> reads it</text>

  <rect x="470" y="492" width="392" height="52" rx="7" fill="#f4f8f4" stroke="#cadfc9"/>
  <text x="484" y="512" font-size="11" fill="#4a7a52"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">terms.interpreter</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">terms.rationale</tspan> are required</text>
  <text x="484" y="530" font-size="10.5" fill="#4a7a52">one line at the call site; the stamp stays narrow enough to mean something</text>

  <text x="40" y="596" font-size="11" fill="#8a8178">pnpm verify green, exit 0 — 1,953 runtime tests across 124 files (8 new), 2,497 application tests across 158.</text>
  <text x="40" y="616" font-size="11" fill="#8a8178">Baseline on this branch beforehand: 1,945 and 2,497, also green.</text>
</svg>
