  <text class="title" x="24" y="36">Two slots a reader is meant to tell apart, across 21 palettes</text>
  <text class="sub" x="24" y="58">CIELAB ΔE between the pair in each starter palette. One dot per palette.</text>
  <text class="sub" x="24" y="76">Red is under the just-noticeable difference: two things that look like one thing.</text>
