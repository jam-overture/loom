<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #18181b; }
    .m { fill: #52525b; }
    .ok { fill: #dcfce7; stroke: #16a34a; }
    .bad { fill: #fee2e2; stroke: #dc2626; }
    .box { fill: #f4f4f5; stroke: #d4d4d8; }
    .okt { fill: #166534; }
    .badt { fill: #991b1b; }
    .wire { stroke: #a1a1aa; fill: none; }
    .wirebad { stroke: #dc2626; fill: none; }
    .wireok { stroke: #16a34a; fill: none; }
    text { font-size: 13px; }
    .h { font-size: 16px; font-weight: 700; }
    .sh { font-size: 13px; font-weight: 700; }
    .k { font-size: 11px; letter-spacing: .06em; font-weight: 700; }
    .mono { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #09090b }
      .t { fill: #fafafa } .m { fill: #a1a1aa }
      .ok { fill: #14532d; stroke: #4ade80 }
      .bad { fill: #7f1d1d; stroke: #f87171 }
      .box { fill: #27272a; stroke: #52525b }
      .okt { fill: #4ade80 } .badt { fill: #f87171 }
      .wire { stroke: #71717a } .wirebad { stroke: #f87171 } .wireok { stroke: #4ade80 }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="560"/>

  <text class="h t" x="24" y="32">The gate and the command that satisfies it were reading two different sets of files</text>
  <text class="m" x="24" y="54">One 8×8 PNG written into `reports/` and not added, on `main` at `eb591ce`. Reproduced before anything was changed.</text>

  <rect class="bad" x="24" y="70" width="11" height="11" rx="2"/>
  <text class="k badt" x="42" y="80">BEFORE — two private calls</text>
  <rect class="ok" x="470" y="70" width="11" height="11" rx="2"/>
  <text class="k okt" x="488" y="80">AFTER — governed.ts, read by both</text>

  <!-- BEFORE -->
  <rect class="box" x="24" y="100" width="190" height="46" rx="6"/>
  <text class="sh t" x="38" y="121">reports:shrink</text>
  <text class="mono m" x="38" y="138">ls-files</text>

  <rect class="box" x="24" y="300" width="190" height="60" rx="6"/>
  <text class="sh t" x="38" y="321">reports:check</text>
  <text class="mono m" x="38" y="338">ls-files --cached --others</text>
  <text class="mono m" x="38" y="353">  --exclude-standard</text>

  <rect class="bad" x="268" y="190" width="150" height="46" rx="6"/>
  <text class="mono badt" x="278" y="211">reports/shot.png</text>
  <text class="mono badt" x="278" y="227">untracked</text>

  <path class="wirebad" d="M 214 123 L 244 123 L 244 180" marker-end="url(#a)" stroke-dasharray="4 4"/>
  <text class="badt" x="222" y="168" font-size="11">blind</text>
  <path class="wire" d="M 214 330 L 244 330 L 244 246" marker-end="url(#a)"/>
  <text class="m" x="222" y="268" font-size="11">sees it</text>

  <rect class="box" x="24" y="166" width="190" height="34" rx="6"/>
  <text class="mono t" x="34" y="187">“nothing to shrink”</text>
  <rect class="box" x="24" y="246" width="190" height="34" rx="6"/>
  <text class="mono badt" x="34" y="267">“run reports:shrink”</text>

  <path class="wirebad" d="M 119 280 L 119 300" marker-end="url(#a)"/>
  <path class="wirebad" d="M 119 146 L 119 166" marker-end="url(#a)"/>
  <path class="wirebad" d="M 24 183 L 10 183 L 10 263 L 24 263" marker-end="url(#a)"/>

  <text class="badt sh" x="268" y="268">A closed loop.</text>
  <text class="m" x="268" y="286" font-size="12">The gate's advice is advice</text>
  <text class="m" x="268" y="302" font-size="12">the other command cannot</text>
  <text class="m" x="268" y="318" font-size="12">take. The way out —</text>
  <text class="m" x="268" y="334" font-size="12">`git add` first — is</text>
  <text class="m" x="268" y="350" font-size="12">written nowhere. Two calls,</text>
  <text class="m" x="268" y="366" font-size="12">each correct on its own.</text>

  <!-- AFTER -->
  <rect class="box" x="470" y="100" width="180" height="46" rx="6"/>
  <text class="sh t" x="484" y="121">reports:shrink</text>
  <text class="mono m" x="484" y="138">governedFiles(root)</text>

  <rect class="box" x="676" y="100" width="180" height="46" rx="6"/>
  <text class="sh t" x="690" y="121">reports:check</text>
  <text class="mono m" x="690" y="138">governedFiles(root)</text>

  <rect class="ok" x="470" y="196" width="386" height="62" rx="6"/>
  <text class="sh okt" x="484" y="217">tools/reports/governed.ts</text>
  <text class="mono okt" x="484" y="236">ls-files -z --cached --others</text>
  <text class="mono okt" x="484" y="251">  --exclude-standard</text>

  <path class="wireok" d="M 560 146 L 560 196" marker-end="url(#a)"/>
  <path class="wireok" d="M 766 146 L 766 196" marker-end="url(#a)"/>

  <rect class="ok" x="470" y="288" width="386" height="46" rx="6"/>
  <text class="mono okt" x="484" y="309">stored 1 of 1 visuals as .webp</text>
  <text class="mono okt" x="484" y="325">citations rewritten in 1 files</text>
  <path class="wireok" d="M 560 258 L 560 288" marker-end="url(#a)"/>

  <text class="m" x="470" y="356" font-size="12">No `git add`, which is what `routines.md` described all along:</text>
  <text class="m" x="470" y="372" font-size="12">the documentation was right and the tool was wrong.</text>

  <!-- the second defect -->
  <rect class="box" x="24" y="400" width="832" height="64" rx="6"/>
  <text class="sh t" x="38" y="421">A second defect was in the same line, and nobody had filed it</text>
  <text class="m" x="38" y="440" font-size="12">The citation rewrite also read tracked files only — and a report written *this run* is untracked. A run that applied the `git add`</text>
  <text class="m" x="38" y="456" font-size="12">workaround to its pictures but not its report got the pictures converted and the citation left pointing at the `.png` just deleted.</text>

  <rect class="box" x="24" y="478" width="832" height="58" rx="6"/>
  <text class="sh t" x="38" y="499">The property is checked, not the two call sites</text>
  <text class="m" x="38" y="518" font-size="12">`governed.test.ts` fails if any module in that directory but `governed.ts` names `ls-files`, so the third command cannot pick a</text>
  <text class="m" x="38" y="531" font-size="12">third set. Confirmed to fail on a planted second mention — `['governed.ts', 'shrink.ts']` — rather than assumed to.</text>
</svg>
