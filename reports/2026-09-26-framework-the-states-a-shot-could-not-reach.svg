<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .bg { fill: #ffffff }
    .t { fill: #16181d; font-size: 12.5px }
    .dim { fill: #6b7280; font-size: 11.5px }
    .h { fill: #16181d; font-size: 12.5px; font-weight: 700 }
    .title { fill: #16181d; font-size: 17px; font-weight: 700; font-family: ui-sans-serif, system-ui, sans-serif }
    .sub { fill: #6b7280; font-size: 12.5px; font-family: ui-sans-serif, system-ui, sans-serif }
    .ok { fill: #0f7b4f; font-size: 12.5px }
    .rule { stroke: #e5e7eb; stroke-width: 1 }
    .box { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1 }
    .greenbox { fill: #f0fdf6; stroke: #a6e9c5; stroke-width: 1 }
    .arrow { stroke: #9ca3af; stroke-width: 1.2; fill: none; marker-end: url(#a) }
    .newline { stroke: #0f7b4f; stroke-width: 1.4; fill: none; marker-end: url(#ag) }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#0f7b4f"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="560"/>
  <text class="title" x="32" y="42">One timeline, and the two places a shot could not stand on it</text>
  <text class="sub" x="32" y="64">`pnpm shoot`, before and after. Green is new.</text>

  <line class="rule" x1="32" y1="86" x2="948" y2="86"/>

  <text class="h" x="32" y="120">BEFORE</text>
  <line class="arrow" x1="120" y1="150" x2="900" y2="150"/>
  <text class="dim" x="120" y="140">context opens</text>
  <text class="dim" x="300" y="140">first paint</text>
  <text class="dim" x="470" y="140">load done</text>
  <text class="dim" x="640" y="140">a `do` list runs</text>

  <line class="rule" x1="305" y1="146" x2="305" y2="154"/>
  <line class="rule" x1="475" y1="146" x2="475" y2="154"/>
  <line class="rule" x1="645" y1="146" x2="645" y2="154"/>

  <rect class="box" x="640" y="168" width="280" height="86" rx="4"/>
  <text class="t" x="656" y="190">click · fill · wait · waitFor</text>
  <text class="dim" x="656" y="210">everything downstream of a load,</text>
  <text class="dim" x="656" y="228">and nothing else</text>
  <text class="dim" x="656" y="246">0159, 0182</text>

  <text class="dim" x="128" y="196">the page has already read what it</text>
  <text class="dim" x="128" y="214">reads by the time there is anything</text>
  <text class="dim" x="128" y="232">to press — so a record that will not</text>
  <text class="dim" x="128" y="250">parse, one carried from another</text>
  <text class="dim" x="128" y="268">machine, and storage the reader</text>
  <text class="dim" x="128" y="286">blocked are unreachable</text>
  <text class="dim" x="128" y="310">a scroll position is not a press —</text>
  <text class="dim" x="128" y="328">the driver scrolls only far enough</text>
  <text class="dim" x="128" y="346">to expose what it is about to click</text>

  <text class="dim" x="640" y="290">8 pictures, 3 lanes, taken by</text>
  <text class="dim" x="640" y="308">hand-written Playwright in /tmp</text>

  <line class="rule" x1="32" y1="368" x2="948" y2="368"/>

  <text class="h" x="32" y="402">AFTER</text>
  <line class="arrow" x1="120" y1="432" x2="900" y2="432"/>
  <line class="rule" x1="305" y1="428" x2="305" y2="436"/>
  <line class="rule" x1="475" y1="428" x2="475" y2="436"/>
  <line class="rule" x1="645" y1="428" x2="645" y2="436"/>

  <rect class="greenbox" x="120" y="452" width="290" height="78" rx="4"/>
  <text class="ok" x="136" y="474">start: { storage: { … } }</text>
  <text class="ok" x="136" y="494">start: { storageBlocked: true }</text>
  <text class="dim" x="136" y="516">data, never a script — 0195</text>
  <line class="newline" x1="200" y1="452" x2="200" y2="440"/>

  <rect class="greenbox" x="640" y="452" width="280" height="78" rx="4"/>
  <text class="ok" x="656" y="474">{ scrollTo: "&lt;selector&gt;" }</text>
  <text class="dim" x="656" y="496">the fifth step, strict like click</text>
  <text class="dim" x="656" y="516">0159 and 0182, no new record</text>
  <line class="newline" x1="740" y1="452" x2="740" y2="440"/>
</svg>
